<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="153" height="20" role="img" aria-labelledby="t d">
  <!--
    The "CI has the Zoomies" badge, served at https://zoomies.sh/badge.svg.

    It is self-contained on purpose: a README badge is fetched through
    GitHub's image proxy, which follows no stylesheet, no web font and no
    second request, so the paw/swish mark is carried inline as a tiny PNG
    made from docs/brand/paw-swish-white.png and the text is pinned to a
    width with textLength, so it lays out the same whichever font a viewer
    has. Zoomies Black on the left, Runner Blue on the right, white on both:
    the three colours docs/brand.md gives a badge to use.
  -->
  <title id="t">CI has the Zoomies</title>
  <desc id="d">This repository's continuous integration runs on self-hosted GitHub Actions runners managed by Zoomies.</desc>
  <clipPath id="r"><rect width="153" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="49" height="20" fill="#080808"/>
    <rect x="49" width="104" height="20" fill="#2F80ED"/>
  </g>
  <image x="5" y="4" width="20" height="12.5" xlink:href="data:image/png;base64,"/>
  <g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="29" y="14" textLength="15" lengthAdjust="spacingAndGlyphs">CI</text>
    <text x="55" y="14" textLength="92" lengthAdjust="spacingAndGlyphs">has the zoomies</text>
  </g>
</svg>
