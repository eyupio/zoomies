name: Set up Go
description: >-
  Install the Go release every workflow builds and tests with, and cache its
  modules and build output.

# The version is written here, and nowhere else in the workflows. It used to be
# repeated in six workflows, and the copies drifted: the staticcheck job sat on
# 1.27.1, fuzz and CodeQL followed go.mod (also 1.27.1), the pinned golang image
# the controller image builds on was 1.27.1, and everything else was 1.27.2.
#
# It is deliberately not read from go.mod. go.mod holds the floor a contributor
# needs, which is lower than what CI builds and releases with, and a `toolchain`
# line there would raise that floor for every contributor. A test in
# internal/docs holds this version to go.mod's minor release and to the
# Dockerfile's, and holds every workflow to this action.
#
# 1.27.3 carries the fix for GO-2026-6809, in which crypto/x509 trusted a
# compromised intermediate certificate. The Proxmox setup verifies a
# certificate, so the standard library the build and the tests run on is the
# one that matters here.
#
# Where the runner has the pool's shared cache folder, the modules and the build
# output go there and the action's own cache is switched off. That cache is
# about 830 MB, and a runner on this fleet restored it from GitHub at about
# 1 MB/s: eleven minutes, then an expired-signature failure on the download, and
# the 15-minute limit on the planning job cancelled the run before any test
# started. The pool's folder is on the host's own disk, is safe to share between
# concurrent jobs (the Go toolchain locks and verifies both caches), and is
# empty only on the first run. A GitHub-hosted runner has no such folder and
# keeps the action's cache, as does a runner whose folder is not writable.
#
# The modules and the build output are two top-level folders and not one, on
# purpose. A pool's cache size limit is enforced by deleting whole top-level
# entries, oldest first, so a single go folder holding both was deleted whole
# (modules and all) the moment the cache passed the limit, and a limit below its
# size wiped it at every start. The build output is the large part, several
# gigabytes after a day of CI, and rebuilding it is cheap; the modules are small
# and cost a download, so they are the entry worth keeping.
runs:
  using: composite
  steps:
    - id: pool
      shell: bash
      run: |
        use=false
        mod=/opt/zoomies-cache/go-mod
        build=/opt/zoomies-cache/go-build
        if [ "$RUNNER_OS" = Linux ] && [ -d /opt/zoomies-cache ] \
          && mkdir -p "$mod" "$build" 2>/dev/null && [ -w "$mod" ] && [ -w "$build" ]; then
          use=true
          echo "GOMODCACHE=$mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$build" >> "$GITHUB_ENV"
        fi
        echo "use=$use" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: ${{ steps.pool.outputs.use != 'true' }}
