name: Cleanup Old Container Images

# CI and release workflows publish four GHCR package families. Moving tags such
# as dev, main, and latest are updated in place, while multi-platform buildx
# manifests and cache layers can leave untagged package versions behind.
#
# Delete only untagged versions and retain a small rollback buffer. Tagged
# versions, including release, SHA, runner-variant, dev, main, and latest tags,
# are never selected for deletion.

on:
  schedule:
    - cron: "47 2 * * *" # daily at 02:47 UTC
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup ${{ matrix.package }}
    runs-on: zoomies-linux-x64
    strategy:
      fail-fast: false
      matrix:
        package:
          - zoomies
          - zoomies-agent
          - zoomies-runner
          - zoomies-runner-docker
    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 10
          token: ${{ github.token }}
