name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  binaries:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tag is v1.2.3 and the version a binary reports is 1.2.3. Both jobs
      # work it out the same way, because a release whose native install says
      # 1.2.3 and whose image says v1.2.3 is one release with two names --
      # in `zoomies version`, in /meta, in the User-Agent GitHub sees and in
      # the zoomies_build_info metric.
      - id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.release.outputs.version }}
      # install.sh verifies the checksum of what it downloads, so this file is
      # part of the security story, not just a convenience.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/zoomies_*
            dist/checksums.txt
          generate_release_notes: true
          draft: true

  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@9309da73a81f66976a6d750572e221508b1e2682 # v1.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}
      - id: release
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release.outputs.date }}
          tags: |
            ghcr.io/eyupio/zoomies:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies:latest
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eyupio/zoomies-runner:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies-runner:latest

      # The same file's other target: the runner plus a Docker CLI, for pools
      # whose docker_mode gives jobs a daemon to talk to. It shares every layer
      # below the client, so the second build is cheap.
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eyupio/zoomies-runner-docker:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies-runner-docker:latest
