name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  binaries:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache: true }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make dist VERSION=${GITHUB_REF_NAME#v}
      # install.sh verifies the checksum of what it downloads, so this file is
      # part of the security story, not just a convenience.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zoomies_*
            dist/checksums.txt
          generate_release_notes: true
          draft: true

  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/eyupio/zoomies:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies:latest

  # One job per operating system in internal/naming's catalogue. Keep the two
  # in step: a variant published here that the catalogue does not list is an
  # image no pool can ask for, and a catalogue row with no job here is a pool
  # whose runners will not start.
  runner-images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: ubuntu-2404
            base: ubuntu:24.04
            family: apt
            os: ubuntu
            version: "24.04"
            latest: true
          - tag: ubuntu-2204
            base: ubuntu:22.04
            family: apt
            os: ubuntu
            version: "22.04"
          - tag: debian-12
            base: debian:12-slim
            family: apt
            os: debian
            version: "12"
          - tag: fedora-42
            base: fedora:42
            family: dnf
            os: fedora
            version: "42"
          - tag: rocky-9
            base: rockylinux/rockylinux:9
            family: dnf
            os: rocky
            version: "9"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
          # The moving tag, the immutable one for this release, and -- for the
          # default variant only -- :latest, which is what a pool that names no
          # operating system gets.
          tags: |
            ghcr.io/eyupio/zoomies-runner:${{ matrix.tag }}
            ghcr.io/eyupio/zoomies-runner:${{ matrix.tag }}-${{ github.ref_name }}
            ${{ matrix.latest && format('ghcr.io/eyupio/zoomies-runner:{0}', 'latest') || '' }}
            ${{ matrix.latest && format('ghcr.io/eyupio/zoomies-runner:{0}', github.ref_name) || '' }}
