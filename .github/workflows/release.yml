name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  binaries:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tag is v1.2.3 and the version a binary reports is 1.2.3. Both jobs
      # work it out the same way, because a release whose native install says
      # 1.2.3 and whose image says v1.2.3 is one release with two names --
      # in `zoomies version`, in /meta, in the User-Agent GitHub sees and in
      # the zoomies_build_info metric.
      - id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.release.outputs.version }}
      # install.sh verifies the checksum of what it downloads, so this file is
      # part of the security story, not just a convenience.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/zoomies_*
            dist/checksums.txt
          generate_release_notes: true
          draft: true

  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}
      - id: release
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release.outputs.date }}
          tags: |
            ghcr.io/eyupio/zoomies:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies:latest

  # One job per operating system in internal/naming's catalogue, each building
  # both of deploy/Dockerfile.runner's targets. Keep the two lists in step:
  # a variant published here that the catalogue does not list is an image no
  # pool can ask for, and a catalogue row with no job here is a pool whose
  # runners will not start. TestWorkflowMatricesCoverTheCatalogue fails if they
  # drift apart.
  runner-images:
    name: Runner image (${{ matrix.tag }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: ubuntu-2404, base: "ubuntu:24.04",            family: apt, os: ubuntu, version: "24.04", default: true }
          - { tag: ubuntu-2204, base: "ubuntu:22.04",            family: apt, os: ubuntu, version: "22.04" }
          - { tag: debian-12,   base: "debian:12-slim",          family: apt, os: debian, version: "12" }
          - { tag: fedora-42,   base: "fedora:42",               family: dnf, os: fedora, version: "42" }
          - { tag: rocky-9,     base: "rockylinux/rockylinux:9", family: dnf, os: rocky,  version: "9" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only the default variant carries the unqualified tags. Anything else
      # would mean a pool that named no operating system got whichever variant
      # this matrix happened to finish last.
      - id: tags
        name: Work out the tags
        env:
          IS_DEFAULT: ${{ matrix.default && 'true' || 'false' }}
          TAG: ${{ matrix.tag }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          for image in zoomies-runner zoomies-runner-docker; do
            {
              echo "${image}<<EOF"
              echo "ghcr.io/eyupio/$image:$TAG"
              echo "ghcr.io/eyupio/$image:$TAG-$REF"
              if [ "$IS_DEFAULT" = "true" ]; then
                echo "ghcr.io/eyupio/$image:$REF"
                echo "ghcr.io/eyupio/$image:latest"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.zoomies-runner }}

      # The same file's other target: the runner plus a Docker CLI, for pools
      # whose docker_mode gives jobs a daemon to talk to. It shares every layer
      # below the client, so the second build is cheap.
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.zoomies-runner-docker }}
