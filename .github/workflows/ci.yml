name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go:embed needs the directory to exist even when the UI is not built.
      - name: Stub the embedded UI
        run: make build-nogui

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  drill:
    name: Drill
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Only this job, and only to append its own rows to the drill record on the
    # default branch: the record is worth nothing unless a run keeps it, and
    # every other job here reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The runtime tier runs the built binary as two real processes. It needs
      # no Docker daemon and no GitHub credentials: the backend is `process`
      # with a stub runner staged on disk, and GitHub is a fake in the test
      # process. That is what makes it something every pull request can afford.
      # Where the record ends before this run appends to it, so the summary and
      # the commit below carry this run's rows rather than the whole history.
      - name: Note where the drill record ends
        id: record
        run: echo "lines=$(wc -l < roadmap/validation/drills.md 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Run the lifecycle drill
        run: make test-drill

      # The load measurement runs here too, for its assertions rather than its
      # figures: every read still answers, and a deep page is still a page of
      # rows, with a month of history under it. The timings go to the job
      # summary and nowhere else -- a runner's p95 is not a gate, and the
      # recorded evidence is written by `make measure` on a known machine.
      - name: Measure the reads a page makes
        run: make measure LOAD_RECORD=$RUNNER_TEMP/load.md

      - name: Load record
        if: always()
        run: cat "$RUNNER_TEMP/load.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The record is the deliverable, not just the exit code: it says what was
      # observed and whether anything was left for a person to clean up. The
      # summary carries this run's rows only -- the history belongs in the file.
      - name: Drill record
        if: always()
        run: |
          if [ -f roadmap/validation/drills.md ]; then
            tail -n +$(( ${{ steps.record.outputs.lines }} + 1 )) roadmap/validation/drills.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # A row that reaches one job summary and nowhere else cannot be compared
      # with the row before it, and comparison is the whole reason for keeping
      # these: a drill that recovered cleanly forty times and then did not is a
      # finding only if the forty are still there. So the rows are committed,
      # from the default branch only -- a pull request's rows describe a commit
      # that may never exist.
      #
      # A push made with GITHUB_TOKEN starts no workflow run, which is what
      # stops this step from triggering itself for ever.
      - name: Keep the rows
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          rows="$RUNNER_TEMP/rows.md"
          tail -n +$(( ${{ steps.record.outputs.lines }} + 1 )) roadmap/validation/drills.md > "$rows"
          if [ ! -s "$rows" ]; then
            echo "The drills wrote no rows, so there is nothing to keep."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The rows are held in $rows from here on, so the working tree goes
          # back to what was checked out -- appending to a file that already
          # carries this run's rows would write them twice.
          git reset --hard
          # Another push can land while the drills run, so the rows are appended
          # to whatever main is by then rather than to the copy this run started
          # with. The file is a log: its lines do not conflict, they just follow
          # whatever is already there.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -B drill-record FETCH_HEAD
            cat "$rows" >> roadmap/validation/drills.md
            git add roadmap/validation/drills.md
            git commit -m "Record what the drills observed on ${GITHUB_SHA}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved while the drills ran; appending to where it is now (attempt $attempt)."
            git reset --hard FETCH_HEAD
          done
          echo "Could not keep the drill rows after three attempts."
          exit 1

  upgrade:
    name: Upgrade
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # This is the one job that runs two builds of Zoomies: the last published
      # release, installed the way an operator installs it, and the build under
      # test on top of it. It is also the only check that install.sh can still
      # find a release at all -- everything else about the installer is a syntax
      # check.
      - name: Pick the latest installable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(python - <<'PY'
          import os
          import json
          import urllib.request

          repo = "eyupio/zoomies"
          asset = "zoomies_linux_amd64"
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = "token " + token
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  releases = json.load(resp)
              if not releases:
                  break
              for release in releases:
                  names = {a.get("name") for a in release.get("assets", [])}
                  if asset in names:
                      print(release["tag_name"])
                      raise SystemExit(0)
              page += 1
          raise SystemExit(f"no published release has the {asset} asset")
          PY
          )
          echo "ZOOMIES_VERSION=$tag" >> "$GITHUB_ENV"
      - name: Upgrade the last published release to this build
        run: make test-upgrade

  staticcheck:
    name: staticcheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make build-nogui
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false

  ui:
    name: UI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      # The generated client must match api/openapi.yaml. If it does not, the
      # UI is typed against an API that no longer exists.
      - name: The generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api/schema.d.ts \
            || { echo "::error::src/lib/api/schema.d.ts is stale. Run 'make openapi' and commit the result."; exit 1; }
        working-directory: web
      - run: npm run check
        working-directory: web
      # The build fails on its own if the gzipped shell exceeds the 200 KB
      # budget documented in docs/ui-guidelines.md.
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webdist
          path: internal/api/webdist
          retention-days: 3

  playwright:
    name: Playwright
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webdist
          path: internal/api/webdist
      - run: go build -o zoomies ./cmd/zoomies
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  build-matrix:
    name: Cross-compile
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webdist
          path: internal/api/webdist
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/zoomies ./cmd/zoomies

  installer:
    name: install.sh
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: POSIX shell syntax
        run: |
          # dash is the strictest POSIX sh most users will have; install.sh must
          # parse under it, not just under bash.
          sudo apt-get update -qq && sudo apt-get install -y -qq dash shellcheck
          dash -n install.sh
          shellcheck -s sh install.sh
          dash -n test/install/install-check.sh
          shellcheck -s sh test/install/install-check.sh
          shellcheck deploy/runner-entrypoint.sh
          dash -n test/upgrade/upgrade-check.sh
          shellcheck -s sh test/upgrade/upgrade-check.sh
          # The runner image's own scripts run under whatever /bin/sh the base
          # image has, which on Debian is not bash. Globbed rather than listed,
          # so a new one is covered by existing.
          for f in deploy/runner-*.sh; do
            # The entrypoint is bash and is checked as bash, above.
            case "$f" in deploy/runner-entrypoint.sh) continue ;; esac
            dash -n "$f"
            shellcheck -s sh "$f"
          done

      - name: What install.sh does on a host that already has the binary
        run: |
          # Syntax checking is not behaviour checking, and the difference is why
          # a re-run of the controller's own join command used to drop the join.
          # Run under dash as well as sh, since that is what most hosts have.
          TEST_SH=dash test/install/install-check.sh install.sh

  images:
    name: Images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Publishing needs to write packages; everything else here only reads.
    permissions:
      contents: read
      packages: write
    env:
      CONTROLLER_IMAGE: ghcr.io/eyupio/zoomies
      AGENT_IMAGE: ghcr.io/eyupio/zoomies-agent
      RUNNER_IMAGE: ghcr.io/eyupio/zoomies-runner
      RUNNER_DOCKER_IMAGE: ghcr.io/eyupio/zoomies-runner-docker
    # The runner-images job below repeats none of these decisions; it reads them
    # from here, so a change to what publishes only has to be made once.
    outputs:
      publish: ${{ steps.publish.outputs.value }}
      platforms: ${{ steps.platforms.outputs.list }}
      runner: ${{ steps.changed.outputs.runner }}
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      # Full history: the "what changed" step below diffs against a base commit
      # that a shallow clone does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # Whether this run publishes anything. Only main does. A pull request --
      # from a fork especially -- is untrusted code carrying a read-only token,
      # and has no business writing to the registry: it builds the images to
      # prove the Dockerfiles still work, and pushes nothing.
      - id: publish
        name: Decide whether to publish
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # main publishes :dev, :main and :sha-<commit>.
      #
      # Not :latest. That tag is the release workflow's, and while both wrote it
      # the last one to run won: a merge to main overwrote the :latest a release
      # had just published, so an operator who pulled it got an unreleased build
      # and a controller stamped main-sha-abc1234 -- which no installer can
      # match a host to, because agents are installed from release assets.
      #
      # :dev says what it is. Someone who wants main asks for main; :latest
      # means the newest release, which is what everyone else expects it to
      # mean.
      - id: tags
        name: Work out the tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - if: steps.publish.outputs.value == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}

      # arm64 is emulated, and emulated apt plus an emulated 200 MB download is
      # the difference between a two-minute job and a twenty-minute one. A pull
      # request proves the Dockerfiles still build; main proves they still build
      # for both architectures, and publishes both.
      - id: platforms
        name: Decide the platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is only needed for the architecture this machine is not.
      - if: steps.platforms.outputs.list != 'linux/amd64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # v2 made this required and derives nothing when it is missing. Without
          # it the action warns, builds on a throwaway local builder with no
          # sticky disk, and every image build refetches every module and every
          # package from scratch -- which is how one reset stream from the module
          # proxy failed a build whose go.mod had not changed. The value is the
          # Dockerfile, as the action's own description asks, and it matches
          # release.yml so a tagged build reuses the layers main already built.
          cache-key: deploy/Dockerfile
          # Fail rather than quietly downgrade. The fallback warning ran on every
          # image build for a day and nobody read it; a red job is the only kind
          # of notice that works.
          nofallback: true

      # Which images actually need building. The runner image is by far the
      # most expensive thing in this workflow -- it apt-installs a desktop's
      # worth of build dependencies and downloads the ~200 MB actions/runner
      # tarball -- so it is built only when something that goes into it changed.
      # Nothing else in the repository does: the image is the actions/runner
      # release, its dependencies, and the entrypoint.
      #
      # Runs after the builder is set up, because deciding needs a registry
      # lookup.
      - id: changed
        name: Work out what changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLISH: ${{ steps.publish.outputs.value }}
        run: |
          set -eu
          build_it() { echo "runner=true" >> "$GITHUB_OUTPUT"; exit 0; }

          # Skipping the build is only safe while :main already points at an
          # image built from these files. On the first publish it points at
          # nothing at all, and "unchanged" would leave it that way.
          if [ "$PUBLISH" = "true" ]; then
            for image in "$RUNNER_IMAGE" "$RUNNER_DOCKER_IMAGE"; do
              if ! docker buildx imagetools inspect "$image:main" >/dev/null 2>&1; then
                echo "$image:main is not in the registry yet; building it." >> "$GITHUB_STEP_SUMMARY"
                build_it
              fi
            done
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_it
          fi

          # A base we cannot resolve -- a force push, a branch's first commit --
          # tells us nothing about what changed, so assume the worst.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            build_it
          fi

          if git diff --name-only "$BASE" HEAD |
             grep -qE '^deploy/(Dockerfile\.runner|runner-entrypoint\.sh|runner-[a-z-]+\.sh)$'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the controller image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ steps.publish.outputs.value }}
          # Without these, `zoomies version` inside a published image reports
          # the Dockerfile's "dev" default, and nothing in the image says which
          # commit it came from.
          build-args: |
            VERSION=main-${{ steps.tags.outputs.sha }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:dev
            ${{ env.CONTROLLER_IMAGE }}:main
            ${{ env.CONTROLLER_IMAGE }}:${{ steps.tags.outputs.sha }}

      # The agent image, which nothing built until now.
      #
      # deploy/Dockerfile has carried an `agent` target all along and no
      # workflow named it, so the only way to run an agent in a container was to
      # run the controller image and override its command. An agent host that
      # wants a container now has one that says what it is.
      - name: Build the agent image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ steps.publish.outputs.value }}
          build-args: |
            VERSION=main-${{ steps.tags.outputs.sha }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.AGENT_IMAGE }}:dev
            ${{ env.AGENT_IMAGE }}:main
            ${{ env.AGENT_IMAGE }}:${{ steps.tags.outputs.sha }}

      - name: Say what happened
        env:
          PUBLISH: ${{ steps.publish.outputs.value }}
          RUNNER_BUILT: ${{ steps.changed.outputs.runner }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          set -eu
          {
            if [ "$RUNNER_BUILT" != "true" ]; then
              echo "The runner images were not rebuilt: nothing under deploy/ that goes into them changed."
              echo
            fi
            if [ "$PUBLISH" != "true" ]; then
              echo "Nothing was published: images are pushed from main only."
            else
              echo "Published:"
              echo
              echo "- \`$CONTROLLER_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
              echo "- \`$AGENT_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
              if [ "$RUNNER_BUILT" = "true" ]; then
                echo "- \`$RUNNER_IMAGE:latest\`, \`:main\`, \`:$SHA_TAG\`"
                echo "- \`$RUNNER_DOCKER_IMAGE:latest\`, \`:main\`, \`:$SHA_TAG\`"
              else
                echo "- \`$RUNNER_IMAGE:latest\` and \`$RUNNER_DOCKER_IMAGE:latest\` are unchanged, and still current."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # One build per operating system in internal/naming's catalogue, each
  # building both of deploy/Dockerfile.runner's targets.
  #
  # It is a separate job from `images` because it is the expensive half -- five
  # variants, each downloading the ~200 MB actions/runner archive and a build
  # toolchain -- and only runs when something that goes into the image changed.
  # A pull request builds amd64 only and publishes nothing; main builds both
  # architectures and publishes every variant.
  #
  # TestWorkflowMatricesCoverTheCatalogue keeps this list and internal/naming's
  # catalogue in step, so a new operating system cannot be half-added.
  runner-images:
    name: Runner image (${{ matrix.tag }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [images]
    if: needs.images.outputs.runner == 'true'
    permissions:
      contents: read
      packages: write
    env:
      RUNNER_IMAGE: ghcr.io/eyupio/zoomies-runner
      RUNNER_DOCKER_IMAGE: ghcr.io/eyupio/zoomies-runner-docker
    strategy:
      fail-fast: false
      matrix:
        # Generated from internal/naming's catalogue by `make generate`. Adding
        # or swapping an operating system is a row there, not here.
        # zoomies:catalogue-begin
        include:
          - { tag: ubuntu-2404, base: "ubuntu:24.04",            family: apt, os: ubuntu, version: "24.04", platforms: "linux/amd64,linux/arm64", default: true }
          - { tag: ubuntu-2204, base: "ubuntu:22.04",            family: apt, os: ubuntu, version: "22.04", platforms: "linux/amd64" }
          - { tag: debian-12,   base: "debian:12-slim",          family: apt, os: debian, version: "12",    platforms: "linux/amd64,linux/arm64" }
          - { tag: fedora-42,   base: "fedora:42",               family: dnf, os: fedora, version: "42",    platforms: "linux/amd64,linux/arm64" }
          - { tag: rocky-9,     base: "rockylinux/rockylinux:9", family: dnf, os: rocky,  version: "9",     platforms: "linux/amd64,linux/arm64" }
        # zoomies:catalogue-end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.images.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: needs.images.outputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # Per variant, not per Dockerfile: the five variants share
          # Dockerfile.runner but almost none of its layers -- different base
          # images, different package managers -- so one key between them would
          # thrash rather than cache.
          cache-key: deploy/Dockerfile.runner-${{ matrix.tag }}
          nofallback: true

      # Only the default variant carries the unqualified tags. Anything else
      # would mean a pool that named no operating system got whichever variant
      # this matrix happened to finish last.
      - id: tags
        name: Work out the tags
        env:
          IS_DEFAULT: ${{ matrix.default && 'true' || 'false' }}
          TAG: ${{ matrix.tag }}
          SHA_TAG: ${{ needs.images.outputs.sha }}
        run: |
          set -eu
          for image in "$RUNNER_IMAGE" "$RUNNER_DOCKER_IMAGE"; do
            key="${image##*/}"
            {
              echo "$key<<EOF"
              echo "$image:$TAG"
              echo "$image:$TAG-main"
              echo "$image:$TAG-$SHA_TAG"
              if [ "$IS_DEFAULT" = "true" ]; then
                echo "$image:latest"
                echo "$image:main"
                echo "$image:$SHA_TAG"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          # A pull request builds one architecture to stay fast; main and a
          # dispatch build the set this variant is actually published for,
          # which is not the same for every row -- see internal/naming.
          platforms: ${{ needs.images.outputs.platforms == 'linux/amd64' && 'linux/amd64' || matrix.platforms }}
          push: ${{ needs.images.outputs.publish }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.zoomies-runner }}

      # The variant with a Docker CLI, for pools whose docker_mode gives jobs a
      # daemon. Everything below the client is a layer the step above just
      # built, so this costs one package install rather than another image.
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: ${{ needs.images.outputs.platforms == 'linux/amd64' && 'linux/amd64' || matrix.platforms }}
          push: ${{ needs.images.outputs.publish }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.zoomies-runner-docker }}

      # EXTRA_PACKAGES is a documented way to bake a fleet's own toolchain into
      # a variant without forking the Dockerfile, and nothing above exercises
      # it: it could stop reaching the image entirely and every build in this
      # workflow would still pass. So each variant is built once more with it
      # set, and the result is run.
      #
      # That is cheap because deploy/runner-extra.sh is the image's last layer:
      # everything beneath it is a cache hit from the build above. Doing it on
      # every row rather than one covers both package families, which is the
      # only thing that script branches on. amd64 only, because a
      # multi-platform image cannot be loaded into the local daemon to run.
      - name: Build the variant with an extra package
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            EXTRA_PACKAGES=tree
          tags: zoomies-runner-extra-packages:${{ matrix.tag }}

      - name: The extra package is in the image
        env:
          IMAGE: zoomies-runner-extra-packages:${{ matrix.tag }}
        run: |
          set -eu
          # `tree` is in no variant's own package list, so finding it on PATH
          # can only mean the build argument arrived.
          docker run --rm --entrypoint tree "$IMAGE" --version
