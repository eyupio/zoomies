name: CodeQL

# Only a change to code either analysis reads: Go for one, the UI and any other
# JavaScript, TypeScript or HTML for the other. A change to prose or to the
# install script gave CodeQL nothing new to find and held a fleet slot for
# twenty minutes finding it. The weekly run still covers main in full, which is
# what catches a query that learnt something new about unchanged code.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "**.js"
      - "**.mjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "**.js"
      - "**.mjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: zoomies-linux-x64
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go for analysis
        if: matrix.language == 'go'
        run: make build-nogui
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
