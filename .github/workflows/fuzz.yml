name: Fuzz

# The fuzz targets are the encryption boundaries in internal/cryptox, so only a
# change there, or to the toolchain it is built with, can find anything new.
# The weekly run keeps fuzzing main regardless.
on:
  push:
    branches: [main]
    paths:
      - "internal/cryptox/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "internal/cryptox/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: zoomies-linux-x64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseKey, FuzzSealOpen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz encryption boundaries
        env:
          TARGET: ${{ matrix.target }}
          DURATION: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
        run: go test ./internal/cryptox -run '^$' -fuzz "^${TARGET}$" -fuzztime "$DURATION" -parallel 2
      - name: Preserve failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/cryptox/testdata/fuzz/
          if-no-files-found: ignore
