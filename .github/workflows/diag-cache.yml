name: diag-cache
on:
  push:
    branches: [claude/diag-cache]
permissions:
  contents: read
jobs:
  diag:
    runs-on: zoomies-linux-x64
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    steps:
      - name: Is the cache wrapper live in this runner
        shell: bash
        run: |
          hostname
          echo "--- node dirs: a wrapped node is small and has a node.real beside it"
          for d in /home/runner/externals/node20/bin /home/runner/externals/node24/bin; do
            echo "$d"; ls -l "$d" | grep -E " node(\.real)?$"
          done
          echo "--- service address and reach"
          echo "ZOOMIES_CACHE_SERVICE_URL=${ZOOMIES_CACHE_SERVICE_URL:-unset}"
          [ -n "${ZOOMIES_CACHE_SERVICE_URL:-}" ] && curl -sS -m 5 -o /dev/null -w "service answered HTTP %{http_code}\n" "$ZOOMIES_CACHE_SERVICE_URL" || true
          echo "--- pool cache folder"
          ls -ld /opt/zoomies-cache /opt/zoomies-cache/go 2>&1; du -sh /opt/zoomies-cache/go 2>/dev/null || true
