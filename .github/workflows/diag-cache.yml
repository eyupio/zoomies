name: diag-cache
on:
  push:
    branches: [claude/diag-cache]
permissions:
  contents: read
jobs:
  diag:
    runs-on: zoomies-linux-x64
    timeout-minutes: 10
    steps:
      - name: Is the wrapper in this runner image
        shell: bash
        run: |
          echo "--- wrapper files the current image installs"
          ls -l --time-style=full-iso /usr/local/lib/zoomies/ 2>&1 | head -20
          echo "--- node dirs, sizes and dates"
          for d in /home/runner/externals/node*/bin; do echo "$d"; ls -l --time-style=long-iso "$d" | grep -E " node(\.real)?$"; done
          echo "--- newest file in the image's runner dir, as a proxy for its build date"
          ls -lt --time-style=long-iso /home/runner | head -5
          echo "--- image-level markers"
          ls -l --time-style=long-iso /etc/zoomies* /usr/local/share/zoomies* 2>&1 | head -10
          cat /etc/zoomies-release 2>/dev/null | head -5 || true
