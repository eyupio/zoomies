# What keeps the pins current. Every action in the workflows is pinned to a
# commit with its release in a comment, and Dependabot moves both together;
# the Go modules, the UI's npm packages and the base images under deploy/ are
# the other three things this repository builds from. One grouped pull request
# per ecosystem per week is one review rather than a dozen, and a week is
# short enough that a security fix is never far behind its advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    ignore:
      # openapi-typescript currently only supports TypeScript 5.x, so a major
      # bump would leave every npm install path red until that peer range moves.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      images:
        patterns: ["*"]
