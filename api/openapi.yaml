          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }

  /jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cancelJobWorkflow
      tags: [jobs]
      summary: Cancel the GitHub workflow run containing a job
      description: >-
        Asks GitHub to cancel the whole workflow run, not only this job. The
        request is asynchronous; Zoomies keeps the job pending until a webhook
        or the fallback poller confirms its terminal state. Requires the opt-in
        setting and GitHub App Actions write permission.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Bypass conditions that may leave an ordinary cancellation stuck.
      responses:
        "202":
          description: GitHub accepted the cancellation request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, force, run_id]
                properties:
                  accepted: { type: boolean }
                  force: { type: boolean }
                  run_id: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobEvents
      tags: [jobs]
      summary: A job's timeline
      description: >-
        What Zoomies observed and did about one job, oldest first, each entry a sentence
        an operator can read. Entries are written from what each delivery changed rather
        than from the delivery itself, so GitHub redelivering one adds nothing. Every
        change to the timeline is accompanied by a `job.updated` frame on the event
        stream, which is when a client refetches it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/explanation:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobExplanation
      tags: [jobs]
      summary: Why this job is where it is
      description: >-
        One answer to "why is this job not running?", computed on the controller from the
        last scheduler plan, the pool it was claimed by, and the runner and host behind
        it. It is a separate endpoint rather than a field on the job because it is
        computed from the fleet around the job rather than from its row, so a cached copy
        of the job delivered by the event stream would carry a stale one. The drawer, the
        CLI and the support bundle render this same answer, so they cannot disagree.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExplanation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/facets:
    get:
      operationId: getJobFacets
      tags: [jobs]
      summary: Distinct values for the job filter menus
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos: { type: array, items: { type: string } }
                  workflows: { type: array, items: { type: string } }
                  conclusions: { type: array, items: { type: string } }

  # ==========================================================================
  # Hosts
  # ==========================================================================
  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      summary: List hosts
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Host" }

  /hosts/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getHost
      tags: [hosts]
      summary: Get a host
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateHost
      tags: [hosts]
      summary: Update a host's capacity, labels or reserve
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Every field is optional and independent; what is not named is left alone.
                The reserve is what this machine keeps for itself, in the units the host
                reports its own figures in. A reserve on a figure the host has never
                reported, or one that would leave nothing to place on, is refused rather
                than clamped.
              properties:
                capacity: { type: integer, minimum: 0 }
                labels: { type: object, additionalProperties: { type: string } }
                reserve_cpus: { type: integer, minimum: 0 }
                reserve_memory_mb: { type: integer, format: int64, minimum: 0 }
                reserve_disk_mb: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
    delete:
      operationId: deleteHost
      tags: [hosts]
      summary: Remove a host
      description: Refused while the host still has live runners, unless forced.
      x-zoomies-role: admin
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /hosts/{id}/cordon:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cordonHost
      tags: [hosts]
      summary: Cordon or uncordon a host
      description: A cordoned host keeps its existing runners and accepts no new ones.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cordoned]
              properties:
                cordoned: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }

  /join-tokens:
    get:
      operationId: listJoinTokens
      tags: [hosts]
      summary: List join tokens
      description: The secret itself is never returned; only its prefix, for identification.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JoinToken" }
    post:
      operationId: createJoinToken
      tags: [hosts]
      summary: Mint a join token
      description: |
        Returns the plaintext token **once**, along with a ready-to-paste
        command for the new host. Single-use, and short-lived by default.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: string, default: "15m", examples: ["15m", "1h"] }
                capacity:
                  type: integer
                  default: 2
                  minimum: 0
                  description: 0 lets the agent decide from the host's CPU count.
                labels: { type: object, additionalProperties: { type: string } }
                connection:
                  type: string
                  enum: [direct, tailcat]
                  default: direct
                  description: Tailcat creates a private encrypted agent connection and supplies its address in the returned commands.
                controller_url:
                  type: string
                  format: uri
                  description: |
                    The address the new host should join on, used in the
                    returned command in place of `server.external_url`. The
                    UI sends the address the browser reached this controller
                    on, which is the one a machine beside it can usually reach
                    too. Must be an absolute http or https URL.
                  examples: ["https://zoomies.example.com"]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JoinToken"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Shown once. Only its hash is stored.
                      join_command:
                        type: string
                        description: Command for an existing binary. Contains credentials; shown only in this response.
                      command:
                        type: string
                        description: The one-liner to run on the new host.
                        examples: ["curl -fsSL https://zoomies.sh/install.sh | sh -s -- --mode agent --controller https://zoomies.example.com --join-token zoojoin_... --version v1.0.0"]
                      controller_version:
                        type: string
                        description: The concrete controller build the command was generated by.
                        examples: ["main-sha-abc1234 (abc1234)"]
                      install_tag:
                        type: string
                        description: The binary and image channel selected for the new host.
                        examples: ["dev"]
                      version_note:
                        type: string
                        description: >-
                          Why the command could not be pinned to this controller's build, or
                          absent when it was. Main builds use the rolling dev asset; only local
                          or otherwise unpublished builds have no matching install tag.

  /join-tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJoinToken
      tags: [hosts]
      summary: Get a join token
      description: |
        The token's state, never its secret. Once a host has redeemed it,
        `used_by_id` is that host's id -- which is how the Add-a-host page
        knows the machine it is waiting for has arrived.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinToken" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteJoinToken
      tags: [hosts]
      summary: Revoke an unused join token
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Migrations
  # ==========================================================================
  /migrations/plan:
    post:
      operationId: planMigration
      tags: [migrations]
      summary: What moving these repositories onto Zoomies would change
      description: |
        Reads the workflow files in the repositories a GitHub App installation
        can see, and reports the `runs-on` lines it would rewrite, the ones it
        would leave alone and why, and a unified diff of each change.

        It writes nothing. Everything it returns is a proposal for the operator
        to edit before `POST /migrations/pull-requests` acts on it.

        With no `mapping`, the server proposes one from the pools that exist,
        matching each GitHub-hosted label against the pool that promises the
        same operating system and architecture. A label with no plausible pool
        is left unmapped rather than mapped approximately, and appears in
        `unmapped`.

        `mapping` is one answer per label for every repository, which is what
        most fleets want. `overrides` are the exceptions to it: each names one
        job in one workflow file in one repository and sends it somewhere else,
        or -- with an empty `to` -- leaves that one job on GitHub's runners.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: Limits the plan to these repositories. Empty means every repository the installation can see, up to the server's limit.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                  description: >-
                    Hosted label to the runs-on value that replaces it, e.g.
                    {"ubuntu-latest": "zoomies-linux-x64"}. Empty asks the server to propose one.
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`, each naming one job in one workflow file in one
                    repository. Empty is the common case: most fleets want one answer per
                    hosted-runner label everywhere.
                cursor:
                  type: string
                  description: >-
                    The page of repositories to read: the `next_cursor` a previous plan
                    returned, which is the full name of the last repository it listed.
                    Empty starts at the first page. Ignored when `repos` names repositories.
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /migrations/pull-requests:
    post:
      operationId: openMigrationPullRequests
      tags: [migrations]
      summary: Open the pull requests a plan described
      description: |
        Opens one pull request per repository, each on its own branch, changing
        only the workflow files whose `runs-on` the mapping covers.

        The plan is recomputed here from the repositories' current contents
        rather than taken from the client: the workflows may have changed since
        the review step, and accepting file contents from a browser would make
        this a way to write arbitrary files into any repository the App can
        reach. Every file is committed against the blob SHA it was read at, so a
        push that lands in between is a conflict rather than a silent revert.

        The App needs three permissions the rest of Zoomies does not:
        Contents (write), Pull requests (write) and Workflows (write). The plan
        endpoint reports which are missing before anything is attempted.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, repos]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: The repositories to open pull requests on. Required; this endpoint never defaults to every repository an App can see.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`. A request with no mapped label is accepted when at
                    least one override carries a `to`, because pointing three jobs at a pool by
                    name is a migration too.
                workflows:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                  description: >-
                    Narrows a repository to these workflow files, keyed by repository, e.g.
                    {"acme/widgets": [".github/workflows/ci.yml"]}. A repository left out of
                    the map gets every file the mapping would change. A path that is not
                    directly under .github/workflows is rejected.
                title: { type: string, description: Overrides the default pull request title. }
                body: { type: string, description: Overrides the generated body, which lists what moved and what was left alone. }
                commit_message: { type: string, description: Overrides the default commit message. }
      responses:
        "200":
          description: What happened to each repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOutcome" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Audit
  # ==========================================================================
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: The audit log
      x-zoomies-role: viewer
      parameters:
        - { name: actor_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: action, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/actions:
    get:
      operationId: listAuditActions
      tags: [audit]
      summary: Distinct action names, for the filter menu
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: string } }

  # ==========================================================================
  # Administration
  # ==========================================================================
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 12, format: password, description: Omit for an account that will sign in through OIDC. }
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getUser
      tags: [admin]
      summary: Get a user
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Reset a user's password
      description: Sets `must_change_password`, so the user picks their own on next sign-in.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 12, format: password }
      responses:
        "204": { description: Reset }

  /tokens:
    get:
      operationId: listTokens
      tags: [admin]
      summary: List API tokens
      description: Metadata only. The token value exists in plaintext exactly once, at creation.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    post:
      operationId: createToken
      tags: [admin]
      summary: Create an API token
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, examples: ["prometheus"] }
                role: { $ref: "#/components/schemas/Role" }
                scopes:
                  type: array
                  items: { type: string, examples: ["pools:read", "runners:write"] }
                  description: Optional narrowing within the role. Empty means whatever the role allows.
                expires_in: { type: string, examples: ["2160h"], description: Omit for a token that never expires, which is worth avoiding. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIToken"
                  - type: object
                    properties:
                      token: { type: string, description: Shown once. }

  /tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: revokeToken
      tags: [admin]
      summary: Revoke an API token
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /recovery:
    get:
      operationId: getRecovery
      tags: [recovery]
      summary: Whether this fleet is held for recovery
      description: >-
        A restored database is marked for recovery, and a controller that reads that mark
        decides as normal and applies none of it: no runner is created, drained or
        removed, nothing is reaped from GitHub, and the fallback poller does not sweep.
        The plan is still computed and published, so an operator can see exactly what
        would happen the moment the fence is lifted -- and can tell "nothing to do" from
        "not allowed to". A fenced instance answers `/readyz` with 503; liveness is
        unaffected, so its container runtime does not restart it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  /recovery/unfence:
    post:
      operationId: unfence
      tags: [recovery]
      summary: Lift the recovery fence
      description: >-
        A person saying that a recovered fleet has been checked and may act on the world
        again. It is audited under its own action, because the audit log is where somebody
        later asks who decided that and when. Lifting an unfenced instance succeeds and
        changes nothing: two operators recovering one fleet will both press it.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  /diagnostics/bundle:
    get:
      operationId: getSupportBundle
      tags: [diagnostics]
      summary: A support bundle for this instance
      description: >-
        Everything a bug report needs about this controller in one JSON document: the
        build and the process, the effective configuration and its findings, the current
        problems, the fleet's installations, pools, hosts and runners, the work in flight
        with the controller's own explanation for each of it, and the recent scheduler
        decisions. It is assembled from the same renderings the other routes serve, so a
        section that is secret-free on its own route is secret-free here.


        It never carries workflow log bodies. There is no redaction pass for them and
        there cannot be a reliable one, so the bundle carries runner ids and the download
        route instead and an operator attaches logs deliberately.


        Assembly is section by section: a section that fails costs its own contents and
        lands in `errors` rather than failing the whole document, because the moment a
        bundle is taken is the moment a query is most likely to fail. Sections are capped
        by row count and the whole document by bytes; anything shortened says so in
        `truncated`.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportBundle" }

  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: The effective configuration
      description: Every secret is blanked. The validator's findings are included so the UI can show them next to the setting they concern.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Change the settings that are safe to change at runtime
      description: |
        Retention, scheduler tunables, the poll interval and the log level.
        Anything needing a restart is rejected with a message saying which
        setting it was and that the process must be restarted.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Agent routes
  # ==========================================================================
  # The half of the API agents talk to. These carry an agent token, never a
  # user session, and an agent can reach nothing else. They are here so that
  # this document is the whole surface it says it is, and marked x-internal
  # because no general client should call them: the wire types are owned by
  # internal/agent/protocol.go, and a client generator should skip them.
  /agent/join:
    post:
      operationId: agentJoin
      tags: [agent]
      x-internal: true
      summary: Redeem a join token and enrol a host
      description: >-
        The one anonymous agent route, because it is the call that mints the credential every
        other one carries. The join token is single-use and short-lived; the agent token in
        the response is shown exactly once, and the controller keeps only its hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentJoinRequest" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentJoinResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent/heartbeat:
    post:
      operationId: agentHeartbeat
      tags: [agent]
      x-internal: true
      summary: Report that the host is alive, and what its runners are doing
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHeartbeatRequest" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHeartbeatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The host was deleted. No amount of retrying brings the row back; the agent re-joins. }

  /agent/tasks:
    get:
      operationId: agentPollTasks
      tags: [agent]
      x-internal: true
      summary: Long-poll for work
      description: Blocks until the host has work or the wait elapses, so a task reaches an agent the instant it is queued while an idle agent makes two or three requests a minute.
      security: [{ agentAuth: [] }]
      parameters:
        - name: wait
          in: query
          description: Seconds to wait for work before answering with an empty batch.
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: The tasks queued for this host, possibly none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTaskBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/results:
    post:
      operationId: agentReportResult
      tags: [agent]
      x-internal: true
      summary: Report the outcome of one task
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTaskResult" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agent/report:
    post:
      operationId: agentReportRunners
      tags: [agent]
      x-internal: true
      summary: Report what the host's runners are doing, outside a heartbeat
      description: The body is a bare array of runner reports, because that is what the agent sends and the two halves of the protocol must agree.
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RunnerReport" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/logs/{stream_id}:
    post:
      operationId: agentRelayLogs
      tags: [agent]
      x-internal: true
      summary: Relay a runner's output to a viewer
      description: >-
        The inverted half of log streaming. The controller never dials an agent, so a viewer's
        request makes it queue a stream_logs task, and the agent answers by opening this
        chunked POST, which stays open for as long as the runner produces output. Exempt from
        the body-size limit for that reason.
      security: [{ agentAuth: [] }]
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string }, description: The stream named by the stream_logs task. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: The stream ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Nobody is watching this stream any more; the agent stops sending. }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zoomies_session
      description: Set by `POST /auth/login`. HttpOnly, SameSite=Lax, and Secure when the external URL is https.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zoo_<prefix>_<secret>
      description: An API token. Not subject to the same-origin check, because it is not vulnerable to CSRF.
    agentAuth:
      type: http
      scheme: bearer
      bearerFormat: zooagent_<secret>
      description: >-
        An agent's own token, minted by `POST /agent/join`. Accepted on `/agent/*` only: a
        user credential is refused there, and an agent token is refused everywhere else.

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The resource ID, e.g. `pool_k3f9qz2m`.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Sort:
      name: sort
      in: query
      description: A column name. An unknown value falls back to the default rather than erroring, so a stale bookmark does not break the page.
      schema: { type: string }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    Unauthorized:
      description: Not signed in, or the credential was rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Signed in, but the role is not sufficient. The message says which role is needed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: The request was understood but is not valid. `errors` names the fields.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  errors: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
    RateLimited:
      description: Too many attempts. Retry-After says how long to wait.
      headers:
        Retry-After:
          description: Seconds until the address is allowed another attempt.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # --- primitives -------------------------------------------------------
    Role:
      type: string
      enum: [viewer, operator, admin]
    TargetType:
      type: string
      enum: [org, repo]
    BackendKind:
      type: string
      enum: [docker, podman, process]
    PullPolicy:
      type: string
      enum: [if-not-present, always, pinned-only]
      default: if-not-present
      description: pinned-only requires an image@sha256 digest and rejects mutable tags.

    DockerMode:
      type: string
      enum: [none, dind, host-socket]
      description: |
        How much Docker a job on this pool gets.
        `none` is the default and the only one that is not a warning.
        `dind` gives a private, privileged sidecar daemon.
        `host-socket` hands the job the host's daemon, and with it root on the host.
        Either of those switches a pool on the stock `ghcr.io/eyupio/zoomies-runner`
        image under a moving tag (none, `latest` or `main`) to
        `ghcr.io/eyupio/zoomies-runner-docker` under the same tag as it is saved,
        because the stock image has no client for the daemon. A pinned tag, a
        digest, or an image of your own is left as given.
    RunnerState:
      type: string
      enum: [provisioning, registering, idle, busy, draining, removed, failed]
    JobState:
      type: string
      enum: [waiting, queued, in_progress, completed]
    Severity:
      type: string
      enum: [error, warning, info]
    Duration:
      type: string
      description: A Go duration string.
      examples: ["5m", "1h30s"]

    Page:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: Rows matching the filter, not rows returned. }
        limit: { type: integer }
        offset: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, unprocessable, too_large, rate_limited, internal]
            message: { type: string, description: Written for a person to read, and to act on. }
            field: { type: string }
            detail: { type: string }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [labels] }
        message: { type: string, examples: ["a pool needs at least one label your workflows can ask for"] }

    HostExclusion:
      type: object
      required: [host, code, reason]
      properties:
        host: { type: string, examples: [zoomies-12vcpu-31gb-debian-12] }
        code:
          type: string
          description: Which placement rule turned this host down.
          enum: [unavailable, backend, platform, size]
        reason:
          type: string
          description: A sentence about the host with its name left out, so a caller can put the name where its own layout wants it.
          examples: ["it has 12 CPU to place on, and one runner of this pool is charged 16, twice what it asks for, because a docker-in-docker runner is charged for its sidecar too"]

    Problem:
      type: object
      required: [code, severity, title]
      properties:
        code: { type: string, examples: [bind.public_no_tls] }
        severity: { $ref: "#/components/schemas/Severity" }
        setting: { type: string, examples: [server.bind] }
        title: { type: string, description: One line - what is true. }
        detail: { type: string, description: Why it matters, and the consequence. }
        fix: { type: string, description: What to change, concretely. }
        target_kind: { type: string }
        target_id: { type: string }
        alternatives:
          type: array
          description: >-
            The choices the fix leaves open, when the fix is a choice. For a pool
            no host can run, these are the backends its hosts do offer, so the UI
            can put the change one click away.
          items: { $ref: "#/components/schemas/BackendKind" }
          examples: [[podman]]
        since: { type: string, format: date-time }

    # --- meta -------------------------------------------------------------
    Meta:
      type: object
      required: [version, bootstrap_required]
      properties:
        version: { type: string, examples: ["1.0.0 (abc1234)"] }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this build. }
        commit: { type: string }
        bootstrap_required: { type: boolean, description: True when no user exists yet. }
        tailcat_available: { type: boolean, description: Whether private enrolment is enabled and the controller has its encryption key. Relay connectivity is checked at enrolment. }
        auth_disabled: { type: boolean, description: True when authentication has been switched off in the configuration. }
        oidc_enabled: { type: boolean }
        oidc_label: { type: string, examples: ["Sign in with Okta"] }
        external_url: { type: string }
        webhook_url: { type: string }
        polling_only: { type: boolean, description: True when no webhook has ever been received and the poller is doing the work. }
        poller_enabled: { type: boolean, description: True when the fallback poller is running. It is off only by configuration, never by failure. }
        workflow_cancellation_enabled: { type: boolean, description: True when operators may ask GitHub to cancel workflow runs. }
        poller_last_poll_at: { type: string, format: date-time, nullable: true, description: When the fallback poller last completed a sweep, or absent if it has not completed one since this controller started. }

    # --- overview ---------------------------------------------------------
    Stats:
      type: object
      properties:
        window: { type: string, description: The window these counts cover, echoed back., examples: ["1h"] }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        completed: { type: integer, description: Within the requested window. The sum of the four below. }
        succeeded: { type: integer, description: GitHub reported success and the fleet had no fault in it. }
        failed: { type: integer, description: A failing conclusion, or a runner that stopped under the job. }
        cancelled: { type: integer, description: Cancelled or skipped, with no fault of the fleet's. }
        unknown: { type: integer, description: None of the above, including a job GitHub stopped reporting. Never counted as a success. }
        median_wait_ms: { type: integer, format: int64 }
        p95_wait_ms: { type: integer, format: int64 }
        p50_startup_ms: { type: integer, format: int64, description: Median runner creation-to-container-start latency. }
        p95_startup_ms: { type: integer, format: int64 }
        p50_registration_ms: { type: integer, format: int64, description: Median container-start-to-registration latency. }
        p95_registration_ms: { type: integer, format: int64 }
        fleet:
          type: object
          description: >
            The same job figures narrowed to the jobs this fleet has a hand in:
            one an enabled pool claimed, one that ran on a runner started here,
            or one still queued that no pool claims. GitHub reports every job in
            an installed repository, so on an organisation that also uses hosted
            runners the figures above are mostly somebody else's. Both are
            carried in one payload because the same numbers arrive over the
            event stream, which is one frame for every viewer.
          properties:
            queued_jobs: { type: integer }
            running_jobs: { type: integer }
            completed: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
            unknown: { type: integer }
            median_wait_ms: { type: integer, format: int64 }
            p95_wait_ms: { type: integer, format: int64 }
        runners:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            total: { type: integer }
        hosts:
          type: object
          properties:
            total: { type: integer }
            healthy: { type: integer }
            cordoned: { type: integer }
            capacity: { type: integer }
            used: { type: integer }
        pools:
          type: array
          items:
            type: object
            properties:
              pool_id: { type: string }
              pool_name: { type: string }
              min: { type: integer }
              max: { type: integer }
              live: { type: integer }
              busy: { type: integer }
              idle: { type: integer }
              queued: { type: integer }
              utilisation: { type: number, format: double, minimum: 0, maximum: 1 }

    FleetSample:
      type: object
      properties:
        at: { type: string, format: date-time }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        fleet_queued_jobs: { type: integer, description: The same minute narrowed to the jobs this fleet has a hand in. Zero on samples taken before this was recorded. }
        fleet_running_jobs: { type: integer, description: As above, for jobs in progress. }
        idle_runners: { type: integer }
        busy_runners: { type: integer }
        total_runners: { type: integer }

    ScalingEvent:
      type: object
      properties:
        id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        from: { type: integer }
        to: { type: integer }
        reason:
          type: string
          description: The scheduler's own words, shown verbatim in the UI.
          examples: ["scaled linux-x64 2 -> 4: 3 jobs queued > 30s"]
        created_at: { type: string, format: date-time }

    # --- installations ----------------------------------------------------
    Installation:
      type: object
      properties:
        id: { type: string }
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string, examples: [acme, "acme/widgets"] }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string }
        app_slug: { type: string }
        web_url: { type: string }
        settings_url:
          type: string
          description: >-
            The App's own settings page on GitHub, which is the only place its
            avatar can be uploaded. Absent when the App's slug is unknown.
          examples: ["https://github.com/organizations/acme/settings/apps/zoomies-acme"]
        enterprise: { type: boolean }
        healthy: { type: boolean }
        last_error: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        pool_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InstallationCreate:
      type: object
      required: [app_id, installation_id, target, target_type, private_key]
      properties:
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string, default: "https://api.github.com" }
        private_key: { type: string, format: password, description: The App's PEM private key. Sealed before storage and never returned. }
        webhook_secret: { type: string, format: password }

    InstallationUpdate:
      type: object
      properties:
        target: { type: string }
        api_base_url: { type: string }
        private_key: { type: string, format: password }
        webhook_secret: { type: string, format: password }

    InstallationHealth:
      type: object
      properties:
        ok: { type: boolean }
        app_slug: { type: string }
        app_name: { type: string }
        message: { type: string, description: On failure, names the missing permission where GitHub tells us. }
        permissions: { type: object, additionalProperties: { type: string } }
        events: { type: array, items: { type: string } }
        missing_permissions: { type: array, items: { type: string } }
        missing_events: { type: array, items: { type: string } }
        rate_limit_remaining: { type: integer }
        repository_selection:
          type: string
          enum: [all, selected]
          description: >-
            GitHub's own word for how much of the target this installation covers. An App
            with every permission correct, installed on "only select repositories" and not
            on the one somebody pushes to, is a fleet where nothing ever queues and no page
            says why -- so the verify answer names it.
        repository_count:
          type: integer
          description: How many repositories the installation can see, up to the scan's own cap.
        repositories:
          type: array
          items: { type: string }
          description: The first few by name, so an operator can look for the one they expected.
        repositories_capped:
          type: boolean
          description: True when there are more than the names listed.

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        delivery_id: { type: string }
        event: { type: string }
        action: { type: string }
        repo: { type: string }
        status: { type: string, enum: [accepted, rejected, error] }
        error: { type: string }
        installation_id:
          type: string
          description: >-
            The installation whose webhook secret verified this delivery. It is not
            necessarily the one covering the repository: when none does, every configured
            secret is tried, and this says which one answered. Empty on a delivery that
            verified against none.
        received_at: { type: string, format: date-time }

    WebhookCheck:
      type: object
      properties:
        reachable: { type: boolean }
        url: { type: string }
        message: { type: string }
        fix: { type: string, description: The specific remedy - open a port, use a tunnel, configure the proxy. }
        polling_available: { type: boolean }
        last_delivery_at: { type: [string, "null"], format: date-time }

    # --- migrations -------------------------------------------------------
    MigrationOverride:
      type: object
      description: |
        One job sent somewhere other than the consolidated `mapping` says.

        It names exactly one place -- a job, in a workflow file, in a repository
        -- and nothing about it is a pattern: a pattern would match more than
        the operator read in the review step. A job the plan could not attribute
        to a name cannot be overridden, because there would be nothing stable to
        key on when the apply step re-reads the file.
      required: [repo, path, job]
      properties:
        repo: { type: string, examples: ["acme/widgets"], description: Compared case-insensitively, as GitHub does. }
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        job: { type: string, examples: ["integration"] }
        to:
          type: string
          examples: ["zoomies-linux-arm64"]
          description: >-
            The runs-on value this job gets. Empty leaves this one job on the rented runner it
            names today - a decision, reported with its own reason rather than as an unmapped
            label.

    MigrationRewrite:
      type: object
      description: One runs-on value a migration would change.
      properties:
        line: { type: integer, description: The 1-based line in the file as it is today. }
        job: { type: string, description: The workflow job the line belongs to, where indentation could tell. }
        label:
          type: string
          examples: ["ubuntu-latest"]
          description: >-
            The hosted-runner label being replaced, set only where the value asks for exactly
            one. A line carrying both a job and a label is one an override can name.
        from: { type: string, examples: ["ubuntu-latest"] }
        to: { type: string, examples: ["zoomies-linux-x64"] }
        overridden: { type: boolean, description: True when `to` came from an override rather than from the consolidated mapping. }

    MigrationSkip:
      type: object
      description: |
        A runs-on the migration deliberately left alone, and why. A skip is not
        a failure: a matrix expression, a job already on a self-hosted runner
        and a hosted label nobody mapped are all things a person has to decide.
      properties:
        line: { type: integer }
        job: { type: string }
        label:
          type: string
          description: >-
            The hosted-runner label this job asks for, set only where the value asks for exactly
            one. A skip carrying both a job and a label is one an override can settle; a
            ${{ }} expression carries neither, because no override can decide it.
        value: { type: string }
        reason: { type: string }

    MigrationWorkflow:
      type: object
      properties:
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        sha: { type: string, description: The blob SHA the plan was computed against. }
        rewrites: { type: array, items: { $ref: "#/components/schemas/MigrationRewrite" } }
        skips: { type: array, items: { $ref: "#/components/schemas/MigrationSkip" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this file asks for, mapped or not.
        diff: { type: string, description: A unified diff of the change, empty when the file is untouched. }

    MigrationRepo:
      type: object
      properties:
        repo: { type: string, examples: ["acme/widgets"] }
        default_branch: { type: string }
        workflows: { type: array, items: { $ref: "#/components/schemas/MigrationWorkflow" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this repository asks for - GitHub's own and the vendors' - mapped or not.
        error: { type: string, description: Set when this repository could not be read; the rest of the plan still stands. }
        archived:
          type: boolean
          description: >-
            The repository is archived and therefore read-only, so no pull request can be
            opened against it. Its workflows are not read, and it is never counted as
            something the migration would change.
        on_zoomies:
          type: boolean
          description: At least one job in this repository already runs on a pool of this fleet.

    MigrationPoolOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        runs_on: { type: string, description: What a workflow writes to reach this pool, and the value a mapping should hold. }
        enabled: { type: boolean }

    MigrationCounts:
      type: object
      properties:
        repos: { type: integer }
        workflows: { type: integer }
        jobs: { type: integer }
        skipped: { type: integer }

    MigrationPlan:
      type: object
      properties:
        installation_id: { type: string }
        target: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/MigrationRepo" } }
        hosted_labels: { type: array, items: { type: string } }
        mapping:
          type: object
          additionalProperties: { type: string }
          description: What was applied - the request's mapping, or the one the server proposed.
        overrides:
          type: array
          items: { $ref: "#/components/schemas/MigrationOverride" }
          description: >-
            The exceptions that were applied on top of the mapping, echoed back so a plan
            describes itself.
        unmapped:
          type: array
          items: { type: string }
          description: Hosted labels no pool was proposed for. Jobs on these are left where they are.
        pools: { type: array, items: { $ref: "#/components/schemas/MigrationPoolOption" } }
        counts: { $ref: "#/components/schemas/MigrationCounts" }
        truncated: { type: boolean, description: True when there are more repositories after this page. }
        next_cursor: { type: string, description: Send as `cursor` to read the next page of repositories. Absent on the last page. }
        total_repos: { type: integer, description: How many repositories the installation can see in total, of which this is one page. }
        missing_permissions:
          type: array
          items: { type: string }
          description: >-
            What the App still needs before pull requests can be opened. Reported here,
            in the step before, because discovering it halfway through leaves half the
            pull requests open.
        permission_hint: { type: string }
        settings_url: { type: string, description: The App's settings page, where the missing permissions are granted. }

    MigrationResult:
      type: object
      properties:
        repo: { type: string }
        status: { type: string, enum: [opened, skipped, failed] }
        pull_request_url: { type: string }
        pull_request_number: { type: integer }
        branch: { type: string }
        workflows: { type: integer }
        jobs: { type: integer }
        reason: { type: string, description: Why it was skipped, or how it failed. }

    MigrationOutcome:
      type: object
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/MigrationResult" } }
        opened: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }

    # --- pools ------------------------------------------------------------
    Resources:
      type: object
      properties:
        cpus: { type: number, format: double, examples: [2] }
        memory_mb: { type: integer, format: int64, examples: [4096] }
        disk_gb: { type: integer, format: int64 }
        pids_limit: { type: integer, format: int64 }

    PoolPlatform:
      type: object
      description: One row of the runner image catalogue.
      properties:
        os: { type: string, examples: [ubuntu] }
        os_version: { type: string, examples: ["24.04"] }
        label: { type: string, examples: ["Ubuntu 24.04"] }
        image: { type: string, examples: ["ghcr.io/eyupio/zoomies-runner:ubuntu-2404"] }
        arches: { type: array, items: { type: string }, examples: [[amd64, arm64]] }
        default: { type: boolean, description: True for the variant :latest points at. }

    Platform:
      type: object
      description: >-
        The machine a pool's runners need, or the machine a host is. Every field
        is optional; an empty field is a promise nobody made and matches
        anything. A pool's platform selects its runner image and restricts the
        hosts the scheduler may place its runners on.
      properties:
        os:
          type: string
          description: A distribution, not a kernel - "linux" cannot pick a runner image.
          enum: [ubuntu, debian, fedora, rocky, macos, windows]
          examples: [ubuntu]
        os_version: { type: string, examples: ["24.04"] }
        arch: { type: string, enum: [amd64, arm64], examples: [arm64] }
    UsageResponse:
      type: object
      required: [from, to, group_by, items, costs_are_estimates, allocation_attributable]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string, enum: [installation, repository, workflow, pool, host] }
        costs_are_estimates: { type: boolean, const: true }
        allocation_attributable:
          type: boolean
          description: |
            Whether allocated runner lifetime, and therefore cost, can be
            attributed to this grouping at all. A runner idles on behalf of a
            pool, never on behalf of a repository or a workflow, so it is false
            for the repository and workflow groupings and every row's
            allocated_runner_seconds is null.
        items:
          type: array
          items:
            type: object
            required: [key, job_execution_seconds, allocated_runner_seconds, jobs, jobs_started, jobs_completed, average_queue_wait_seconds, peak_concurrency]
            properties:
              history:
                type: array
                items: { $ref: "#/components/schemas/UsageBucket" }
              succeeded: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              unknown: { type: integer }
              key: { type: string }
              job_execution_seconds: { type: number, description: Job execution time clipped to the reported interval. }
              allocated_runner_seconds:
                type: number
                nullable: true
                description: Runner lifetime clipped to the interval, or null when the grouping cannot attribute it. Null is not zero.
              jobs: { type: integer, description: "Jobs queued within the interval. Counts are additive: adjacent reports sum." }
              jobs_started: { type: integer, description: Jobs whose run began within the interval. }
              jobs_completed: { type: integer, description: Jobs that finished within the interval. }
              average_queue_wait_seconds:
                type: number
                nullable: true
                description: Mean wait of the jobs_started jobs, so the denominator is the population with an observed wait. Null when nothing started in the interval.
              peak_concurrency: { type: integer }
              estimated_cost: { type: number, description: Estimate from administrator-assigned pool rates; omitted when no rate exists. }

    UsageBucket:
      type: object
      required: [from, queued, started, succeeded, failed, cancelled, unknown, execution_seconds, allocated_seconds, capacity_samples, capacity_reached]
      properties:
        from: { type: string, format: date-time }
        queued: { type: integer }
        started: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        unknown: { type: integer }
        execution_seconds: { type: number }
        allocated_seconds: { type: number }
        capacity_samples: { type: integer, description: Observed pool minutes; zero means no capacity telemetry. }
        capacity_reached: { type: integer, description: Observed pool minutes containing at least one capacity-blocked placement. Not incident count or exact duration. }

    PoolPrewarm:
      type: object
      properties:
        pool_id: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        image: { type: string }
        state: { type: string, enum: [pending, succeeded, failed] }
        digest: { type: string }
        error: { type: string }
        updated_at: { type: string, format: date-time }

    Pool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        installation_id: { type: string }
        installation_target: { type: string }
        labels: { type: array, items: { type: string } }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image: { type: string }
        effective_image:
          type: string
          description: >-
            The image this pool's runners will actually boot: image when the pool
            names one, otherwise the variant its platform selects, otherwise the
            instance default -- and then its Docker variant when the pool gives
            its jobs a daemon.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer }
        max_runners: { type: integer }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort per-repository runner creation throttle; zero disables it. This cannot prevent GitHub from assigning work to compatible idle runners and is not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true, description: Optional administrator-assigned rate used only for estimates. }
        priority: { type: integer, default: 0, description: Higher-priority pools receive creation capacity before lower-priority pools. }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: >-
            The environment injected into every runner this pool creates.
            Readable in full by operators and administrators; a viewer is sent
            the keys with empty values, because this is where a registry or
            proxy credential ends up and setting one is an operator action.
            The same applies to the pool.created and pool.updated events.
        run_as_root: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            live: { type: integer }
        queued_jobs: { type: integer }
        utilisation: { type: number, format: double }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
          description: The dangerous settings this pool has in effect, if any.

    CacheConfig:
      type: object
      description: Disposable performance cache mounted at /opt/zoomies-cache; it is not persistent workflow storage and may be evicted.
      required: [enabled, scope]
      properties:
        enabled: { type: boolean, default: false }
        scope:
          type: string
          enum: [pool, repository]
          default: pool
          description: >-
            Repository scope gives each repository its own cache. Under an
            organisation-targeted installation it needs `repository` set,
            because the installation alone does not say which repository the
            pool serves.
        size_limit:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Maximum bytes, enforced between one runner and the next by evicting
            whole cache entries, least recently modified first. Only a cache in
            a host directory can be measured, so a non-zero limit requires
            `source` to be an absolute host path. Zero is unlimited.
        source: { type: string, description: Optional absolute host directory or safe named-volume prefix. }
        repository:
          type: string
          description: >-
            The repository a repository-scoped cache belongs to, as owner/name.
            Required when the pool's installation targets an organisation, and
            left empty when it targets a single repository, which supplies it.

    PoolCreate:
      type: object
      required: [name, installation_id, labels, backend]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`. Beyond the brand, Zoomies' own convention is
            zoomies-<vcpu>vcpu[-<memory>gb]-<os>-<version>[-<arch>], so the name
            a workflow's runs-on carries says how much machine it is asking for.
            Any name is accepted.
          examples: [zoomies-4vcpu-ubuntu-2404]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image:
          type: string
          description: >-
            Leave blank to follow the pool's platform, which selects a published
            zoomies-runner variant, or the instance default when the pool names
            no platform.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, default: 0, minimum: 0 }
        max_runners: { type: integer, default: 4, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation throttle, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer, default: 0 }
        idle_timeout: { allOf: [{ $ref: "#/components/schemas/Duration" }], default: "5m" }
        ephemeral: { type: boolean, default: true }
        docker_mode: { allOf: [{ $ref: "#/components/schemas/DockerMode" }], default: none }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean, default: false }
        enabled: { type: boolean, default: true }

    # A PATCH body: every field is optional, and only the ones present are
    # changed. It repeats PoolCreate's properties rather than composing them,
    # because `allOf` keeps the parent's `required` list however empty the
    # child's is -- which would make a one-field change (switching a blocked
    # pool's backend, say) impossible to express in a generated client.
    PoolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`.
          examples: [zoomies-linux-x64]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, minimum: 0 }
        max_runners: { type: integer, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation throttle, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean }
        enabled: { type: boolean }

    # --- runners ----------------------------------------------------------
    Runner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        github_runner_id: { type: integer, format: int64 }
        container_id: { type: string }
        ephemeral: { type: boolean }
        labels: { type: array, items: { type: string } }
        image: { type: string }
        image_digest: { type: string, description: Immutable digest resolved by the host backend. }
        runner_version: { type: string }
        current_job_id: { type: string }
        current_job: { $ref: "#/components/schemas/Job" }
        message: { type: string }
        jobs_handled: { type: integer }
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        container_started_at:
          type: string
          format: date-time
          description: >-
            When the runner's container (or process) started on its host. With registered_at
            it is what tells the two causes of a stuck runner apart: a container that never
            started is a backend or image problem on the host, and one that started and never
            registered is a credential, network or GitHub problem.
        registered_at:
          type: string
          format: date-time
          description: When the runner registered itself with GitHub.
        started_at: { type: [string, "null"], format: date-time }
        last_idle_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        cleanup_error:
          type: string
          description: >-
            Why Zoomies could not finish taking this runner away: a stop or remove the
            agent could not complete, or a registration GitHub would not delete. Empty is
            the normal case. A non-empty value means something is left behind — a container
            on its host, or a registration on the organisation — and it will not go away on
            its own. Zoomies retries, and this clears when it succeeds.
        cleanup_failed_at: { type: [string, "null"], format: date-time }
        cleanup_attempts:
          type: integer
          description: >-
            How many times cleanup has been tried. It is kept after a success, because how
            many tries it took is the difference between a blip and a host worth looking at.
        create_task_issued_at: { type: [string, "null"], format: date-time, description: "First create task delivered to the host; never overwritten by redelivery or removal. Absent for older runners." }
        host_removed_at: { type: [string, "null"], format: date-time, description: "Controller receipt of positive host removal confirmation, including the workload and work directory." }
        registration_deleted_at: { type: [string, "null"], format: date-time, description: "Controller confirmation that the GitHub registration is absent." }
        cleanup_estimated_at: { type: [string, "null"], format: date-time, description: "Historical cleanup estimate from an older build; not confirmation that both sides were removed." }
        cleaned_up_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The end of the runner's life: nothing of it left, on the host or on GitHub. The
            counterpart of `created_at` at the other end.

    RunnerDetail:
      allOf:
        - $ref: "#/components/schemas/Runner"
        - type: object
          properties:
            host: { $ref: "#/components/schemas/Host" }
            pool: { $ref: "#/components/schemas/Pool" }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
            logs_available: { type: boolean, description: False when the runner's host is unreachable, so the UI can say why rather than showing an empty log. }

    JobExplanation:
      type: object
      required: [job_id, state, summary, waiting, blocked, computed_at]
      properties:
        job_id: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        summary:
          type: string
          description: >-
            The sentence. Always set, including for a job that is running or finished:
            "nothing is wrong" is an answer to the question.
        detail: { type: string, description: What the summary leaves out, in the scheduler's own words where it has any. }
        fix: { type: string, description: What to do. Absent means there is nothing to do, which is different from not knowing. }
        waiting: { type: boolean, description: Whether the job is still waiting on something. }
        blocked:
          type: boolean
          description: >-
            Whether waiting will not on its own end it. A fleet that is merely busy clears;
            a pool nothing can place never will, and the two need different advice.
        pool_id: { type: string }
        runner_id: { type: string }
        host_id: { type: string }
        computed_at: { type: string, format: date-time }

    Recovery:
      type: object
      required: [fenced]
      properties:
        fenced: { type: boolean }
        reason:
          type: string
          description: Why the fence is on -- normally the backup this database was restored from.

    SupportBundle:
      type: object
      required: [bundle_version, generated_at, instance, errors]
      properties:
        bundle_version:
          type: integer
          description: >-
            The shape's own number, so a reader given a bundle out of context knows what
            it is looking at. It moves when a section is removed or renamed, not when one
            is added.
        generated_at: { type: string, format: date-time }
        instance: { $ref: "#/components/schemas/BundleInstance" }
        config:
          type: object
          additionalProperties: true
          description: The effective configuration, the same key-by-key rendering /settings serves.
        findings:
          type: array
          description: The configuration validator's findings, the same list /settings carries.
          items: { $ref: "#/components/schemas/Problem" }
        problems:
          type: object
          description: Everything currently wrong, the same shape /problems serves.
          required: [ok, items]
          properties:
            ok: { type: boolean }
            items:
              type: array
              items: { $ref: "#/components/schemas/Problem" }
        stats: { $ref: "#/components/schemas/Stats" }
        installations:
          type: array
          items: { $ref: "#/components/schemas/Installation" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/Pool" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        runners:
          type: array
          items: { $ref: "#/components/schemas/Runner" }
        jobs:
          type: array
          description: >-
            The work in flight rather than the history. A bundle is taken because
            something is stuck, and finished jobs would be most of the bytes while
            answering none of it.
          items: { $ref: "#/components/schemas/Job" }
        explanations:
          type: array
          description: The controller's own answer for each unfinished job, the same one the drawer and the CLI render.
          items: { $ref: "#/components/schemas/JobExplanation" }
        scaling_events:
          type: array
          items: { $ref: "#/components/schemas/ScalingEvent" }
        logs: { $ref: "#/components/schemas/BundleLogs" }
        errors:
          type: array
          description: Why a section is missing. A bundle with nine sections and a named failure is worth more than a 500.
          items: { $ref: "#/components/schemas/BundleError" }
        truncated:
          type: array
          items: { $ref: "#/components/schemas/BundleTruncation" }

    BundleInstance:
      type: object
      description: What this process is and how it is doing -- the half of a bug report that is never in the fleet's own rows.
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go: { type: string }
        os: { type: string }
        arch: { type: string }
        cpus: { type: integer }
        goroutines: { type: integer }
        heap_in_use_bytes: { type: integer, format: int64 }
        config_path: { type: string }
        database_path: { type: string }
        schema_applied: { type: integer }
        schema_latest: { type: string }
        event_subscribers: { type: integer }
        polling_only: { type: boolean }
        poller_enabled: { type: boolean }
        poller_last_poll_at: { type: string, format: date-time }
        loop_panics:
          type: array
          description: >-
            The one fact here that is always a bug in Zoomies. A loop that panicked was
            restarted and the fleet carried on, so nothing else in a bundle would show it.
          items:
            type: object
            properties:
              loop: { type: string }
              count: { type: integer }
              last: { type: string }
              at: { type: string, format: date-time }

    BundleLogs:
      type: object
      description: Where the logs are, rather than the logs.
      properties:
        note: { type: string, description: Why the bodies are not here. }
        runners:
          type: array
          items:
            type: object
            properties:
              runner_id: { type: string }
              name: { type: string }
              state: { $ref: "#/components/schemas/RunnerState" }
              pool_id: { type: string }
              download: { type: string, description: The route that fetches this runner's log. }

    BundleError:
      type: object
      required: [section, error]
      properties:
        section: { type: string }
        error: { type: string }

    BundleTruncation:
      type: object
      required: [section, reason]
      properties:
        section: { type: string }
        kept: { type: integer, description: How many rows survived, where the cap was a row count. }
        reason: { type: string }

    TimelineEntry:
      type: object
      properties:
        state: { $ref: "#/components/schemas/RunnerState" }
        stage:
          type: string
          description: >-
            A finer point within the state, when one was observed: the image was pulled,
            the container started, the runner registered with GitHub.
          enum: [image_pulling, container_started, registered]
        at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64, description: How long the runner stayed in this state. }
        message: { type: string }

    # --- jobs -------------------------------------------------------------
    Job:
      type: object
      properties:
        provisioning: { type: string, enum: ["", paused, deleted], description: "Operator demand control; empty means ready." }
        provision_now: { type: boolean, description: Expedite demand within pool priority and bypass scale-up delay. }
        id: { type: string }
        github_job_id: { type: integer, format: int64 }
        github_run_id: { type: integer, format: int64 }
        repo: { type: string }
        workflow: { type: string }
        job_name: { type: string }
        labels: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/JobState" }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        installation_id:
          type: string
          description: >-
            The GitHub App installation covering this job's repository, resolved when the job
            was first recorded. Read-only. A pool only ever runs work in its own installation's
            target, so a pool whose labels fit is still not eligible unless this matches it.
            Empty when no installation here covers the repository.
        pool_id: { type: string }
        pool_name: { type: string }
        runner_id: { type: string }
        runner_name: { type: string }
        html_url: { type: string, description: The run on GitHub. }
        matched: { type: boolean, description: "False when no enabled pool claims this job's labels. On a job that is not queued this only says the job ran somewhere else." }
        eligible_at: { type: string, format: date-time, description: "When this fleet could first have acted on the job - an enabled pool claiming its labels. The start of the scheduling-latency interval, and deliberately not queued_at: the wait before anything could run the job is not this fleet's. Absent on a job nothing has claimed." }
        hosted: { type: boolean, description: "True when every label names GitHub's own runners or a hosted-runner vendor's, so a job no pool here claims is theirs to run rather than stuck." }
        head_branch: { type: string, description: The branch the run was for. }
        head_sha: { type: string }
        run_attempt: { type: integer, description: "1 for a first run; higher when the run was re-run." }
        steps:
          type: array
          description: >-
            The job's steps as GitHub last reported them. A completed job carries every
            step with its conclusion; a running one carries them mid-flight.
          items: { $ref: "#/components/schemas/JobStep" }
        failed_step:
          description: >-
            The step a completed job stopped at: the first that did not succeed, whether the
            job failed there or was cancelled there. Null when every step succeeded or while
            the job is still running. Worked out by the server so every client names the same step.
          oneOf:
            - $ref: "#/components/schemas/JobStep"
            - type: "null"
        runner_fault:
          type: string
          description: >-
            Set when the runner of this fleet that was executing the job stopped before
            GitHub reported the job over -- the fleet's own explanation of a failure GitHub
            records like any other. Empty when the runner did nothing wrong.
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        queue_wait_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }

    JobStep:
      type: object
      properties:
        number: { type: integer }
        name: { type: string }
        status: { type: string, examples: [queued, in_progress, completed] }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    JobEventKind:
      type: string
      description: >-
        What happened. `runner_lost` is the one entry GitHub cannot produce: the runner
        stopped under the job, and GitHub will report an ordinary failure. `waiting` and
        `approved` bracket a deployment review: the time between them is GitHub's, and
        the queue wait starts at `approved`. `runner_returned` withdraws a `runner_lost`:
        the host was silent long enough to be given up on, came back with the runner
        still executing this job, and the job is being left to finish.
      enum: [queued, waiting, approved, claimed, unmatched, started, completed, runner_lost, runner_returned, cancel_requested]

    JobEvent:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        kind: { $ref: "#/components/schemas/JobEventKind" }
        source:
          type: string
          description: Who observed it. A timeline that is all `poller` is a controller no webhook reaches.
          enum: [webhook, poller, agent, controller]
        message: { type: string, description: One sentence, written for an operator. }
        runner_id: { type: string }
        runner_name: { type: string }
        at: { type: string, format: date-time }

    # --- hosts ------------------------------------------------------------
    BackendInfo:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/BackendKind" }
        available: { type: boolean }
        version: { type: string }
        rootless: { type: boolean }
        endpoint: { type: string }
        detail: { type: string, description: When unavailable, what is wrong and how to fix it. }
        supports_dind: { type: boolean }
        host_socket_path: { type: string, description: Where the host daemon's socket lives, for pools that opt into host-socket mode. }

    Host:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        connection: { type: string, enum: [direct, tailcat], description: Connection observed by the controller at enrolment or the latest heartbeat. }
        embedded: { type: boolean, description: True for the agent running inside the controller process. }
        capacity: { type: integer }
        active_runners: { type: integer }
        free: { type: integer }
        backends: { type: array, items: { type: string } }
        backend_info: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        labels: { type: object, additionalProperties: { type: string } }
        os: { type: string, description: The kernel, as Go names it - linux, darwin, windows. }
        distro: { type: string, description: The distribution, e.g. ubuntu. Empty when the host has not said. }
        os_version: { type: string, description: The distribution's release, e.g. "24.04". }
        arch: { type: string }
        cpus: { type: integer, description: How much machine this host is. An agent in a container sees its cgroup's share, but a container runner runs beside it rather than inside that cgroup, so the daemon's larger view of the machine is the one reported. }
        memory_mb: { type: integer, format: int64 }
        disk_total_mb: { type: integer, format: int64, description: The filesystem holding the agent's work directory, where a runner's checkout and caches land. Zero means the agent did not measure it, which is not a full disk. }
        disk_free_mb: { type: integer, format: int64, description: What a runner may write to, which is less than what is unused by the reserve the filesystem keeps for root. }
        reserve_cpus: { type: integer, description: What the operator holds back from placement for the machine's own sake. Set through PATCH /hosts; a heartbeat never writes it. }
        reserve_memory_mb: { type: integer, format: int64 }
        reserve_disk_mb: { type: integer, format: int64 }
        allocatable_cpus:
          type: number
          description: >-
            The machine less its reserve: what the scheduler may place onto. The documented
            floors under the reserve -- 512 MB of memory and 2 GB of disk, with no CPU floor --
            are applied here, so what is shown is what is used.
        allocatable_memory_mb: { type: integer, format: int64 }
        allocatable_disk_mb: { type: integer, format: int64 }
        reserved_cpus:
          type: number
          description: >-
            What the live runners already on this host have promised away, as of the last
            scheduling pass and from the snapshot that pass decided on. Disk is absent on
            purpose: free disk already contains what those runners have written, so charging
            their reservations too would count the same bytes twice.
        reserved_memory_mb: { type: integer, format: int64 }
        reserved_known:
          type: boolean
          description: >-
            False until a pass has run, because zero would read as an idle machine rather
            than as a question nobody has answered yet.
        resources_known:
          type: boolean
          description: >-
            Whether this host has reported what machine it is at all. An agent too old to say
            is placed by slots alone, which is what keeps an upgrade from emptying a fleet.
        platform: { $ref: "#/components/schemas/Platform" }
        platform_label: { type: string, examples: ["Ubuntu 24.04, arm64"] }
        canonical_name:
          type: string
          description: The name this machine would be given today, for a host called something that says nothing.
          examples: [zoomies-16vcpu-32gb-ubuntu-2404-build01]
        version: { type: string }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this agent build. }
        cordoned: { type: boolean }
        protocol_version:
          type: integer
          description: >-
            The agent protocol this host reported speaking. Absent from an agent old enough
            not to send one, which is not the same as incompatible -- it is the one case the
            controller cannot judge.
        incompatible:
          type: boolean
          description: >-
            Whether this host's agent speaks a protocol the controller does not. An
            incompatible host is excluded from placement exactly as a cordoned one is, and
            nothing else: its runners keep working and are drained as normal. Refusing its
            heartbeat instead would restart every agent in the fleet at once.
        incompatible_reason: { type: string, description: What to do about it, naming both protocol versions. }
        version_skew:
          type: string
          enum: [behind, ahead, differs]
          description: >-
            How this host's release stands to the controller's, absent when they match.
            `differs` is the honest answer for a pair the controller cannot order -- a
            development build, a fork's tag -- because a wrong order would send an operator
            to upgrade the wrong side. Two builds of one tag are the same release and are
            not skew.
        upgrade_command:
          type: string
          description: >-
            Copyable install.sh --upgrade command for an older or different remote agent,
            targeting the controller's published release or dev channel. Absent for embedded,
            matching or newer agents, and for unpublished controller builds. Contains no credentials.
        upgrade_version:
          type: string
          description: Controller build the upgrade is intended to match.
        upgrade_note:
          type: string
          description: What the command does, or why no safe published command can be offered.
        healthy: { type: boolean }
        last_heartbeat: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    JoinToken:
      type: object
      properties:
        id: { type: string }
        prefix: { type: string }
        created_by: { type: string }
        capacity: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        used_by_id: { type: string }
        usable: { type: boolean }

    # --- audit and administration ----------------------------------------
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        actor_kind: { type: string, enum: [user, token, agent, system, webhook] }
        action: { type: string, examples: ["pool.create", "runner.drain"] }
        target_kind: { type: string }
        target_id: { type: string }
        before: { type: string, description: JSON, with secrets redacted. }
        after: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        oidc_subject: { type: string }
        disabled: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }

    Identity:
      type: object
      properties:
        kind: { type: string, enum: [user, token, agent, system] }
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        must_change_password: { type: boolean }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        prefix: { type: string }
        revoked: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    Settings:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
          description: The effective configuration, with every secret blanked.
        findings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        config_path: { type: string }
        restart_required_keys:
          type: array
          items: { type: string }
          description: Keys that exist but cannot be changed without restarting the process.
        version: { type: string }
        database_path: { type: string }
        event_subscribers: { type: integer }

    # --- agent protocol (internal) ------------------------------------------
    # The wire types of the agent routes. internal/agent/protocol.go owns them;
    # these describe what it sends so the document is whole.
    AgentJoinRequest:
      type: object
      required: [protocol_version, join_token, name, capacity, os, arch, version, backends]
      properties:
        protocol_version: { type: integer }
        join_token: { type: string, format: password }
        name: { type: string }
        address: { type: string, description: How the host reports itself. The controller never dials it. }
        capacity: { type: integer, description: Concurrent runners the host accepts. 0 lets the join token or the CPU count decide. }
        os: { type: string }
        arch: { type: string }
        version: { type: string, description: The agent's build version, for skew warnings. }
        labels: { type: object, additionalProperties: { type: string } }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
    AgentJoinResponse:
      type: object
      properties:
        host_id: { type: string }
        agent_token: { type: string, description: Shown once. The controller keeps only its hash. }
        controller_version: { type: string }
        heartbeat_interval: { $ref: "#/components/schemas/Duration" }
    AgentHeartbeatRequest:
      type: object
      properties:
        protocol_version: { type: integer }
        capacity: { type: integer, description: The agent's configured value, sent for the log. The controller does not write it. }
        version: { type: string }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        runners: { type: array, items: { $ref: "#/components/schemas/RunnerReport" } }
    AgentHeartbeatResponse:
      type: object
      properties:
        ok: { type: boolean }
        cordoned: { type: boolean, description: Mirrors the host's cordon flag so the agent stops asking for work at once. }
        controller_version: { type: string }
        resync_requested: { type: boolean, description: Send a full runner report next time. Set after the controller restarts. }
    RunnerReport:
      type: object
      required: [runner_id, observed_at]
      properties:
        host_removed: { type: boolean, description: "Positive confirmation that backend removal completed, including its work directory; process exit alone is insufficient." }
        cleanup_error: { type: string, description: "Failure of autonomous host cleanup; retained until its retry succeeds." }
        runner_id: { type: string }
        state:
          description: >-
            The state the agent asserts, or empty once the workload is up: whether GitHub has
            handed the runner a job is not the agent's call.
          oneOf:
            - $ref: "#/components/schemas/RunnerState"
            - { type: string, const: "" }
        handle: { type: string, description: The backend's own name for the workload, such as a container ID. }
        phase: { type: string, enum: [starting, running, exited, exit_unknown, failed, gone] }
        exit_code: { type: integer }
        message: { type: string }
        stats: { $ref: "#/components/schemas/WorkloadStats" }
        github_runner_id: { type: integer, format: int64, description: Filled in once the runner has registered. }
        observed_at: { type: string, format: date-time }
    WorkloadStats:
      type: object
      properties:
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64 }
    AgentTaskKind:
      type: string
      enum: [create_runner, stop_runner, remove_runner, stream_logs, cancel_logs, prewarm_image]
    AgentTask:
      type: object
      description: One unit of work for an agent. Tasks are idempotent; the controller may redeliver one after a restart.
      required: [id, kind, issued_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        spec: { $ref: "#/components/schemas/RunnerSpec" }
        backend: { $ref: "#/components/schemas/BackendKind" }
        pool_id: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        stop_timeout: { type: integer, format: int64, description: Nanoseconds. Bounds a graceful stop. }
        stream_id: { type: string, description: The log relay a stream_logs or cancel_logs task concerns. }
        log_options: { $ref: "#/components/schemas/LogOptions" }
        issued_at: { type: string, format: date-time }
    RunnerSpec:
      type: object
      description: >-
        Everything a backend needs to create one runner. The one place a JIT config crosses
        the wire, which is why the agent transport requires TLS off loopback.
      properties:
        name: { type: string, description: The runner name GitHub will know it by. It doubles as the container name. }
        runner_id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        credentials:
          type: object
          description: The runner's registration credentials. Never logged, never shown.
          properties:
            jit_config: { type: string, format: password }
            registration_token: { type: string, format: password }
            url: { type: string, description: The organisation or repository URL the runner registers against. }
            runner_group: { type: string }
            labels: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        ephemeral: { type: boolean }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        repository: { type: string }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        run_as_root: { type: boolean }
        network: { type: string }
        work_dir: { type: string }
        runner_version: { type: string, description: The actions/runner release the process backend downloads. }
    LogOptions:
      type: object
      description: How a log relay reads the workload's output. The names are capitalised on the wire, as the Go type carries no JSON tags.
      properties:
        Follow: { type: boolean }
        Tail: { type: integer, description: Lines of backlog to send first. 0 means everything. }
        Since: { type: string, format: date-time }
        Timestamps: { type: boolean }
    AgentTaskResult:
      type: object
      required: [task_id, ok, completed_at]
      properties:
        task_id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        ok: { type: boolean }
        error: { type: string }
        handle: { type: string }
        image_pull_duration: { type: integer, format: int64, description: Nanoseconds. Absent when the backend cannot tell pulling from creation. }
        create_duration: { type: integer, format: int64, description: Nanoseconds. }
        container_started_at: { type: string, format: date-time }
        digest: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        completed_at: { type: string, format: date-time }
    AgentTaskBatch:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/AgentTask" } }
        backoff: { type: integer, format: int64, description: Nanoseconds to wait before polling again, when the controller sheds load. }
