openapi: 3.1.0

info:
  title: Zoomies API
  version: "1.0.0"
  summary: Self-hosted GitHub Actions runner fleet controller
  description: |
    Zoomies manages ephemeral self-hosted GitHub Actions runners.

    This document is the whole product surface. The web UI and the `zoomies`
    CLI are both clients of it, and nothing is reachable from either that is
    not described here.

    ## Authentication

    Two credentials are accepted on the same routes:

    * a **session cookie** (`zoomies_session`), which the browser gets from
      `POST /auth/login`;
    * a **bearer token** (`Authorization: Bearer zoo_...`), for automation.

    Cookie-authenticated mutating requests are subject to a same-origin check.
    Bearer-authenticated requests are not, because they are not vulnerable to
    CSRF.

    Agents use a separate credential class on `/agent/*` and can reach nothing
    else. Those routes are documented at the end, marked `x-internal`: they are
    part of the surface, but no general client should call them.

    ## Roles

    | Role | May |
    |---|---|
    | `viewer` | read everything except secrets |
    | `operator` | act on the fleet and manage pools |
    | `admin` | manage users, tokens, installations and settings |

    Each operation below records its minimum role in `x-zoomies-role`.

    ## Conventions

    * List endpoints take `limit`, `offset`, `sort` and `order`, and return
      `{ items, total, limit, offset }`.
    * Timestamps are RFC 3339 with a `Z` offset.
    * Durations are Go duration strings: `"5m"`, `"1h30s"`.
    * Errors are `{ "error": { code, message, field?, detail? } }` with a
      message written for a human to read.
  license:
    name: AGPL-3.0-only
    url: https://github.com/eyupio/zoomies/blob/main/LICENSE
  contact:
    name: Zoomies
    url: https://github.com/eyupio/zoomies

servers:
  - url: /api/v1
    description: This controller

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: meta
    description: Version, capabilities and health. Callable before login.
  - name: auth
    description: Sessions, bootstrap and single sign-on.
  - name: overview
    description: Fleet statistics, problems, scaling history and the live event stream.
  - name: installations
    description: GitHub App installations and webhook delivery health.
  - name: pools
    description: What runners to make and how many.
  - name: runners
    description: The runners that exist right now.
  - name: jobs
    description: Job history, queue waits and outcomes.
  - name: hosts
    description: Agents, their capacity, and enrolment.
  - name: providers
    description: Where machines are rented from, and the machines themselves.
  - name: migrations
    description: Moving a repository's workflows from GitHub's runners onto this fleet.
  - name: audit
    description: Who did what.
  - name: admin
    description: Users, API tokens and settings.
  - name: diagnostics
    description: One document describing this instance, for a bug report.
  - name: recovery
    description: The fence a restore sets, and the one act that lifts it.
  - name: backups
    description: Copies of the database, and the restore that puts one back.
  - name: agent
    description: Routes used by agents. Not for general clients.

paths:
  /usage:
    get:
      operationId: getUsage
      tags: [jobs]
      summary: Aggregate bounded fleet usage
      x-zoomies-role: viewer
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: key, in: query, description: Optional exact group key filter., schema: { type: string } }
        - { name: group_by, in: query, schema: { type: string, enum: [installation, repository, workflow, pool, host], default: pool } }
        - name: interval
          in: query
          description: >-
            The width of one history bucket. Left out, it is an hour for a
            range of two days or less and a day beyond. Hourly buckets may be
            asked for over at most 14 days.
          schema: { type: string, enum: [hour, day] }
      responses:
        "200":
          description: Usage totals; monetary values are administrator-configured estimates.
          content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } }
  /usage.csv:
    get:
      operationId: exportUsageCSV
      tags: [jobs]
      summary: Export bounded fleet usage as CSV
      x-zoomies-role: viewer
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: key, in: query, description: Optional exact group key filter., schema: { type: string } }
        - { name: group_by, in: query, schema: { type: string, enum: [installation, repository, workflow, pool, host], default: pool } }
        - name: interval
          in: query
          description: >-
            The width of one history bucket. Left out, it is an hour for a
            range of two days or less and a day beyond. Hourly buckets may be
            asked for over at most 14 days.
          schema: { type: string, enum: [hour, day] }
      responses:
        "200": { description: CSV export, content: { text/csv: { schema: { type: string } } } }
  # ==========================================================================
  # Meta
  # ==========================================================================
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Version and capabilities
      description: |
        Safe to call unauthenticated. It is what the login page uses to decide
        whether to show a password form, a "sign in with SSO" button, or the
        first-run bootstrap form.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  # ==========================================================================
  # Authentication
  # ==========================================================================
  /auth/bootstrap:
    post:
      operationId: bootstrap
      tags: [auth]
      summary: Create the first administrator
      description: |
        Available only while no user exists. Once any account has been created
        this returns 409 forever.

        It also requires the setup token the controller prints in its log at
        startup while the instance has no accounts. "No account exists yet" is a
        condition a stranger can satisfy too, so on its own it would hand a
        freshly deployed controller to whoever loaded the page first; the token
        is proof that the caller can read the controller's log. It is minted per
        process, so restarting the controller prints a new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, setup_token]
              properties:
                username: { type: string, minLength: 1, maxLength: 64, examples: [admin] }
                password: { type: string, minLength: 12, format: password }
                email: { type: string, format: email }
                setup_token:
                  type: string
                  description: The setup token from the controller's log, on a line beginning "setup token".
      responses:
        "201":
          description: Created, and the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a username and password
      description: Rate limited per source address. A wrong password and an unknown user are indistinguishable, deliberately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      x-zoomies-role: viewer
      responses:
        "204": { description: Signed out }

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: The current identity
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change your own password
      description: Invalidates every other session belonging to this account.
      x-zoomies-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, minLength: 12, format: password }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /auth/oidc/start:
    get:
      operationId: oidcStart
      tags: [auth]
      summary: Begin single sign-on
      description: >-
        Sends the browser to the identity provider. A browser navigation, not an API call:
        the answer is a redirect, and the handshake state travels in a short-lived cookie.
      security: []
      responses:
        "302": { description: Redirected to the identity provider. }
        "503": { description: Single sign-on is not enabled on this controller. }

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Finish single sign-on
      description: >-
        Where the identity provider sends the browser back. On success the session cookie is
        set and the browser is redirected into the app; on any failure it is redirected to
        the login page with the reason in the query string, because whoever is here is a
        person trying to sign in and that is where they can try again.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirected into the app, or to the login page with a message. }
        "503": { description: Single sign-on is not enabled on this controller. }

  # ==========================================================================
  # Overview
  # ==========================================================================
  /stats:
    get:
      operationId: getStats
      tags: [overview]
      summary: Fleet statistics
      x-zoomies-role: viewer
      parameters:
        - name: window
          in: query
          description: Rolling window for the completed/failed counts and queue-wait percentiles.
          schema: { type: string, default: "1h", examples: ["1h", "24h"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /samples:
    get:
      operationId: listSamples
      tags: [overview]
      summary: Fleet samples for the sparklines
      x-zoomies-role: viewer
      parameters:
        - name: window
          in: query
          schema: { type: string, default: "1h" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FleetSample" }

  /problems:
    get:
      operationId: listProblems
      tags: [overview]
      summary: Everything currently wrong, and every dangerous setting in effect
      description: |
        The Overview's problems panel. Includes unhealthy hosts, failed
        registrations, webhook delivery failures, queued jobs no pool claims,
        and every warning the configuration validator produced.

        `ok` is true and `items` is empty when there is nothing to say, which is
        the common case and is rendered as a single quiet line rather than an
        empty box.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }

  /scaling-events:
    get:
      operationId: listScalingEvents
      tags: [overview]
      summary: Recent scaling decisions, with the reason in words
      x-zoomies-role: viewer
      parameters:
        - name: pool_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ScalingEvent" }

  /events:
    get:
      operationId: streamEvents
      tags: [overview]
      summary: Live event stream (Server-Sent Events)
      description: |
        `text/event-stream`. Every state change the operator would want to see.
        Honours `Last-Event-ID` on reconnect and replays what the server still
        holds. Event ids are `<epoch>.<sequence>`, where the epoch names one
        run of the controller; when the events since the client's last id
        cannot all be replayed -- the buffer has moved on, or the controller
        restarted -- the first frame is a `resync` event telling the client
        to fetch the resources again. A `heartbeat` event every 20 seconds
        keeps proxies from closing an idle connection.
      x-zoomies-role: viewer
      parameters:
        - name: kinds
          in: query
          description: Comma-separated event kinds to receive. Omit for all.
          schema: { type: string, examples: ["runner.updated,scaling"] }
        - name: topic
          in: query
          description: Topic prefix filter, e.g. `runner:run_k3f9qz2m`.
          schema: { type: string }
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema: { type: string }

  # ==========================================================================
  # Installations
  # ==========================================================================
  /installations:
    get:
      operationId: listInstallations
      tags: [installations]
      summary: List GitHub App installations
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Installation" }
    post:
      operationId: createInstallation
      tags: [installations]
      summary: Connect a GitHub App installation
      description: The private key is sealed with the instance encryption key before it reaches the database, and is never returned.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /installations/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getInstallation
      tags: [installations]
      summary: Get an installation
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateInstallation
      tags: [installations]
      summary: Update an installation
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteInstallation
      tags: [installations]
      summary: Remove an installation
      description: >-
        Cascades to its pools, and removes their runners now, interrupting any job they are
        running: a runner has to be deregistered from GitHub while the installation's
        credentials still exist, which is before the row goes, so there is no drain here.
        Drain the pools first with `DELETE /pools/{id}` if the running jobs matter. The
        response says how many pools and runners went with it.
      x-zoomies-role: admin
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools_deleted: { type: integer }
                  runners_affected: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /installations/{id}/verify:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: verifyInstallation
      tags: [installations]
      summary: Check the credentials and permissions
      description: On a 403 from GitHub, the message names the permission that is probably missing rather than echoing the status code.
      x-zoomies-role: operator
      responses:
        "200":
          description: The result of the probe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationHealth" }
        "404": { $ref: "#/components/responses/NotFound" }

  /installations/{id}/runner-groups:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: listRunnerGroups
      tags: [installations]
      summary: The target's runner groups
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }

  /installations/{id}/rate-limit:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getRateLimit
      tags: [installations]
      summary: Remaining GitHub API quota
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit: { type: integer }
                  remaining: { type: integer }
                  reset_at: { type: string, format: date-time }

  /installations/manifest:
    post:
      operationId: createAppManifest
      tags: [installations]
      summary: Build a GitHub App manifest
      description: |
        Returns the manifest JSON, GitHub destination and handshake state. The
        browser POSTs the manifest to `manifest/handoff?state=...` on this
        controller, which redirects the POST to GitHub. The operator confirms
        there, and GitHub redirects back with a code that `manifest/exchange`
        turns into App credentials.

        The manifest asks for exactly the permissions Zoomies needs and no more.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, target_type]
              properties:
                name: { type: string, examples: ["Zoomies (acme)"] }
                target: { type: string, examples: [acme] }
                target_type: { $ref: "#/components/schemas/TargetType" }
                api_base_url: { type: string, examples: ["https://api.github.com"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  post_url: { type: string, description: GitHub destination reached through the controller's manifest handoff. }
                  manifest: { type: string, description: The manifest JSON, to be sent as a form field named `manifest`. }
                  state: { type: string, description: Single-use value echoed back on the callback. }

  /installations/manifest/handoff:
    post:
      operationId: handoffAppManifest
      tags: [installations]
      summary: Hand the browser's manifest POST to GitHub
      description: |
        Submit a same-tab HTML form to this controller with the exact manifest
        and state returned by `createAppManifest`. After validating the pending
        handshake, manifest and allowed destination, the controller responds
        with a 307 redirect to GitHub or the configured GitHub Enterprise Server.
        The browser must preserve the POST method and form body on that redirect.

        This is a browser navigation endpoint, not a JSON fetch. The state is
        also included in the destination URL for GitHub to echo on the callback.
        Handoff does not consume the state; the code exchange completes it.
      x-zoomies-role: admin
      parameters:
        - name: state
          in: query
          required: true
          description: Pending handshake state returned by `createAppManifest`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: string
                  description: Exact manifest JSON returned by `createAppManifest`.
      responses:
        "307":
          description: Continue the same POST to GitHub, preserving the form body.
          headers:
            Location:
              required: true
              description: Validated GitHub manifest URL including the handshake state.
              schema: { type: string, format: uri }
        "400":
          description: Unreadable or altered manifest, or an invalid or disallowed destination.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: Missing, unknown, expired or already consumed handshake state; restart setup.
          content:
            text/plain:
              schema: { type: string }

  /installations/manifest/exchange:
    post:
      operationId: exchangeAppManifest
      tags: [installations]
      summary: Exchange a manifest code for App credentials
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                state: { type: string }
                api_base_url: { type: string }
      responses:
        "200":
          description: The App was created; finish by installing it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_id: { type: integer, format: int64 }
                  slug: { type: string }
                  name: { type: string }
                  html_url: { type: string }
                  install_url: { type: string, description: Send the operator here to install the App on their organisation. }
                  settings_url:
                    type: string
                    description: >-
                      The App's own settings page. A manifest cannot set an App's logo -- GitHub
                      takes an avatar as an upload and has no manifest field for it -- so this is
                      where the operator is sent to give the App the Zoomies mark.
                  target: { type: string, description: The organisation or repository the App was created for. }
                  target_type: { $ref: "#/components/schemas/TargetType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [installations]
      summary: Recent webhook deliveries
      x-zoomies-role: viewer
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [accepted, rejected, error] }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  last_received_at:
                    type: [string, "null"]
                    format: date-time
                    description: Null when nothing has ever arrived, which distinguishes "quiet" from "broken".

  /webhook-test:
    post:
      operationId: testWebhookReachability
      tags: [installations]
      summary: Check whether GitHub can reach this controller
      description: |
        Reports plainly whether the configured external URL is reachable from
        outside, and when it is not, gives the specific fix -- open a port, use
        a tunnel, configure the reverse proxy -- along with the option of
        falling back to polling.
      x-zoomies-role: operator
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCheck" }

  # ==========================================================================
  # Pools
  # ==========================================================================
  /pools:
    get:
      operationId: listPools
      tags: [pools]
      summary: List pools
      description: Each pool carries live per-state runner counts and its current utilisation.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Pool" }
    post:
      operationId: createPool
      tags: [pools]
      summary: Create a pool
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /pools/platforms:
    get:
      operationId: listPoolPlatforms
      tags: [pools]
      summary: The platforms a pool may ask for
      description: |
        The runner image catalogue: every operating system and release Zoomies
        publishes a zoomies-runner image for, and the architectures each is
        built for. It is served rather than hard-coded in a client so that a
        pool cannot be offered an operating system no image exists for.
      x-zoomies-role: viewer
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PoolPlatform" }

  /pools/validate:
    post:
      operationId: validatePool
      tags: [pools]
      summary: Dry-run a pool definition
      description: |
        Returns the field errors and the dangerous-setting warnings the pool
        would produce, without creating anything. The creation wizard's review
        step calls this, so the warnings an operator sees before confirming are
        the same ones the server would raise afterwards.
      x-zoomies-role: operator
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: |
            The pool this would be an edit to. Its own name is then not treated
            as a clash -- without this, editing anything about a pool is refused
            because a pool with that name already exists, namely itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolCreate" }
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items: { $ref: "#/components/schemas/FieldError" }
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }
                  matching_hosts:
                    type: integer
                    description: How many hosts could actually run this pool. Zero is worth saying out loud before the pool is created.
                  selected_hosts:
                    type: integer
                    description: How many hosts this pool's host selector reaches, whatever became of them afterwards. The wizard's placement step counts by the selector alone, so this is the number it shows and matching_hosts is the number its review step shows.
                  excluded_hosts:
                    type: array
                    description: Every host the selector reaches that the fleet could not run this pool on, with the reason. It is what turns "2 hosts match" followed by "1 host can run this pool" from a contradiction into an explanation.
                    items: { $ref: "#/components/schemas/HostExclusion" }
                  image:
                    type: string
                    description: The image the pool would actually run, which for a pool that gives its jobs a daemon is the stock image's Docker variant rather than the image the request named.

  /pools/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getPool
      tags: [pools]
      summary: Get a pool
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePool
      tags: [pools]
      summary: Update a pool
      description: >-
        Refused with 409 when the change would leave this pool with no host in the
        fleet that could ever run it, while a host can run it as it stands. The
        message names the machine it no longer fits and by how much; confirm=true
        saves it anyway, which is right for a pool whose hosts have not joined yet.
      x-zoomies-role: operator
      parameters:
        - name: confirm
          in: query
          description: Accept leaving this pool with nowhere to run.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deletePool
      tags: [pools]
      summary: Delete a pool
      description: >-
        Deleting a pool deletes its runners' records with it, so it is refused
        with 409 while any of them is still finishing a job. The refusal still
        asks them to stop, so the call that follows it is the short one: delete
        the pool again once they have gone. A pool whose runners are idle is
        deleted in one call, because an idle runner is removed outright rather
        than drained.
      x-zoomies-role: operator
      parameters:
        - name: drain
          in: query
          description: Let running jobs finish first. The default, and the only safe choice while work is in flight.
          schema: { type: boolean, default: true }
        - name: force
          in: query
          description: >-
            Destroy runners immediately, interrupting any job they are running.
            Deletes the pool in one call, because nothing is left to wait for.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  runners_affected: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /pools/{id}/prewarm:
    post:
      operationId: prewarmPool
      tags: [pools]
      summary: Prewarm the pool image on every matching host
      x-zoomies-role: operator
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "202":
          description: Tasks queued; hosts contains per-host pending or prior state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  hosts: { type: array, items: { $ref: "#/components/schemas/PoolPrewarm" } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /pools/{id}/enable:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: enablePool
      tags: [pools]
      summary: Enable a pool
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }

  /pools/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: disablePool
      tags: [pools]
      summary: Disable a pool
      description: Existing runners drain as they become idle; no new ones are created. Running jobs are not interrupted.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }

  # ==========================================================================
  # Runners
  # ==========================================================================
  /runners:
    get:
      operationId: listRunners
      tags: [runners]
      summary: List runners
      x-zoomies-role: viewer
      parameters:
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: host_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - name: state
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/RunnerState" } }
          style: form
          explode: true
        - { name: q, in: query, description: Substring match on name, ID or container ID., schema: { type: string } }
        - name: include_removed
          in: query
          description: Terminal runners are hidden by default, because a busy fleet accumulates thousands of them.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Runner" }

  /runners/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getRunner
      tags: [runners]
      summary: Get a runner
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRunner
      tags: [runners]
      summary: Delete a runner
      description: Without `force` this drains first, which still ends a running job after five minutes, so an unforced delete of a busy runner needs `confirm=true`. The registration is removed from GitHub either way.
      x-zoomies-role: operator
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
        - name: confirm
          in: query
          description: >-
            Accept that a job running on this runner will be ended. Needed only
            for an unforced delete of a busy runner, which drains it; `force`
            already says the same thing more loudly.
          schema: { type: boolean, default: false }
      responses:
        "202": { description: Accepted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The runner is running a job and neither `force` nor `confirm` was set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /runners/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: drainRunner
      tags: [runners]
      summary: Drain a runner
      description: >-
        Stop taking new jobs, finish the current one, then exit. The runner is
        given five minutes to finish and is then stopped, so draining a runner
        that is busy ends its job and GitHub marks it failed. That is refused
        with 409 unless `confirm=true` says the caller accepts it; a runner that
        is not busy has nothing to lose and drains without it.
      x-zoomies-role: operator
      parameters:
        - name: confirm
          in: query
          description: >-
            Accept that a job running on this runner will be ended. Required
            only when the runner is busy.
          schema: { type: boolean, default: false }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The runner is already terminal, or it is running a job and `confirm` was not set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /runners/{id}/timeline:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getRunnerTimeline
      tags: [runners]
      summary: A runner's state history
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TimelineEntry" }

  /runners/bulk:
    post:
      operationId: bulkRunnerAction
      tags: [runners]
      summary: Drain or delete several runners
      description: Returns a per-ID result, so a partial failure is visible rather than hidden behind one status code.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [drain, delete] }
                ids: { type: array, items: { type: string }, minItems: 1, maxItems: 500 }
                force: { type: boolean, default: false }
                confirm:
                  type: boolean
                  default: false
                  description: >-
                    Accept that any runner in this batch which is running a job
                    will lose it. Without it a busy runner comes back as its own
                    failed row rather than failing the batch.
      responses:
        "200":
          description: Per-ID outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }

  /runners/{id}/logs:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: streamRunnerLogs
      tags: [runners]
      summary: Live log tail (Server-Sent Events)
      description: |
        `text/event-stream`. The controller asks the runner's agent to open an
        outbound relay and fans the output out here. Nothing dials the agent.
      x-zoomies-role: viewer
      parameters:
        - { name: tail, in: query, description: Lines of backlog before following. 0 means everything., schema: { type: integer, default: 1000 } }
        - { name: follow, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runners/{id}/logs/download:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: downloadRunnerLogs
      tags: [runners]
      summary: Download a runner's logs
      x-zoomies-role: viewer
      responses:
        "200":
          description: A snapshot
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="zoomies-linux-x64-k3f9.log"'] }
          content:
            text/plain:
              schema: { type: string }

  # ==========================================================================
  # Jobs
  # ==========================================================================
  /provisioning:
    get:
      operationId: listProvisioning
      tags: [jobs]
      summary: Queued provisioning demand
      description: Always restricted to queued jobs belonging to this fleet. Counts respect all filters except provisioning status.
      x-zoomies-role: viewer
      parameters:
        - { name: branch, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }, style: form, explode: true }
        - { name: conclusion, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - name: unmatched
          in: query
          description: >-
            Only jobs that are still queued and that no enabled pool claims. A job that
            already started or finished was run by something else, so it is not included
            however its labels read, and neither is one whose labels all name GitHub's own
            runners or a hosted-runner vendor's: those run where their labels say.
          schema: { type: boolean }
        - name: managed
          in: query
          description: >-
            Only jobs this controller has a hand in: one an enabled pool claims, one that
            ran on a runner this fleet started, and queued jobs no pool claims -- which
            nothing ran, so they belong here too, unless their labels all name somebody
            else's runners. Leave it off to see every job GitHub has reported, including
            those run on hosted runners this fleet does not own.
          schema: { type: boolean }
        - name: failed
          in: query
          description: >-
            Only jobs that went wrong, on either side: a conclusion GitHub counts as a
            failure (failure, timed_out, startup_failure), or a runner of this fleet that
            stopped under the job -- including one GitHub still believes is running.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      counts:
                        type: object
                        additionalProperties: { type: integer }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }

  /provisioning/selection:
    get:
      operationId: selectProvisioning
      tags: [jobs]
      summary: Snapshot all matching queued item IDs, capped at 5000
      x-zoomies-role: viewer
      parameters:
        - { name: branch, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }, style: form, explode: true }
        - { name: conclusion, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - name: unmatched
          in: query
          description: >-
            Only jobs that are still queued and that no enabled pool claims. A job that
            already started or finished was run by something else, so it is not included
            however its labels read, and neither is one whose labels all name GitHub's own
            runners or a hosted-runner vendor's: those run where their labels say.
          schema: { type: boolean }
        - name: managed
          in: query
          description: >-
            Only jobs this controller has a hand in: one an enabled pool claims, one that
            ran on a runner this fleet started, and queued jobs no pool claims -- which
            nothing ran, so they belong here too, unless their labels all name somebody
            else's runners. Leave it off to see every job GitHub has reported, including
            those run on hosted runners this fleet does not own.
          schema: { type: boolean }
        - name: failed
          in: query
          description: >-
            Only jobs that went wrong, on either side: a conclusion GitHub counts as a
            failure (failure, timed_out, startup_failure), or a runner of this fleet that
            stopped under the job -- including one GitHub still believes is running.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Frozen IDs; later arrivals are excluded from subsequent actions
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids: { type: array, items: { type: string } }
  /provisioning/bulk:
    post:
      operationId: controlProvisioning
      tags: [jobs]
      summary: Control provisioning for one or more queued items
      description: >-
        Persistent operator controls. Pause and delete suppress new demand; resume restores normal
        demand; run_now resumes and expedites demand within pool priority, bypassing only scale-up delay.
        Existing runners, warm capacity, pool and host limits, quotas, backoff and GitHub jobs are unaffected.
        Completed, running and foreign hosted jobs are skipped with a per-item error. IDs are deduplicated.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, minItems: 1, maxItems: 5000, items: { type: string } }
                action: { type: string, enum: [pause, resume, delete, run_now] }
      responses:
        "200":
          description: Results for each unique selected ID
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Job history
      x-zoomies-role: viewer
      parameters:
        - { name: branch, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }, style: form, explode: true }
        - { name: conclusion, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - name: unmatched
          in: query
          description: >-
            Only jobs that are still queued and that no enabled pool claims. A job that
            already started or finished was run by something else, so it is not included
            however its labels read, and neither is one whose labels all name GitHub's own
            runners or a hosted-runner vendor's: those run where their labels say.
          schema: { type: boolean }
        - name: managed
          in: query
          description: >-
            Only jobs this controller has a hand in: one an enabled pool claims, one that
            ran on a runner this fleet started, and queued jobs no pool claims -- which
            nothing ran, so they belong here too, unless their labels all name somebody
            else's runners. Leave it off to see every job GitHub has reported, including
            those run on hosted runners this fleet does not own.
          schema: { type: boolean }
        - name: failed
          in: query
          description: >-
            Only jobs that went wrong, on either side: a conclusion GitHub counts as a
            failure (failure, timed_out, startup_failure), or a runner of this fleet that
            stopped under the job -- including one GitHub still believes is running.
          schema: { type: boolean }
        - name: faulted
          in: query
          description: >-
            Only the failures this fleet caused: the `failed` list narrowed to the jobs
            whose runner never started or stopped under them. This is the list to open
            when somebody says CI is flaky, because it is the half nobody else can fix.
          schema: { type: boolean }
        - name: workflow_failed
          in: query
          description: >-
            The other half: jobs GitHub failed with nothing wrong on this side. Sending
            this and `faulted` together is a 400, because they ask for opposite halves of
            one list.
          schema: { type: boolean }
        - name: fault
          in: query
          description: >-
            Narrow a fleet failure to particular categories; repeatable. A category this
            build does not know is a 400 rather than a filter that quietly matches
            everything, which would read as a fleet in better shape than it is.
          schema:
            type: array
            items: { $ref: "#/components/schemas/FaultKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }

  /jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cancelJobWorkflow
      tags: [jobs]
      summary: Cancel the GitHub workflow run containing a job
      description: >-
        Asks GitHub to cancel the whole workflow run, not only this job. The
        request is asynchronous; Zoomies keeps the job pending until a webhook
        or the fallback poller confirms its terminal state. Requires the opt-in
        setting and GitHub App Actions write permission.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Bypass conditions that may leave an ordinary cancellation stuck.
      responses:
        "202":
          description: GitHub accepted the cancellation request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, force, run_id]
                properties:
                  accepted: { type: boolean }
                  force: { type: boolean }
                  run_id: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/rerun:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: rerunJobWorkflow
      tags: [jobs]
      summary: Ask GitHub to run this run's failed jobs again
      description: >-
        The remedy for a job the fleet broke. A job whose runner died did not fail on
        its merits, and running it again is the ordinary fix; this saves finding the run
        on GitHub to press the button there.

        GitHub has no job-level rerun, so this re-runs **every failed job in the run**,
        not only this one. The request is asynchronous and nothing local is changed: the
        rerun arrives as new deliveries with a higher `run_attempt`, through the same
        webhook path as everything else.

        It refuses a job that has not finished and a job that did not fail, and it does
        not check whose fault the failure was -- an operator who has looked at one and
        decided to run it again is entitled to. The `fault_domain` on the job is what
        decides where the action is offered, not whether it is allowed. Needs the GitHub
        App's Actions write permission.
      x-zoomies-role: operator
      responses:
        "202":
          description: GitHub accepted the re-run request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, run_id]
                properties:
                  accepted: { type: boolean }
                  run_id: { type: integer, format: int64 }
                  fault_domain:
                    type: string
                    enum: [fleet, workflow]
                    description: Whose the failure being re-run was, echoed back for a script's log.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobEvents
      tags: [jobs]
      summary: A job's timeline
      description: >-
        What Zoomies observed and did about one job, oldest first, each entry a sentence
        an operator can read. Entries are written from what each delivery changed rather
        than from the delivery itself, so GitHub redelivering one adds nothing. Every
        change to the timeline is accompanied by a `job.updated` frame on the event
        stream, which is when a client refetches it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/explanation:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobExplanation
      tags: [jobs]
      summary: Why this job is where it is
      description: >-
        One answer to "why is this job not running?", computed on the controller from the
        last scheduler plan, the pool it was claimed by, and the runner and host behind
        it. It is a separate endpoint rather than a field on the job because it is
        computed from the fleet around the job rather than from its row, so a cached copy
        of the job delivered by the event stream would carry a stale one. The drawer, the
        CLI and the support bundle render this same answer, so they cannot disagree.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExplanation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/facets:
    get:
      operationId: getJobFacets
      tags: [jobs]
      summary: Distinct values for the job filter menus
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos: { type: array, items: { type: string } }
                  workflows: { type: array, items: { type: string } }
                  conclusions: { type: array, items: { type: string } }

  # ==========================================================================
  # Hosts
  # ==========================================================================
  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      summary: List hosts
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Host" }

  /hosts/samples:
    get:
      operationId: listHostSamples
      tags: [hosts]
      summary: Per-host minute samples for the capacity map
      description: >-
        One row per host per minute: its slots, what its agent measured (CPU,
        the one-minute load average, available memory), what the scheduler had
        promised away on it, and its disk. A measurement the host had not made,
        or one older than 90 seconds when the minute was sampled, is absent
        rather than zero, so a host that stopped reporting draws a gap rather
        than a flat line. Kept for `retention.samples`, like the fleet samples.
      x-zoomies-role: viewer
      parameters:
        - name: window
          in: query
          schema: { type: string, default: "1h" }
        - name: since
          in: query
          description: An exact instant to resume from. Wins over `window` when both are given.
          schema: { type: string, format: date-time }
        - name: host_id
          in: query
          description: One host's samples only. Left out, every host's.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HostSample" }

  /hosts/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getHost
      tags: [hosts]
      summary: Get a host
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateHost
      tags: [hosts]
      summary: Update a host's capacity, labels or reserve
      description: >-
        Refused with 409 when the reserve or the labels described would leave a pool
        that runs here today with no host in the fleet that could ever run it. The
        message names the pool and the shortfall; confirm=true saves it anyway, which
        is right when the pool is on its way out.
      x-zoomies-role: operator
      parameters:
        - name: confirm
          in: query
          description: Accept leaving a pool with nowhere to run.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Every field is optional and independent; what is not named is left alone.
                The reserve is what this machine keeps for itself, in the units the host
                reports its own figures in. A reserve on a figure the host has never
                reported, or one that would leave nothing to place on, is refused rather
                than clamped.
              properties:
                capacity: { type: integer, minimum: 0 }
                labels: { type: object, additionalProperties: { type: string } }
                reserve_cpus: { type: integer, minimum: 0 }
                reserve_memory_mb: { type: integer, format: int64, minimum: 0 }
                reserve_disk_mb: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteHost
      tags: [hosts]
      summary: Remove a host
      description: Refused while the host still has live runners, unless forced.
      x-zoomies-role: admin
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /hosts/{id}/cordon:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cordonHost
      tags: [hosts]
      summary: Cordon or uncordon a host
      description: A cordoned host keeps its existing runners and accepts no new ones.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cordoned]
              properties:
                cordoned: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }

  /hosts/{id}/throttle/clear:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: clearHostThrottle
      tags: [hosts]
      summary: Lift a host's throttle
      description: |
        Lifts the throttle the controller has this host on, whatever rung it is on:
        the host takes its configured capacity again on the next scheduling pass and
        every runner here with a CPU limit is restored to its full quota on the agent's
        next heartbeat. Nothing pins it the other way -- if the pressure is still there,
        the next heartbeat steps it back up -- so this is for a host whose cause is
        known and fixed, not a way to switch throttling off. A host on no rung is
        returned unchanged. Audited as `host.throttle_clear` under the caller's identity.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }

  /join-tokens:
    get:
      operationId: listJoinTokens
      tags: [hosts]
      summary: List join tokens
      description: The secret itself is never returned; only its prefix, for identification.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JoinToken" }
    post:
      operationId: createJoinToken
      tags: [hosts]
      summary: Mint a join token
      description: |
        Returns the plaintext token **once**, along with a ready-to-paste
        command for the new host. Single-use, and short-lived by default.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: string, default: "15m", examples: ["15m", "1h"] }
                capacity:
                  type: integer
                  default: 2
                  minimum: 0
                  description: 0 lets the agent decide from the host's CPU count.
                labels: { type: object, additionalProperties: { type: string } }
                connection:
                  type: string
                  enum: [direct, tailcat]
                  default: direct
                  description: Tailcat creates a private encrypted agent connection and supplies its address in the returned commands.
                controller_url:
                  type: string
                  format: uri
                  description: |
                    The address the new host should join on, used in the
                    returned command in place of `server.external_url`. The
                    UI sends the address the browser reached this controller
                    on, which is the one a machine beside it can usually reach
                    too. Must be an absolute http or https URL.
                  examples: ["https://zoomies.example.com"]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JoinToken"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Shown once. Only its hash is stored.
                      join_command:
                        type: string
                        description: Command for an existing binary. Contains credentials; shown only in this response.
                      command:
                        type: string
                        description: The one-liner to run on the new host.
                        examples: ["curl -fsSL https://zoomies.sh/install.sh | sh -s -- --mode agent --controller https://zoomies.example.com --join-token zoojoin_... --version v1.0.0"]
                      controller_version:
                        type: string
                        description: The concrete controller build the command was generated by.
                        examples: ["main-sha-abc1234 (abc1234)"]
                      install_tag:
                        type: string
                        description: The binary and image channel selected for the new host.
                        examples: ["dev"]
                      version_note:
                        type: string
                        description: >-
                          Why the command could not be pinned to this controller's build, or
                          absent when it was. Main builds use the rolling dev asset; only local
                          or otherwise unpublished builds have no matching install tag.

  /join-tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJoinToken
      tags: [hosts]
      summary: Get a join token
      description: |
        The token's state, never its secret. Once a host has redeemed it,
        `used_by_id` is that host's id -- which is how the Add-a-host page
        knows the machine it is waiting for has arrived.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinToken" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteJoinToken
      tags: [hosts]
      summary: Revoke an unused join token
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Providers and machines
  # ==========================================================================
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List infrastructure providers
      description: >-
        A provider is one place machines can be rented from. The credential is never in
        the response and has no field it could be in: `credentials_configured` says
        whether one is sealed in the row, which is all a form needs to know.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      operationId: createProvider
      tags: [providers]
      summary: Configure a provider
      description: >-
        The credential is sealed with the instance key before the row is written. A
        provider is created renting nothing - `max_machines` defaults to zero - so that
        nothing starts spending money on the strength of a connection test.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /providers/validate:
    post:
      operationId: validateProvider
      tags: [providers]
      summary: Check a draft provider without saving it
      description: >-
        A dry run over a draft, for the wizard's review step. It writes nothing and dials
        nothing - a driver's own validator is offline by contract - so it can be run as
        somebody types. It always answers 200: whether the draft is valid is in the body.
        Pass `?id=` when the draft is an edit to an existing provider, so the name check
        does not refuse it about itself. `POST /providers/{id}/check` is the call that
        talks to the hypervisor.
      x-zoomies-role: admin
      parameters:
        - { name: id, in: query, schema: { type: string }, description: The provider this is a dry run of an edit to. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderValidation" }

  /providers/discover:
    post:
      operationId: discoverProviderDraft
      tags: [providers]
      summary: Ask a draft provider what its credential can see
      description: >-
        The same lists as `GET /providers/{id}/discovery`, for a provider that has not been
        saved yet, so the wizard can offer nodes, storages, bridges and templates as a
        menu before there is a row. The draft is checked exactly as a create would check
        it and refused with the same field errors, so nothing is asked about a body that
        could not be saved. A hypervisor that does not answer or refuses the token is
        200 with empty lists and the reason in `unavailable`: halfway through a wizard
        that is the expected state, and the form asks for identifiers instead.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDiscovery" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /providers/kinds:
    get:
      operationId: listProviderKinds
      tags: [providers]
      summary: What this build can rent machines from
      description: >-
        Every driver this build ships, its capabilities, and the questions its
        configuration form has to ask. The wizard renders its form from this, so a setting
        a driver gained cannot be missing from the form that collects it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderKind" }

  /providers/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Change a provider's settings, shape or ceilings
      description: >-
        Every field is optional and independent; what is not named is left alone. A
        credential of `""` leaves the stored one alone, so a form with a blank password
        box does not erase it. A provider's kind cannot be changed: the machines it
        already owns are that kind.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Remove a provider
      description: >-
        Refused while any of its machines still believes it holds a resource, naming how
        many. The rows are the only record of what was rented, so the machines go first.
      x-zoomies-role: admin
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/check:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: checkProvider
      tags: [providers]
      summary: Run the live preflight
      description: >-
        Asks the provider what it would refuse, changing nothing there. The result is
        recorded on the row as well as returned, so a check run in a terminal quiets the
        warning the UI is showing. Audited, because it uses the credential.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCheck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/discovery:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProviderDiscovery
      tags: [providers]
      summary: What this credential can actually see
      description: >-
        The nodes, storages, bridges and templates a provider offers, so the form presents
        a menu rather than asking somebody to go and look an identifier up. A driver that
        cannot list them answers 409 and the form asks for the identifiers instead.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDiscovery" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/orphans:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProviderOrphans
      tags: [providers]
      summary: Rows and resources that disagree
      description: >-
        The three ways a machine row and a real resource can fail to agree: a resource
        wearing this fleet's naming that no row accounts for, a row that holds nothing,
        and a machine whose ownership nothing has been able to confirm. Nothing here is
        ever acted on automatically.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOrphans" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: pauseProvider
      tags: [providers]
      summary: Stop this provider buying new machines
      description: >-
        The kill switch. It blocks new machines only: draining, deleting, recovering and
        verifying ownership all continue, because a switch that stopped those would strand
        running machines nobody is watching. Pressing it twice is not an error.
      x-zoomies-role: operator
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Why, for the card and the audit row. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: resumeProvider
      tags: [providers]
      summary: Let this provider buy machines again
      description: Pressing it twice is not an error.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }

  /machines:
    get:
      operationId: listMachines
      tags: [providers]
      summary: List rented machines
      description: >-
        There is deliberately no POST. A machine exists because demand asked for one: one
        creation path means one accounting path, and a machine made by hand would be
        supply the reconciler would then decide to delete.
      x-zoomies-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
        - { name: provider, in: query, schema: { type: string }, description: Repeatable, or comma-separated. }
        - { name: pool, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/MachineState" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false }, description: Keep machines whose resource is confirmed gone. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Machine" }

  /machines/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getMachine
      tags: [providers]
      summary: Get a machine, with the phases it has reached
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMachine
      tags: [providers]
      summary: Destroy a machine and the resource behind it
      description: >-
        Records the intent and answers with the machine in `deleting`: a delete is
        finished when the resource can no longer be found, not when the provider returns.
        Refused while runners are still going unless forced. A quarantined machine is
        never deletable, forced or not - its resource may belong to somebody else - and
        the escape hatch there is release.
      x-zoomies-role: admin
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /machines/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: drainMachine
      tags: [providers]
      summary: Cordon a machine and let its runners finish
      description: >-
        Reversible right up until the delete starts: demand coming back takes a draining
        machine to ready again rather than paying for a new one.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /machines/{id}/release:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: releaseMachine
      tags: [providers]
      summary: Forget a machine without touching its resource
      description: >-
        For the machine nobody can safely delete: a quarantined one whose resource turned
        out to be somebody else's, or a row for a resource that was removed by hand. The
        machine's name must be in the body to confirm. If the resource does still exist it
        goes on running, so the audit row keeps the provider's identifiers for it after
        the database has stopped holding them.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: The machine's name, typed to confirm. }
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Migrations
  # ==========================================================================
  /migrations/plan:
    post:
      operationId: planMigration
      tags: [migrations]
      summary: What moving these repositories onto Zoomies would change
      description: |
        Reads the workflow files in the repositories a GitHub App installation
        can see, and reports the `runs-on` lines it would rewrite, the ones it
        would leave alone and why, and a unified diff of each change.

        It writes nothing. Everything it returns is a proposal for the operator
        to edit before `POST /migrations/pull-requests` acts on it.

        With no `mapping`, the server proposes one from the pools that exist,
        matching each GitHub-hosted label against the pool that promises the
        same operating system and architecture. A label with no plausible pool
        is left unmapped rather than mapped approximately, and appears in
        `unmapped`.

        `mapping` is one answer per label for every repository, which is what
        most fleets want. `overrides` are the exceptions to it: each names one
        job in one workflow file in one repository and sends it somewhere else,
        or -- with an empty `to` -- leaves that one job on GitHub's runners.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: Limits the plan to these repositories. Empty means every repository the installation can see, up to the server's limit.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                  description: >-
                    Hosted label to the runs-on value that replaces it, e.g.
                    {"ubuntu-latest": "zoomies-linux-x64"}. Empty asks the server to propose one.
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`, each naming one job in one workflow file in one
                    repository. Empty is the common case: most fleets want one answer per
                    hosted-runner label everywhere.
                cursor:
                  type: string
                  description: >-
                    The page of repositories to read: the `next_cursor` a previous plan
                    returned, which is the full name of the last repository it listed.
                    Empty starts at the first page. Ignored when `repos` names repositories.
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /migrations/pull-requests:
    post:
      operationId: openMigrationPullRequests
      tags: [migrations]
      summary: Open the pull requests a plan described
      description: |
        Opens one pull request per repository, each on its own branch, changing
        only the workflow files whose `runs-on` the mapping covers.

        The plan is recomputed here from the repositories' current contents
        rather than taken from the client: the workflows may have changed since
        the review step, and accepting file contents from a browser would make
        this a way to write arbitrary files into any repository the App can
        reach. Every file is committed against the blob SHA it was read at, so a
        push that lands in between is a conflict rather than a silent revert.

        The App needs three permissions the rest of Zoomies does not:
        Contents (write), Pull requests (write) and Workflows (write). The plan
        endpoint reports which are missing before anything is attempted.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, repos]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: The repositories to open pull requests on. Required; this endpoint never defaults to every repository an App can see.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`. A request with no mapped label is accepted when at
                    least one override carries a `to`, because pointing three jobs at a pool by
                    name is a migration too.
                workflows:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                  description: >-
                    Narrows a repository to these workflow files, keyed by repository, e.g.
                    {"acme/widgets": [".github/workflows/ci.yml"]}. A repository left out of
                    the map gets every file the mapping would change. A path that is not
                    directly under .github/workflows is rejected.
                title: { type: string, description: Overrides the default pull request title. }
                body: { type: string, description: Overrides the generated body, which lists what moved and what was left alone. }
                commit_message: { type: string, description: Overrides the default commit message. }
                badge:
                  type: boolean
                  default: true
                  description: >-
                    Whether each pull request also adds the "CI has the Zoomies" badge to the
                    repository's README, at the end of the row of badges it already has or on
                    its own line under the title. On unless you say otherwise; a README that is
                    missing, not Markdown, or already carries the badge is left alone and the
                    result says so. The badge never stops a pull request being opened.
      responses:
        "200":
          description: What happened to each repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOutcome" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Audit
  # ==========================================================================
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: The audit log
      x-zoomies-role: viewer
      parameters:
        - { name: actor_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: action, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/actions:
    get:
      operationId: listAuditActions
      tags: [audit]
      summary: Distinct action names, for the filter menu
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: string } }

  # ==========================================================================
  # Administration
  # ==========================================================================
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 12, format: password, description: Omit for an account that will sign in through OIDC. }
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getUser
      tags: [admin]
      summary: Get a user
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Reset a user's password
      description: Sets `must_change_password`, so the user picks their own on next sign-in.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 12, format: password }
      responses:
        "204": { description: Reset }

  /tokens:
    get:
      operationId: listTokens
      tags: [admin]
      summary: List API tokens
      description: Metadata only. The token value exists in plaintext exactly once, at creation.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    post:
      operationId: createToken
      tags: [admin]
      summary: Create an API token
      description: |
        A token carries no more than the caller that made it: the role may not
        exceed the caller's, and a caller narrowed by scopes may only mint a
        token narrowed at least as far. The token is attributed to the account
        behind the caller -- the signed-in user, or the owner of the token in
        use -- so disabling or deleting that account ends it too. A token with
        no owner cannot mint tokens; anything wider than the caller is a 422.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, examples: ["prometheus"] }
                role: { $ref: "#/components/schemas/Role" }
                scopes:
                  type: array
                  items: { type: string, examples: ["pools:read", "runners:write"] }
                  description: Optional narrowing within the role. Empty means whatever the role allows.
                expires_in: { type: string, examples: ["2160h"], description: Omit for a token that never expires, which is worth avoiding. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIToken"
                  - type: object
                    properties:
                      token: { type: string, description: Shown once. }

  /tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: revokeToken
      tags: [admin]
      summary: Revoke an API token
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /recovery:
    get:
      operationId: getRecovery
      tags: [recovery]
      summary: Whether this fleet is held for recovery
      description: >-
        A restored database is marked for recovery, and a controller that reads that mark
        decides as normal and applies none of it: no runner is created, drained or
        removed, nothing is reaped from GitHub, and the fallback poller does not sweep.
        The plan is still computed and published, so an operator can see exactly what
        would happen the moment the fence is lifted -- and can tell "nothing to do" from
        "not allowed to". A fenced instance answers `/readyz` with 503; liveness is
        unaffected, so its container runtime does not restart it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  /recovery/unfence:
    post:
      operationId: unfence
      tags: [recovery]
      summary: Lift the recovery fence
      description: >-
        A person saying that a recovered fleet has been checked and may act on the world
        again. It is audited under its own action, because the audit log is where somebody
        later asks who decided that and when. Lifting an unfenced instance succeeds and
        changes nothing: two operators recovering one fleet will both press it.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  # ==========================================================================
  # Backups
  # ==========================================================================
  # Every route here is admin, and a backup is the whole database: every
  # account's password hash and every sealed credential. The upload is bounded
  # by its own handler rather than the API's ordinary body limit.
  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: Every backup, and the state of the schedule
      description: >-
        The backups in `backup.directory` and the copies the store took before
        migrating, newest first, each with what its manifest says and whether a
        restore of it would be refused; the schedule and its last outcome; the
        restore waiting for a restart, if any; and what became of the last one.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backups" }
    post:
      operationId: takeBackup
      tags: [backups]
      summary: Take a backup now
      description: >-
        A consistent copy of the live database, taken with `VACUUM INTO`, checked
        with `PRAGMA integrity_check`, and written with its manifest into
        `backup.directory`. Retention (`backup.keep`) runs afterwards. Refused with
        409 while another backup is being taken.
      x-zoomies-role: admin
      responses:
        "201":
          description: Taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/upload:
    post:
      operationId: uploadBackup
      tags: [backups]
      summary: Bring a backup here
      description: >-
        A `multipart/form-data` form with the archive in `file` -- a `.tar.gz` a
        download produced, or the `.tar.gz.enc` an encrypted download produced with
        its `passphrase` in a second part. The archive is unpacked into a staging
        directory, verified as a restore would verify it, and then listed under the
        name its manifest gives it, with its source recorded as uploaded. An upload
        is never counted or removed by retention.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                passphrase: { type: string, format: password }
      responses:
        "201":
          description: Unpacked and verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "413": { description: The upload is over the limit. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/restore:
    delete:
      operationId: cancelRestore
      tags: [backups]
      summary: Cancel the staged restore
      description: Forgets the restore waiting for a restart. Cancelling when none is staged succeeds.
      x-zoomies-role: admin
      responses:
        "204": { description: Cancelled }

  /backups/restore/apply:
    post:
      operationId: applyRestore
      tags: [backups]
      summary: Restart the controller to apply the staged restore
      description: >-
        Stops this controller so that its service manager starts the next one,
        which applies the staged restore before it opens the database. The response
        is written before the process stops. Refused with 409 when nothing is
        staged, because a restart with nothing to apply is an outage. Whether the
        process comes back is up to whatever started it; a systemd unit and a
        container with a restart policy both bring it back, and a controller run
        by hand needs starting by hand.
      x-zoomies-role: admin
      responses:
        "202":
          description: Stopping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restarting" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/restore/outcome:
    delete:
      operationId: dismissRestoreOutcome
      tags: [backups]
      summary: Dismiss what became of the last restore
      x-zoomies-role: admin
      responses:
        "204": { description: Dismissed }

  /backups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The backup's directory name, e.g. `zoomies-20260916-120000`.
    get:
      operationId: getBackup
      tags: [backups]
      summary: One backup
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBackup
      tags: [backups]
      summary: Delete a backup
      description: Refused with 409 while the backup is staged to be restored.
      x-zoomies-role: admin
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/{id}/verify:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyBackup
      tags: [backups]
      summary: Re-read a backup and check it
      description: >-
        Compares the database's digest with the one the manifest recorded, opens it,
        runs `PRAGMA integrity_check`, and says whether this build could restore it.
        A POST because it reads the whole file.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerification" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadBackup
      tags: [backups]
      summary: Download a backup as a gzipped tar
      description: >-
        The backup's directory -- manifest, database and, only when it was taken
        with it, the encryption key -- as `<id>.tar.gz`. Audited: it is the whole
        database leaving the machine.
      x-zoomies-role: admin
      responses:
        "200": { description: The archive, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: downloadBackupEncrypted
      tags: [backups]
      summary: Download a backup encrypted with a passphrase
      description: >-
        The same archive, encrypted as `<id>.tar.gz.enc`: the passphrase is run
        through argon2id and the archive through AES-256-GCM in chunks, so a file
        cut short or altered does not open as a shorter backup. The upload route
        takes the same passphrase to bring it back.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, format: password, minLength: 8 }
      responses:
        "200": { description: The encrypted archive, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: stageRestore
      tags: [backups]
      summary: Stage a restore of this backup for the next restart
      description: >-
        Nothing is restored by this call. The controller cannot swap the database it
        is running on, so every check a restore makes is made now -- the copy is
        sound, this build can read it, and this host's encryption key is the one that
        sealed it -- and the restore is written down beside the database for the next
        controller to apply before it opens anything. `POST /backups/restore/apply`
        is the restart that does it. The restored fleet comes back fenced, with
        every session ended and every unredeemed join token removed; the two options
        go further, as `zoomies restore`'s flags do.
      x-zoomies-role: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revoke_api_tokens: { type: boolean, description: Revoke every API token as well. }
                reset_agent_tokens: { type: boolean, description: Forget every host's agent credential, so each agent joins again. }
      responses:
        "202":
          description: Staged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagedRestore" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /diagnostics/bundle:
    get:
      operationId: getSupportBundle
      tags: [diagnostics]
      summary: A support bundle for this instance
      description: >-
        Everything a bug report needs about this controller in one JSON document: the
        build and the process, the effective configuration and its findings, the current
        problems, the fleet's installations, pools, hosts and runners, the work in flight
        with the controller's own explanation for each of it, and the recent scheduler
        decisions. It is assembled from the same renderings the other routes serve, so a
        section that is secret-free on its own route is secret-free here.


        It never carries workflow log bodies. There is no redaction pass for them and
        there cannot be a reliable one, so the bundle carries runner ids and the download
        route instead and an operator attaches logs deliberately.


        Assembly is section by section: a section that fails costs its own contents and
        lands in `errors` rather than failing the whole document, because the moment a
        bundle is taken is the moment a query is most likely to fail. Sections are capped
        by row count and the whole document by bytes; anything shortened says so in
        `truncated`.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportBundle" }

  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: The effective configuration, key by key
      description: >-
        Every key with its value, its kind, the layer it came from and whether it
        can be changed here, plus the same configuration as a nested object. No
        secret's value is ever sent. The validator's findings are included so the
        UI can show each one next to the setting it concerns.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Change this fleet's settings
      description: |
        Keys may be sent nested (`{"retention":{"jobs":"720h"}}`) or dotted
        (`{"retention.jobs":"720h"}`). A `null` value clears the stored setting,
        so the key goes back to whatever the configuration file or the built-in
        default says.

        Every key is checked before any is written, and the whole request is
        refused if one fails — including when the result would be a controller
        that will not start, which the validator is asked about before anything
        is stored.

        An accepted change is always kept. One the running process can apply
        does so at once; one it cannot — rebinding the listener, rebuilding the
        backends — is stored and named in `pending_restart`.

        Refused: a key that is read before the database opens, one that belongs
        to a standalone agent's own host, and one an environment variable is
        pinning. Each refusal says which it is and what to do instead.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /settings/export:
    get:
      operationId: exportSettings
      tags: [admin]
      summary: Every setting somebody has set, as a file
      description: >-
        Stored here, set in the configuration file, or pinned by the environment;
        never a default, because those are computed on the host that reads them,
        and never a secret's value. `format=json` wraps the tree with when it was
        taken, where from, and which secrets were configured but not exported;
        `format=yaml` is the tree alone, in the shape zoomies.yaml takes, so the
        download can be started from. Audited.
      x-zoomies-role: admin
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, yaml], default: json } }
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsExport" }
            application/yaml:
              schema: { type: string }

  /settings/import:
    post:
      operationId: importSettings
      tags: [admin]
      summary: Read an export or a zoomies.yaml back, previewing first
      description: >-
        Every key in the document is planned through the checks a PATCH makes and
        reported as `change`, `unchanged`, `unset` or `refused` with the reason. A
        dry run reports and writes nothing. A real run refuses the whole document
        with 422 while any key is refused, so an import is one change or none;
        `skip` names the keys to leave out. Applying returns the settings page too.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsImportRequest" }
      responses:
        "200":
          description: The preview, or the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsImport" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Agent routes
  # ==========================================================================
  # The half of the API agents talk to. These carry an agent token, never a
  # user session, and an agent can reach nothing else. They are here so that
  # this document is the whole surface it says it is, and marked x-internal
  # because no general client should call them: the wire types are owned by
  # internal/agent/protocol.go, and a client generator should skip them.
  /agent/join:
    post:
      operationId: agentJoin
      tags: [agent]
      x-internal: true
      summary: Redeem a join token and enrol a host
      description: >-
        The one anonymous agent route, because it is the call that mints the credential every
        other one carries. The join token is single-use and short-lived; the agent token in
        the response is shown exactly once, and the controller keeps only its hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentJoinRequest" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentJoinResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent/heartbeat:
    post:
      operationId: agentHeartbeat
      tags: [agent]
      x-internal: true
      summary: Report that the host is alive, and what its runners are doing
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHeartbeatRequest" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHeartbeatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The host was deleted. No amount of retrying brings the row back; the agent re-joins. }

  /agent/tasks:
    get:
      operationId: agentPollTasks
      tags: [agent]
      x-internal: true
      summary: Long-poll for work
      description: Blocks until the host has work or the wait elapses, so a task reaches an agent the instant it is queued while an idle agent makes two or three requests a minute.
      security: [{ agentAuth: [] }]
      parameters:
        - name: wait
          in: query
          description: Seconds to wait for work before answering with an empty batch.
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: The tasks queued for this host, possibly none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTaskBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/results:
    post:
      operationId: agentReportResult
      tags: [agent]
      x-internal: true
      summary: Report the outcome of one task
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTaskResult" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agent/report:
    post:
      operationId: agentReportRunners
      tags: [agent]
      x-internal: true
      summary: Report what the host's runners are doing, outside a heartbeat
      description: The body is a bare array of runner reports, because that is what the agent sends and the two halves of the protocol must agree.
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RunnerReport" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/logs/{stream_id}:
    post:
      operationId: agentRelayLogs
      tags: [agent]
      x-internal: true
      summary: Relay a runner's output to a viewer
      description: >-
        The inverted half of log streaming. The controller never dials an agent, so a viewer's
        request makes it queue a stream_logs task, and the agent answers by opening this
        chunked POST, which stays open for as long as the runner produces output. Exempt from
        the body-size limit for that reason.
      security: [{ agentAuth: [] }]
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string }, description: The stream named by the stream_logs task. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: The stream ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Nobody is watching this stream any more; the agent stops sending. }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zoomies_session
      description: Set by `POST /auth/login`. HttpOnly, SameSite=Lax, and Secure when the external URL is https.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zoo_<prefix>_<secret>
      description: An API token. Not subject to the same-origin check, because it is not vulnerable to CSRF.
    agentAuth:
      type: http
      scheme: bearer
      bearerFormat: zooagent_<secret>
      description: >-
        An agent's own token, minted by `POST /agent/join`. Accepted on `/agent/*` only: a
        user credential is refused there, and an agent token is refused everywhere else.

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The resource ID, e.g. `pool_k3f9qz2m`.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Sort:
      name: sort
      in: query
      description: A column name. An unknown value falls back to the default rather than erroring, so a stale bookmark does not break the page.
      schema: { type: string }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    Unauthorized:
      description: Not signed in, or the credential was rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Signed in, but the role is not sufficient. The message says which role is needed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: The request was understood but is not valid. `errors` names the fields.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  errors: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
    RateLimited:
      description: Too many attempts. Retry-After says how long to wait.
      headers:
        Retry-After:
          description: Seconds until the address is allowed another attempt.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # --- primitives -------------------------------------------------------
    Role:
      type: string
      enum: [viewer, operator, admin]
    TargetType:
      type: string
      enum: [org, repo]
    BackendKind:
      type: string
      enum: [docker, podman, process]
    PullPolicy:
      type: string
      enum: [if-not-present, always, pinned-only]
      default: if-not-present
      description: pinned-only requires an image@sha256 digest and rejects mutable tags.

    DockerMode:
      type: string
      enum: [none, dind, host-socket]
      description: |
        How much Docker a job on this pool gets.
        `none` is the default and the only one that is not a warning.
        `dind` gives a private, privileged sidecar daemon.
        `host-socket` hands the job the host's daemon, and with it root on the host.
        Either of those switches a pool on the stock `ghcr.io/eyupio/zoomies-runner`
        image under a moving tag (none, `latest` or `main`) to
        `ghcr.io/eyupio/zoomies-runner-docker` under the same tag as it is saved,
        because the stock image has no client for the daemon. A pinned tag, a
        digest, or an image of your own is left as given.
    RunnerState:
      type: string
      enum: [provisioning, registering, idle, busy, draining, removed, failed]
    JobState:
      type: string
      enum: [waiting, queued, in_progress, completed]
    Severity:
      type: string
      enum: [error, warning, info]
    Duration:
      type: string
      description: A Go duration string.
      examples: ["5m", "1h30s"]

    Page:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: Rows matching the filter, not rows returned. }
        limit: { type: integer }
        offset: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, unprocessable, too_large, rate_limited, internal]
            message: { type: string, description: Written for a person to read, and to act on. }
            field: { type: string }
            detail: { type: string }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [labels] }
        message: { type: string, examples: ["a pool needs at least one label your workflows can ask for"] }

    HostExclusion:
      type: object
      required: [host, code, reason]
      properties:
        host: { type: string, examples: [zoomies-12vcpu-31gb-debian-12] }
        code:
          type: string
          description: Which placement rule turned this host down.
          enum: [unavailable, backend, platform, size]
        reason:
          type: string
          description: A sentence about the host with its name left out, so a caller can put the name where its own layout wants it.
          examples: ["it has 12 CPU to place on, and one runner of this pool is charged 16, twice what it asks for, because a docker-in-docker runner is charged for its sidecar too"]

    SettingSource:
      type: string
      enum: [default, file, database, environment]
      description: >-
        Which layer set a value. They stack in that order -- the built-in defaults, then
        zoomies.yaml, then this fleet's database, then `ZOOMIES_*` in the environment --
        and each wins over the one before it.

        It is the answer to the question that makes a configuration problem hard: "I
        changed it and nothing happened". A value the environment is pinning cannot be
        changed from the file or from this API, and one stored in the database is not
        changed by editing the file.

    Problem:
      type: object
      required: [code, severity, title]
      properties:
        code: { type: string, examples: [bind.public_no_tls] }
        severity: { $ref: "#/components/schemas/Severity" }
        setting: { type: string, examples: [server.bind] }
        source:
          $ref: "#/components/schemas/SettingSource"
        undo:
          type: string
          description: >-
            The command that takes this value back out of the layer that set it, when there
            is one. Empty for a value in the configuration file, which is edited where it
            is, and for a default.

            It exists for the case the settings page cannot help with: a value saved here
            that stops the controller starting is unreachable from a page the controller
            serves, so the way back has to be something an operator can type at a stopped
            one.
          examples: ["zoomies config unset server.bind"]
        title: { type: string, description: One line - what is true. }
        detail: { type: string, description: Why it matters, and the consequence. }
        fix:
          type: string
          description: >-
            What to change, concretely. Read it with `source`: an operator told to change a
            setting will edit the configuration file, and a value stored in this fleet's
            database or pinned by a ZOOMIES_* variable is one the file cannot change.
        target_kind: { type: string }
        target_id: { type: string }
        alternatives:
          type: array
          description: >-
            The choices the fix leaves open, when the fix is a choice. For a pool
            no host can run, these are the backends its hosts do offer, so the UI
            can put the change one click away.
          items: { $ref: "#/components/schemas/BackendKind" }
          examples: [[podman]]
        since: { type: string, format: date-time }

    # --- meta -------------------------------------------------------------
    Meta:
      type: object
      required: [version, bootstrap_required]
      properties:
        version: { type: string, examples: ["1.0.0 (abc1234)"] }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this build. }
        commit: { type: string }
        bootstrap_required: { type: boolean, description: True when no user exists yet. }
        tailcat_available: { type: boolean, description: Whether private enrolment is enabled and the controller has its encryption key. Relay connectivity is checked at enrolment. }
        auth_disabled: { type: boolean, description: True when authentication has been switched off in the configuration. }
        oidc_enabled: { type: boolean }
        oidc_label: { type: string, examples: ["Sign in with Okta"] }
        external_url: { type: string }
        webhook_url: { type: string }
        polling_only: { type: boolean, description: True when no webhook has ever been received and the poller is doing the work. }
        poller_enabled: { type: boolean, description: True when the fallback poller is running. It is off only by configuration, never by failure. }
        workflow_cancellation_enabled: { type: boolean, description: True when operators may ask GitHub to cancel workflow runs. }
        providers_available:
          type: boolean
          description: >-
            True when this deployment can rent machines - the build ships at least one
            provider driver and provider.enabled is on - so the page that would otherwise
            offer to buy machines nothing would ever create knows not to.
        poller_last_poll_at: { type: string, format: date-time, nullable: true, description: When the fallback poller last completed a sweep, or absent if it has not completed one since this controller started. }
        capacity_map:
          type: object
          description: >-
            How the host capacity map opens on each page that carries it, from
            ui.capacity_map.* in the fleet's settings. An operator who picks the
            other layout on the page keeps that pick in their browser; this is
            what somebody who has never chosen sees.
          properties:
            overview_layout: { $ref: "#/components/schemas/CapacityMapLayout" }
            hosts_layout: { $ref: "#/components/schemas/CapacityMapLayout" }
    CapacityMapLayout:
      type: string
      description: overlay draws every host on one chart; split draws a chart for each.
      enum: [overlay, split]

    # --- overview ---------------------------------------------------------
    Stats:
      type: object
      properties:
        window: { type: string, description: The window these counts cover, echoed back., examples: ["1h"] }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        completed: { type: integer, description: Within the requested window. The sum of the four below. }
        succeeded: { type: integer, description: GitHub reported success and the fleet had no fault in it. }
        failed: { type: integer, description: A failing conclusion, or a runner that stopped under the job. }
        fleet_failed:
          type: integer
          description: >-
            How many of `failed` this deployment caused rather than the workflows: a runner
            that never started, or one that stopped under the job. A subset rather than a
            fifth outcome, because GitHub's answer for such a job is still "failure" and a
            split that did not add up would be a worse lie than no split.
        faults:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Those failures by category, keyed by FaultKind. Categories with no jobs are
            absent rather than zero. This is what turns "eleven failures this hour" into
            "eleven, nine of them out of memory", which is a different sentence and sends a
            different person to a different page.
        runner_start_faults:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Runners that failed before they could take a job, by category. These appear in
            no job count anywhere, because the jobs they were meant for are still queued --
            which is exactly why a pool that cannot start a container reads, everywhere
            else, as a fleet that is merely busy.
        cancelled: { type: integer, description: Cancelled or skipped, with no fault of the fleet's. }
        unknown: { type: integer, description: None of the above, including a job GitHub stopped reporting. Never counted as a success. }
        median_wait_ms: { type: integer, format: int64 }
        p95_wait_ms: { type: integer, format: int64 }
        p50_startup_ms: { type: integer, format: int64, description: Median runner creation-to-container-start latency. }
        p95_startup_ms: { type: integer, format: int64 }
        p50_registration_ms: { type: integer, format: int64, description: Median container-start-to-registration latency. }
        p95_registration_ms: { type: integer, format: int64 }
        fleet:
          type: object
          description: >
            The same job figures narrowed to the jobs this fleet has a hand in:
            one an enabled pool claimed, one that ran on a runner started here,
            or one still queued that no pool claims. GitHub reports every job in
            an installed repository, so on an organisation that also uses hosted
            runners the figures above are mostly somebody else's. Both are
            carried in one payload because the same numbers arrive over the
            event stream, which is one frame for every viewer.
          properties:
            queued_jobs: { type: integer }
            running_jobs: { type: integer }
            completed: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            fleet_failed: { type: integer, description: How many of failed this fleet caused. }
            cancelled: { type: integer }
            unknown: { type: integer }
            median_wait_ms: { type: integer, format: int64 }
            p95_wait_ms: { type: integer, format: int64 }
        runners:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            total: { type: integer }
        hosts:
          type: object
          properties:
            total: { type: integer }
            healthy: { type: integer }
            cordoned: { type: integer }
            capacity: { type: integer }
            used: { type: integer }
        pools:
          type: array
          items:
            type: object
            properties:
              pool_id: { type: string }
              pool_name: { type: string }
              min: { type: integer }
              max: { type: integer }
              live: { type: integer }
              busy: { type: integer }
              idle: { type: integer }
              queued: { type: integer }
              utilisation: { type: number, format: double, minimum: 0, maximum: 1 }

    FleetSample:
      type: object
      properties:
        at: { type: string, format: date-time }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        fleet_queued_jobs: { type: integer, description: The same minute narrowed to the jobs this fleet has a hand in. Zero on samples taken before this was recorded. }
        fleet_running_jobs: { type: integer, description: As above, for jobs in progress. }
        idle_runners: { type: integer }
        busy_runners: { type: integer }
        total_runners: { type: integer }

    ScalingEvent:
      type: object
      properties:
        id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        from: { type: integer }
        to: { type: integer }
        reason:
          type: string
          description: The scheduler's own words, shown verbatim in the UI.
          examples: ["scaled linux-x64 2 -> 4: 3 jobs queued > 30s"]
        created_at: { type: string, format: date-time }

    # --- installations ----------------------------------------------------
    Installation:
      type: object
      properties:
        id: { type: string }
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string, examples: [acme, "acme/widgets"] }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string }
        app_slug: { type: string }
        web_url: { type: string }
        settings_url:
          type: string
          description: >-
            The App's own settings page on GitHub, which is the only place its
            avatar can be uploaded. Absent when the App's slug is unknown.
          examples: ["https://github.com/organizations/acme/settings/apps/zoomies-acme"]
        enterprise: { type: boolean }
        healthy: { type: boolean }
        last_error: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        pool_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InstallationCreate:
      type: object
      required: [app_id, installation_id, target, target_type, private_key]
      properties:
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string, default: "https://api.github.com" }
        private_key: { type: string, format: password, description: The App's PEM private key. Sealed before storage and never returned. }
        webhook_secret: { type: string, format: password }

    InstallationUpdate:
      type: object
      properties:
        target: { type: string }
        api_base_url: { type: string }
        private_key: { type: string, format: password }
        webhook_secret: { type: string, format: password }

    InstallationHealth:
      type: object
      properties:
        ok: { type: boolean }
        app_slug: { type: string }
        app_name: { type: string }
        message: { type: string, description: On failure, names the missing permission where GitHub tells us. }
        permissions: { type: object, additionalProperties: { type: string } }
        events: { type: array, items: { type: string } }
        missing_permissions: { type: array, items: { type: string } }
        missing_events: { type: array, items: { type: string } }
        rate_limit_remaining: { type: integer }
        repository_selection:
          type: string
          enum: [all, selected]
          description: >-
            GitHub's own word for how much of the target this installation covers. An App
            with every permission correct, installed on "only select repositories" and not
            on the one somebody pushes to, is a fleet where nothing ever queues and no page
            says why -- so the verify answer names it.
        repository_count:
          type: integer
          description: How many repositories the installation can see, up to the scan's own cap.
        repositories:
          type: array
          items: { type: string }
          description: The first few by name, so an operator can look for the one they expected.
        repositories_capped:
          type: boolean
          description: True when there are more than the names listed.

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        delivery_id: { type: string }
        event: { type: string }
        action: { type: string }
        repo: { type: string }
        status: { type: string, enum: [accepted, rejected, error] }
        error: { type: string }
        installation_id:
          type: string
          description: >-
            The installation whose webhook secret verified this delivery. It is not
            necessarily the one covering the repository: when none does, every configured
            secret is tried, and this says which one answered. Empty on a delivery that
            verified against none.
        received_at: { type: string, format: date-time }

    WebhookCheck:
      type: object
      properties:
        reachable: { type: boolean }
        url: { type: string }
        message: { type: string }
        fix: { type: string, description: The specific remedy - open a port, use a tunnel, configure the proxy. }
        polling_available: { type: boolean }
        last_delivery_at: { type: [string, "null"], format: date-time }

    # --- migrations -------------------------------------------------------
    MigrationOverride:
      type: object
      description: |
        One job sent somewhere other than the consolidated `mapping` says.

        It names exactly one place -- a job, in a workflow file, in a repository
        -- and nothing about it is a pattern: a pattern would match more than
        the operator read in the review step. A job the plan could not attribute
        to a name cannot be overridden, because there would be nothing stable to
        key on when the apply step re-reads the file.
      required: [repo, path, job]
      properties:
        repo: { type: string, examples: ["acme/widgets"], description: Compared case-insensitively, as GitHub does. }
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        job: { type: string, examples: ["integration"] }
        to:
          type: string
          examples: ["zoomies-linux-arm64"]
          description: >-
            The runs-on value this job gets. Empty leaves this one job on the rented runner it
            names today - a decision, reported with its own reason rather than as an unmapped
            label.

    MigrationRewrite:
      type: object
      description: One runs-on value a migration would change.
      properties:
        line: { type: integer, description: The 1-based line in the file as it is today. }
        job: { type: string, description: The workflow job the line belongs to, where indentation could tell. }
        label:
          type: string
          examples: ["ubuntu-latest"]
          description: >-
            The hosted-runner label being replaced, set only where the value asks for exactly
            one. A line carrying both a job and a label is one an override can name.
        from: { type: string, examples: ["ubuntu-latest"] }
        to: { type: string, examples: ["zoomies-linux-x64"] }
        overridden: { type: boolean, description: True when `to` came from an override rather than from the consolidated mapping. }

    MigrationSkip:
      type: object
      description: |
        A runs-on the migration deliberately left alone, and why. A skip is not
        a failure: a matrix expression, a job already on a self-hosted runner
        and a hosted label nobody mapped are all things a person has to decide.
      properties:
        line: { type: integer }
        job: { type: string }
        label:
          type: string
          description: >-
            The hosted-runner label this job asks for, set only where the value asks for exactly
            one. A skip carrying both a job and a label is one an override can settle; a
            ${{ }} expression carries neither, because no override can decide it.
        value: { type: string }
        reason: { type: string }

    MigrationWorkflow:
      type: object
      properties:
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        sha: { type: string, description: The blob SHA the plan was computed against. }
        rewrites: { type: array, items: { $ref: "#/components/schemas/MigrationRewrite" } }
        skips: { type: array, items: { $ref: "#/components/schemas/MigrationSkip" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this file asks for, mapped or not.
        diff: { type: string, description: A unified diff of the change, empty when the file is untouched. }

    MigrationRepo:
      type: object
      properties:
        repo: { type: string, examples: ["acme/widgets"] }
        default_branch: { type: string }
        workflows: { type: array, items: { $ref: "#/components/schemas/MigrationWorkflow" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this repository asks for - GitHub's own and the vendors' - mapped or not.
        error: { type: string, description: Set when this repository could not be read; the rest of the plan still stands. }
        archived:
          type: boolean
          description: >-
            The repository is archived and therefore read-only, so no pull request can be
            opened against it. Its workflows are not read, and it is never counted as
            something the migration would change.
        on_zoomies:
          type: boolean
          description: At least one job in this repository already runs on a pool of this fleet.

    MigrationPoolOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        runs_on: { type: string, description: What a workflow writes to reach this pool, and the value a mapping should hold. }
        enabled: { type: boolean }

    MigrationCounts:
      type: object
      properties:
        repos: { type: integer }
        workflows: { type: integer }
        jobs: { type: integer }
        skipped: { type: integer }

    MigrationPlan:
      type: object
      properties:
        installation_id: { type: string }
        target: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/MigrationRepo" } }
        hosted_labels: { type: array, items: { type: string } }
        mapping:
          type: object
          additionalProperties: { type: string }
          description: What was applied - the request's mapping, or the one the server proposed.
        overrides:
          type: array
          items: { $ref: "#/components/schemas/MigrationOverride" }
          description: >-
            The exceptions that were applied on top of the mapping, echoed back so a plan
            describes itself.
        unmapped:
          type: array
          items: { type: string }
          description: Hosted labels no pool was proposed for. Jobs on these are left where they are.
        pools: { type: array, items: { $ref: "#/components/schemas/MigrationPoolOption" } }
        counts: { $ref: "#/components/schemas/MigrationCounts" }
        truncated: { type: boolean, description: True when there are more repositories after this page. }
        next_cursor: { type: string, description: Send as `cursor` to read the next page of repositories. Absent on the last page. }
        total_repos: { type: integer, description: How many repositories the installation can see in total, of which this is one page. }
        missing_permissions:
          type: array
          items: { type: string }
          description: >-
            What the App still needs before pull requests can be opened. Reported here,
            in the step before, because discovering it halfway through leaves half the
            pull requests open.
        permission_hint: { type: string }
        settings_url: { type: string, description: The App's settings page, where the missing permissions are granted. }

    MigrationResult:
      type: object
      properties:
        repo: { type: string }
        status: { type: string, enum: [opened, skipped, failed] }
        pull_request_url: { type: string }
        pull_request_number: { type: integer }
        branch: { type: string }
        workflows: { type: integer }
        jobs: { type: integer }
        reason: { type: string, description: Why it was skipped, or how it failed. }
        badge:
          type: string
          enum: [added, present, no_readme, unread, off]
          description: >-
            What became of the README badge on a pull request that was opened. `present`
            means the README already carried it; `no_readme` that there was no Markdown
            README to put it in; `unread` that GitHub would not hand the README over; `off`
            that the request asked for none.
        badge_reason: { type: string, description: Which kind of nowhere a `no_readme` was, or what GitHub said for an `unread`. }

    MigrationOutcome:
      type: object
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/MigrationResult" } }
        opened: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }

    # --- pools ------------------------------------------------------------
    Resources:
      type: object
      properties:
        cpus: { type: number, format: double, examples: [2] }
        memory_mb: { type: integer, format: int64, examples: [4096] }
        disk_gb: { type: integer, format: int64 }
        pids_limit: { type: integer, format: int64 }

    PoolPlatform:
      type: object
      description: One row of the runner image catalogue.
      properties:
        os: { type: string, examples: [ubuntu] }
        os_version: { type: string, examples: ["24.04"] }
        label: { type: string, examples: ["Ubuntu 24.04"] }
        image: { type: string, examples: ["ghcr.io/eyupio/zoomies-runner:ubuntu-2404"] }
        arches: { type: array, items: { type: string }, examples: [[amd64, arm64]] }
        default: { type: boolean, description: True for the variant :latest points at. }

    Platform:
      type: object
      description: >-
        The machine a pool's runners need, or the machine a host is. Every field
        is optional; an empty field is a promise nobody made and matches
        anything. A pool's platform selects its runner image and restricts the
        hosts the scheduler may place its runners on.
      properties:
        os:
          type: string
          description: A distribution, not a kernel - "linux" cannot pick a runner image.
          enum: [ubuntu, debian, fedora, rocky, macos, windows]
          examples: [ubuntu]
        os_version: { type: string, examples: ["24.04"] }
        arch: { type: string, enum: [amd64, arm64], examples: [arm64] }
    UsageResponse:
      type: object
      required: [from, to, group_by, items, costs_are_estimates, allocation_attributable, history_from]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string, enum: [installation, repository, workflow, pool, host] }
        costs_are_estimates: { type: boolean, const: true }
        allocation_attributable:
          type: boolean
          description: |
            Whether allocated runner lifetime, and therefore cost, can be
            attributed to this grouping at all. A runner idles on behalf of a
            pool, never on behalf of a repository or a workflow, so it is false
            for the repository and workflow groupings and every row's
            allocated_runner_seconds is null.
        history_from:
          type: object
          required: [jobs, runners]
          description: |
            Where the history each figure is computed from begins, given what
            retention has already pruned. Job counts, execution time and
            queue waits come from job rows; allocated runner time and cost
            from runner rows, which are kept for less time by default. A
            report whose `from` is earlier than one of these is complete only
            from that instant on. Null means that history is never pruned.
          properties:
            jobs: { type: string, format: date-time, nullable: true }
            runners: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [key, job_execution_seconds, allocated_runner_seconds, jobs, jobs_started, jobs_completed, average_queue_wait_seconds, peak_concurrency]
            properties:
              history:
                type: array
                items: { $ref: "#/components/schemas/UsageBucket" }
              succeeded: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              unknown: { type: integer }
              key: { type: string }
              job_execution_seconds: { type: number, description: Job execution time clipped to the reported interval. }
              allocated_runner_seconds:
                type: number
                nullable: true
                description: Runner lifetime clipped to the interval, or null when the grouping cannot attribute it. Null is not zero.
              jobs: { type: integer, description: "Jobs queued within the interval. Counts are additive: adjacent reports sum." }
              jobs_started: { type: integer, description: Jobs whose run began within the interval. }
              jobs_completed: { type: integer, description: Jobs that finished within the interval. }
              average_queue_wait_seconds:
                type: number
                nullable: true
                description: Mean wait of the jobs_started jobs, so the denominator is the population with an observed wait. Null when nothing started in the interval.
              peak_concurrency: { type: integer }
              estimated_cost: { type: number, description: Estimate from administrator-assigned pool rates; omitted when no rate exists. }

    UsageBucket:
      type: object
      required: [from, queued, started, succeeded, failed, cancelled, unknown, execution_seconds, allocated_seconds, capacity_samples, capacity_reached]
      properties:
        from: { type: string, format: date-time }
        queued: { type: integer }
        started: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        unknown: { type: integer }
        execution_seconds: { type: number }
        allocated_seconds: { type: number }
        capacity_samples: { type: integer, description: Observed pool minutes; zero means no capacity telemetry. }
        capacity_reached: { type: integer, description: Observed pool minutes containing at least one capacity-blocked placement. Not incident count or exact duration. }

    PoolPrewarm:
      type: object
      properties:
        pool_id: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        image: { type: string }
        state: { type: string, enum: [pending, succeeded, failed] }
        digest: { type: string }
        error: { type: string }
        updated_at: { type: string, format: date-time }

    Pool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        installation_id: { type: string }
        installation_target: { type: string }
        labels: { type: array, items: { type: string } }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image: { type: string }
        effective_image:
          type: string
          description: >-
            The image this pool's runners will actually boot: image when the pool
            names one, otherwise the variant its platform selects, otherwise the
            instance default -- and then its Docker variant when the pool gives
            its jobs a daemon.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer }
        max_runners: { type: integer }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort per-repository runner creation limit; zero disables it. This cannot prevent GitHub from assigning work to compatible idle runners and is not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true, description: Optional administrator-assigned rate used only for estimates. }
        priority: { type: integer, default: 0, description: Higher-priority pools receive creation capacity before lower-priority pools. }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: >-
            The environment injected into every runner this pool creates.
            Readable in full by operators and administrators; a viewer is sent
            the keys with empty values, because this is where a registry or
            proxy credential ends up and setting one is an operator action.
            The same applies to the pool.created and pool.updated events.
        run_as_root: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            live: { type: integer }
        queued_jobs: { type: integer }
        utilisation: { type: number, format: double }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
          description: The dangerous settings this pool has in effect, if any.

    CacheConfig:
      type: object
      description: Disposable performance cache mounted at /opt/zoomies-cache; it is not persistent workflow storage and may be evicted.
      required: [enabled, scope]
      properties:
        enabled: { type: boolean, default: false }
        scope:
          type: string
          enum: [pool, repository]
          default: pool
          description: >-
            Repository scope gives each repository its own cache. Under an
            organisation-targeted installation it needs `repository` set,
            because the installation alone does not say which repository the
            pool serves.
        size_limit:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Maximum bytes, enforced between one runner and the next by evicting
            whole cache entries, least recently modified first. Only a cache in
            a host directory can be measured, so a non-zero limit requires
            `source` to be an absolute host path. Zero is unlimited.
        source: { type: string, description: Optional absolute host directory or safe named-volume prefix. }
        repository:
          type: string
          description: >-
            The repository a repository-scoped cache belongs to, as owner/name.
            Required when the pool's installation targets an organisation, and
            left empty when it targets a single repository, which supplies it.

    PoolCreate:
      type: object
      required: [name, installation_id, labels, backend]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`. Beyond the brand, Zoomies' own convention is
            zoomies-<vcpu>vcpu[-<memory>gb]-<os>-<version>[-<arch>], so the name
            a workflow's runs-on carries says how much machine it is asking for.
            Any name is accepted.
          examples: [zoomies-4vcpu-ubuntu-2404]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image:
          type: string
          description: >-
            Leave blank to follow the pool's platform, which selects a published
            zoomies-runner variant, or the instance default when the pool names
            no platform.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, default: 0, minimum: 0 }
        max_runners: { type: integer, default: 4, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation limit, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer, default: 0 }
        idle_timeout: { allOf: [{ $ref: "#/components/schemas/Duration" }], default: "5m" }
        ephemeral: { type: boolean, default: true }
        docker_mode: { allOf: [{ $ref: "#/components/schemas/DockerMode" }], default: none }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean, default: false }
        enabled: { type: boolean, default: true }

    # A PATCH body: every field is optional, and only the ones present are
    # changed. It repeats PoolCreate's properties rather than composing them,
    # because `allOf` keeps the parent's `required` list however empty the
    # child's is -- which would make a one-field change (switching a blocked
    # pool's backend, say) impossible to express in a generated client.
    PoolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`.
          examples: [zoomies-linux-x64]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, minimum: 0 }
        max_runners: { type: integer, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation limit, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean }
        enabled: { type: boolean }

    # --- runners ----------------------------------------------------------
    Runner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        github_runner_id: { type: integer, format: int64 }
        container_id: { type: string }
        ephemeral: { type: boolean }
        labels: { type: array, items: { type: string } }
        image: { type: string }
        image_digest: { type: string, description: Immutable digest resolved by the host backend. }
        runner_version: { type: string }
        current_job_id: { type: string }
        current_job: { $ref: "#/components/schemas/Job" }
        message: { type: string }
        fault_kind:
          $ref: "#/components/schemas/FaultKind"
        fault_fix:
          type: string
          description: >-
            What to do about this runner's failure. Empty on a runner that did not fail. A
            runner that failed before ever taking a job is the case this exists for:
            nothing else in the system says why a pool's containers will not start, because
            the jobs it was meant for are still queued and none of them is marked failed.
        jobs_handled: { type: integer }
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        allocated_cpus:
          type: number
          format: double
          description: >-
            The CPU quota this runner's workload was created with. Omitted when it has none.
            With `allocation_source` it is what tells an OOM kill or a slow job on a defaulted
            limit apart from one on a limit somebody set.
        allocated_memory_mb:
          type: integer
          format: int64
          description: The memory limit this runner's workload was created with. Omitted when it has none.
        allocation_source:
          type: string
          enum: [pool, host, ""]
          description: >-
            Where the allocation came from: `pool` for the pool's own limits, `host` for one
            slot's share of the host it landed on (the default when the pool sets none). Omitted
            when the runner was created with no limit at all.
        created_at: { type: string, format: date-time }
        container_started_at:
          type: string
          format: date-time
          description: >-
            When the runner's container (or process) started on its host. With registered_at
            it is what tells the two causes of a stuck runner apart: a container that never
            started is a backend or image problem on the host, and one that started and never
            registered is a credential, network or GitHub problem.
        registered_at:
          type: string
          format: date-time
          description: When the runner registered itself with GitHub.
        started_at: { type: [string, "null"], format: date-time }
        last_idle_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        cleanup_error:
          type: string
          description: >-
            Why Zoomies could not finish taking this runner away: a stop or remove the
            agent could not complete, or a registration GitHub would not delete. Empty is
            the normal case. A non-empty value means something is left behind — a container
            on its host, or a registration on the organisation — and it will not go away on
            its own. Zoomies retries, and this clears when it succeeds.
        cleanup_failed_at: { type: [string, "null"], format: date-time }
        cleanup_attempts:
          type: integer
          description: >-
            How many times cleanup has been tried. It is kept after a success, because how
            many tries it took is the difference between a blip and a host worth looking at.
        create_task_issued_at: { type: [string, "null"], format: date-time, description: "First create task delivered to the host; never overwritten by redelivery or removal. Absent for older runners." }
        host_removed_at: { type: [string, "null"], format: date-time, description: "Controller receipt of positive host removal confirmation, including the workload and work directory." }
        registration_deleted_at: { type: [string, "null"], format: date-time, description: "Controller confirmation that the GitHub registration is absent." }
        cleanup_estimated_at: { type: [string, "null"], format: date-time, description: "Historical cleanup estimate from an older build; not confirmation that both sides were removed." }
        cleaned_up_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The end of the runner's life: nothing of it left, on the host or on GitHub. The
            counterpart of `created_at` at the other end.

    RunnerDetail:
      allOf:
        - $ref: "#/components/schemas/Runner"
        - type: object
          properties:
            host: { $ref: "#/components/schemas/Host" }
            pool: { $ref: "#/components/schemas/Pool" }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
            logs_available: { type: boolean, description: False when the runner's host is unreachable, so the UI can say why rather than showing an empty log. }

    JobExplanation:
      type: object
      required: [job_id, state, summary, waiting, blocked, computed_at]
      properties:
        job_id: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        summary:
          type: string
          description: >-
            The sentence. Always set, including for a job that is running or finished:
            "nothing is wrong" is an answer to the question.
        detail: { type: string, description: What the summary leaves out, in the scheduler's own words where it has any. }
        fix: { type: string, description: What to do. Absent means there is nothing to do, which is different from not knowing. }
        waiting: { type: boolean, description: Whether the job is still waiting on something. }
        blocked:
          type: boolean
          description: >-
            Whether waiting will not on its own end it. A fleet that is merely busy clears;
            a pool nothing can place never will, and the two need different advice.
        pool_id: { type: string }
        runner_id: { type: string }
        host_id: { type: string }
        computed_at: { type: string, format: date-time }

    Recovery:
      type: object
      required: [fenced]
      properties:
        fenced: { type: boolean }
        reason:
          type: string
          description: Why the fence is on -- normally the backup this database was restored from.

    Backup:
      type: object
      description: One backup, as the Backups tab lists it. The manifest's facts are lifted out flat.
      required: [id, taken_at, source, location, bytes, total_bytes, schema_migrations, secrets, key_matches, key_included, restorable]
      properties:
        id: { type: string, description: The backup's directory name., examples: [zoomies-20260916-120000] }
        taken_at: { type: string, format: date-time }
        source:
          type: string
          enum: [cli, manual, scheduled, uploaded, pre-migration]
          description: Who took it. `pre-migration` is a copy the store took before applying migrations.
        taken_by: { type: string }
        location:
          type: string
          enum: [backups, pre-migration]
          description: Which directory it is in.
        bytes: { type: integer, format: int64, description: The database's size. }
        total_bytes: { type: integer, format: int64, description: The whole directory, which is larger when the key is in it. }
        version: { type: string, description: The build that wrote it. }
        schema_latest: { type: string, description: The newest migration the copy had taken. }
        schema_migrations: { type: integer }
        integrity: { type: string }
        secrets: { type: integer, description: How many sealed credentials the key is needed for. }
        key_fingerprint: { type: string }
        key_matches:
          type: [boolean, "null"]
          description: Whether this host holds the key that sealed it. Null when the backup does not say.
        key_included: { type: boolean, description: The encryption key is in the backup, which makes it a credential. }
        restorable: { type: boolean, description: Every check a restore would make passes, from what the manifest says. }
        restore_problem: { type: string, description: Why not, or a caveat when it is. }
        problem: { type: string, description: Something wrong with the backup itself. }

    Backups:
      type: object
      required: [items, directory, database_bytes, disk_free_bytes, schedule, running, staged_restore, last_restore, restarting]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        directory: { type: string, description: Where backups are kept, resolved. }
        database_bytes: { type: integer, format: int64, description: The live database's size, which is roughly what a backup costs. }
        disk_free_bytes:
          type: [integer, "null"]
          format: int64
          description: Room beside the backup directory, when the platform can say.
        key_fingerprint: { type: string, description: This host's encryption key. }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }
        running: { type: boolean, description: A backup is being taken right now. }
        staged_restore:
          oneOf:
            - $ref: "#/components/schemas/StagedRestore"
            - type: "null"
        last_restore:
          oneOf:
            - $ref: "#/components/schemas/RestoreOutcome"
            - type: "null"
        restarting: { type: boolean, description: This process has been asked to stop, so wait for the next one. }

    BackupSchedule:
      type: object
      required: [enabled, interval, keep, next_due_at, last_scheduled_at]
      properties:
        enabled: { type: boolean }
        interval: { $ref: "#/components/schemas/Duration" }
        keep: { type: integer }
        next_due_at: { type: [string, "null"], format: date-time }
        last_scheduled_at: { type: [string, "null"], format: date-time }
        last_scheduled_id: { type: string }
        last_error: { type: string, description: Why the last scheduled backup failed, when it did. }

    BackupVerification:
      type: object
      required: [checked_at, ok, integrity, digest_known, digest_matches, schema_readable, migrations, problems]
      properties:
        checked_at: { type: string, format: date-time }
        ok: { type: boolean }
        integrity: { type: string, description: SQLite's own answer -- `ok`, or what it found. }
        digest_known: { type: boolean, description: The manifest recorded a digest to compare against. }
        digest_matches: { type: boolean }
        schema_readable: { type: boolean, description: This build can open it. }
        migrations: { type: integer }
        latest: { type: string }
        problems: { type: array, items: { type: string } }

    StagedRestore:
      type: object
      required: [backup_id, dir, requested_at, revoke_api_tokens, reset_agent_tokens]
      properties:
        backup_id: { type: string }
        dir: { type: string }
        taken_at: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        requested_by: { type: string }
        revoke_api_tokens: { type: boolean }
        reset_agent_tokens: { type: boolean }

    RestoreOutcome:
      type: object
      required: [backup_id, attempted_at, ok]
      properties:
        backup_id: { type: string }
        attempted_at: { type: string, format: date-time }
        ok: { type: boolean }
        error: { type: string, description: Why the restore did not happen. The controller started on the database it had. }
        report: { $ref: "#/components/schemas/RestoreReport" }

    RestoreReport:
      type: object
      required: [source, key_checked, invalidated, fenced]
      properties:
        source: { type: string }
        moved_aside: { type: string, description: Where the database that was there went. }
        moved_logs: { type: array, items: { type: string } }
        key_checked: { type: boolean }
        manifest_problem: { type: string }
        invalidated: { type: array, items: { type: string }, description: What the restore took away, one line each. }
        fenced: { type: string, description: The reason recorded on the fence. }

    Restarting:
      type: object
      required: [restarting, message]
      properties:
        restarting: { type: boolean }
        message: { type: string }

    SupportBundle:
      type: object
      required: [bundle_version, generated_at, instance, errors]
      properties:
        bundle_version:
          type: integer
          description: >-
            The shape's own number, so a reader given a bundle out of context knows what
            it is looking at. It moves when a section is removed or renamed, not when one
            is added.
        generated_at: { type: string, format: date-time }
        instance: { $ref: "#/components/schemas/BundleInstance" }
        config:
          type: object
          additionalProperties: true
          description: The effective configuration, the same key-by-key rendering /settings serves.
        findings:
          type: array
          description: The configuration validator's findings, the same list /settings carries.
          items: { $ref: "#/components/schemas/Problem" }
        problems:
          type: object
          description: Everything currently wrong, the same shape /problems serves.
          required: [ok, items]
          properties:
            ok: { type: boolean }
            items:
              type: array
              items: { $ref: "#/components/schemas/Problem" }
        stats: { $ref: "#/components/schemas/Stats" }
        installations:
          type: array
          items: { $ref: "#/components/schemas/Installation" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/Pool" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        providers:
          type: array
          description: The providers this fleet rents from, the same shape /providers serves.
          items: { $ref: "#/components/schemas/Provider" }
        machines:
          type: array
          description: The machines it is renting, newest first and excluding the ones whose resource is confirmed gone.
          items: { $ref: "#/components/schemas/Machine" }
        runners:
          type: array
          items: { $ref: "#/components/schemas/Runner" }
        jobs:
          type: array
          description: >-
            The work in flight rather than the history. A bundle is taken because
            something is stuck, and finished jobs would be most of the bytes while
            answering none of it.
          items: { $ref: "#/components/schemas/Job" }
        explanations:
          type: array
          description: The controller's own answer for each unfinished job, the same one the drawer and the CLI render.
          items: { $ref: "#/components/schemas/JobExplanation" }
        scaling_events:
          type: array
          items: { $ref: "#/components/schemas/ScalingEvent" }
        logs: { $ref: "#/components/schemas/BundleLogs" }
        errors:
          type: array
          description: Why a section is missing. A bundle with nine sections and a named failure is worth more than a 500.
          items: { $ref: "#/components/schemas/BundleError" }
        truncated:
          type: array
          items: { $ref: "#/components/schemas/BundleTruncation" }

    BundleInstance:
      type: object
      description: What this process is and how it is doing -- the half of a bug report that is never in the fleet's own rows.
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go: { type: string }
        os: { type: string }
        arch: { type: string }
        cpus: { type: integer }
        goroutines: { type: integer }
        heap_in_use_bytes: { type: integer, format: int64 }
        config_path: { type: string }
        database_path: { type: string }
        schema_applied: { type: integer }
        schema_latest: { type: string }
        event_subscribers: { type: integer }
        polling_only: { type: boolean }
        poller_enabled: { type: boolean }
        poller_last_poll_at: { type: string, format: date-time }
        loop_panics:
          type: array
          description: >-
            The one fact here that is always a bug in Zoomies. A loop that panicked was
            restarted and the fleet carried on, so nothing else in a bundle would show it.
          items:
            type: object
            properties:
              loop: { type: string }
              count: { type: integer }
              last: { type: string }
              at: { type: string, format: date-time }

    BundleLogs:
      type: object
      description: Where the logs are, rather than the logs.
      properties:
        note: { type: string, description: Why the bodies are not here. }
        runners:
          type: array
          items:
            type: object
            properties:
              runner_id: { type: string }
              name: { type: string }
              state: { $ref: "#/components/schemas/RunnerState" }
              pool_id: { type: string }
              download: { type: string, description: The route that fetches this runner's log. }

    BundleError:
      type: object
      required: [section, error]
      properties:
        section: { type: string }
        error: { type: string }

    BundleTruncation:
      type: object
      required: [section, reason]
      properties:
        section: { type: string }
        kept: { type: integer, description: How many rows survived, where the cap was a row count. }
        reason: { type: string }

    TimelineEntry:
      type: object
      properties:
        state: { $ref: "#/components/schemas/RunnerState" }
        stage:
          type: string
          description: >-
            A finer point within the state, when one was observed: the image was pulled,
            the container started, the runner registered with GitHub.
          enum: [image_pulling, container_started, registered]
        at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64, description: How long the runner stayed in this state. }
        message: { type: string }

    # --- jobs -------------------------------------------------------------
    Job:
      type: object
      properties:
        provisioning: { type: string, enum: ["", paused, deleted], description: "Operator demand control; empty means ready." }
        provision_now: { type: boolean, description: Expedite demand within pool priority and bypass scale-up delay. }
        id: { type: string }
        github_job_id: { type: integer, format: int64 }
        github_run_id: { type: integer, format: int64 }
        repo: { type: string }
        workflow: { type: string }
        job_name: { type: string }
        labels: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/JobState" }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        installation_id:
          type: string
          description: >-
            The GitHub App installation covering this job's repository, resolved when the job
            was first recorded. Read-only. A pool only ever runs work in its own installation's
            target, so a pool whose labels fit is still not eligible unless this matches it.
            Empty when no installation here covers the repository.
        pool_id: { type: string }
        pool_name: { type: string }
        runner_id: { type: string }
        runner_name: { type: string }
        html_url: { type: string, description: The run on GitHub. }
        matched: { type: boolean, description: "False when no enabled pool claims this job's labels. On a job that is not queued this only says the job ran somewhere else." }
        eligible_at: { type: string, format: date-time, description: "When this fleet could first have acted on the job - an enabled pool claiming its labels. The start of the scheduling-latency interval, and deliberately not queued_at: the wait before anything could run the job is not this fleet's. Absent on a job nothing has claimed." }
        hosted: { type: boolean, description: "True when every label names GitHub's own runners or a hosted-runner vendor's, so a job no pool here claims is theirs to run rather than stuck." }
        head_branch: { type: string, description: The branch the run was for. }
        head_sha: { type: string }
        run_attempt: { type: integer, description: "1 for a first run; higher when the run was re-run." }
        steps:
          type: array
          description: >-
            The job's steps as GitHub last reported them. A completed job carries every
            step with its conclusion; a running one carries them mid-flight.
          items: { $ref: "#/components/schemas/JobStep" }
        failed_step:
          description: >-
            The step a completed job stopped at: the first that did not succeed, whether the
            job failed there or was cancelled there. Null when every step succeeded or while
            the job is still running. Worked out by the server so every client names the same step.
          oneOf:
            - $ref: "#/components/schemas/JobStep"
            - type: "null"
        runner_fault:
          type: string
          description: >-
            Set when the runner of this fleet that was executing the job stopped before
            GitHub reported the job over -- the fleet's own explanation of a failure GitHub
            records like any other. Empty when the runner did nothing wrong.
        fault_kind:
          $ref: "#/components/schemas/FaultKind"
        fault_domain:
          type: string
          enum: [fleet, workflow]
          description: >-
            Whose the failure is. `fleet` means this deployment is the reason the job went
            wrong; `workflow` means the job failed on its own merits and the fleet did its
            part. Empty on a job that did not fail. GitHub records both as "failure", which
            is the whole reason this field exists: the two need completely different people.
        fault_fix:
          type: string
          description: >-
            What to do about a fault of this kind, in the words of the person who has to do
            it. Empty when there is nothing to do, which is different from not knowing.
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        queue_wait_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }

    JobStep:
      type: object
      properties:
        number: { type: integer }
        name: { type: string }
        status: { type: string, examples: [queued, in_progress, completed] }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    FaultKind:
      type: string
      description: >-
        Why the fleet, rather than the workflow, is the reason something went wrong.

        Every kind exists because something different is done about it, and the
        `fault_fix` beside it says what. `out_of_memory` is a limit to raise;
        `host_lost` is a machine or an agent to look at; `image` is a tag or a registry;
        `registration` is the GitHub App's permissions; `backend` is the container daemon
        on the host, which is the "cannot start the runner container" case; `backend_busy`
        is that daemon answering too slowly rather than not at all, which is a host carrying
        more work than it can keep up with and is fixed on the pool's limits or the host's
        capacity; `config` is a
        setting the runner itself refused, and until it is edited every runner in the pool
        will do the same thing; `out_of_disk` is a full host; `removed` is an operator who
        meant it, and needs no fixing. `runner_exited` is the unclassified case on purpose
        -- a runner that stopped for a reason nobody observed, including one reported by an
        agent newer than this controller. Guessing a kind would send somebody to fix
        something that is not broken.

        Empty means the fleet has nothing to confess.
      enum: [host_lost, out_of_memory, out_of_disk, removed, image, registration, backend, backend_busy, config, runner_exited]

    JobEventKind:
      type: string
      description: >-
        What happened. `runner_lost` is the one entry GitHub cannot produce: the runner
        stopped under the job, and GitHub will report an ordinary failure. `waiting` and
        `approved` bracket a deployment review: the time between them is GitHub's, and
        the queue wait starts at `approved`. `runner_returned` withdraws a `runner_lost`:
        the host was silent long enough to be given up on, came back with the runner
        still executing this job, and the job is being left to finish.
        `runner_start_failed` is the failure that touches no job: a runner this pool
        started died before it could take one, so the job is still queued and the next
        runner may run it -- said here because a pool that cannot start a container
        otherwise looks exactly like a pool that is merely busy.
      enum: [queued, waiting, approved, claimed, unmatched, started, completed, runner_lost, runner_returned, cancel_requested, runner_start_failed, rerun_requested]

    JobEvent:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        kind: { $ref: "#/components/schemas/JobEventKind" }
        source:
          type: string
          description: Who observed it. A timeline that is all `poller` is a controller no webhook reaches.
          enum: [webhook, poller, agent, controller]
        message: { type: string, description: One sentence, written for an operator. }
        runner_id: { type: string }
        runner_name: { type: string }
        at: { type: string, format: date-time }

    # --- hosts ------------------------------------------------------------
    HostUsage:
      type: object
      properties:
        cpu_percent: { type: number, minimum: 0, maximum: 100, description: Whole-host CPU occupied between samples, including I/O wait. Absent when unmeasured. }
        memory_available_mb: { type: integer, format: int64, minimum: 0, description: Whole-host available memory including reclaimable cache. Zero is a measured full host. }
        sampled_at: { type: string, format: date-time, description: Controller receipt time. Agent-provided timestamps are ignored. }
        cpu_high_since: { type: string, format: date-time, description: Beginning of sustained CPU pressure, owned by the controller. }
        cpu_held: { type: boolean, description: Admission held after sustained CPU pressure. Running jobs continue. Owned by the controller. }
        load_average_1m:
          type: number
          minimum: 0
          description: >-
            The kernel's one-minute load average for the whole machine, as the agent read it
            from /proc/loadavg. Absent when unmeasured. Judged against the host's CPU count:
            a load of at least twice the CPUs is what steps the throttle up, because a
            runnable queue that deep is a machine that has stopped keeping up even when the
            CPU figure saturates at 100.
    HostSample:
      type: object
      description: One host at one minute. Absent measurements are gaps, never zero.
      required: [host_id, at, capacity, active_runners]
      properties:
        host_id: { type: string }
        at: { type: string, format: date-time }
        capacity: { type: integer, description: The slots the host was taking that minute -- its configured capacity stepped down by any throttle. }
        active_runners: { type: integer }
        cpu_percent: { type: number, minimum: 0, maximum: 100, description: Whole-host CPU occupied, as the agent measured it. Absent when unmeasured or stale. }
        load_average_1m: { type: number, minimum: 0, description: The kernel's one-minute load average. Absent when unmeasured or stale. }
        cpus: { type: integer, description: The machine's CPUs, carried on every row so the chart can draw load against size. }
        memory_mb: { type: integer, format: int64 }
        memory_available_mb: { type: integer, format: int64, minimum: 0, description: Whole-host available memory including reclaimable cache. Absent when unmeasured or stale. }
        allocatable_cpus: { type: number, description: The machine less its reserve, with the floors applied. }
        allocatable_memory_mb: { type: integer, format: int64 }
        reserved_cpus: { type: number, description: What the live runners had promised away, from the last scheduling pass. Absent before one has run. }
        reserved_memory_mb: { type: integer, format: int64 }
        disk_total_mb: { type: integer, format: int64 }
        disk_free_mb: { type: integer, format: int64 }
    HostThrottle:
      type: object
      description: >-
        The rung the controller has stepped a host down to after sustained pressure. The
        controller owns every field: a heartbeat carries the measurements and never the
        decision, and an agent cannot set or clear one. Absent from a host on no rung.
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            The rung, 1 to 3. Each takes a quarter of the host's slots (to 75%, 50%, 25% of
            capacity, never below one slot) and lowers the CPU quota of every runner here that
            has one, down to half. Owned by the controller.
        since: { type: string, format: date-time, description: When this episode began, the first step up from none. Owned by the controller. }
        changed_at: { type: string, format: date-time, description: The last step in either direction, which the next step up is paced from. Owned by the controller. }
        calm_since: { type: string, format: date-time, description: The start of the calm streak the next step down waits on. Absent while the host is not calm. Owned by the controller. }
        reason: { type: string, description: Which measurement took the last step up, as one sentence. Owned by the controller. }
    BackendInfo:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/BackendKind" }
        available: { type: boolean }
        version: { type: string }
        rootless: { type: boolean }
        endpoint: { type: string }
        detail: { type: string, description: When unavailable, what is wrong and how to fix it. }
        supports_dind: { type: boolean }
        host_socket_path: { type: string, description: Where the host daemon's socket lives, for pools that opt into host-socket mode. }
        limits:
          type: object
          description: >-
            What the daemon said it can enforce. A runner is given a default limit only on a
            field the daemon can apply, and host.limits_unenforceable names the fields it
            cannot; `known` is false from an agent too old to have asked, which defaults nothing.
          properties:
            known: { type: boolean }
            cpu: { type: boolean, description: A CPU quota. A daemon that cannot apply one refuses the container. }
            memory: { type: boolean, description: A memory limit. A daemon that cannot apply one starts the container without it. }
            pids: { type: boolean, description: A pids limit. A daemon that cannot apply one ignores it. }

    Host:
      type: object
      properties:
        usage: { $ref: "#/components/schemas/HostUsage" }
        usage_fresh: { type: boolean, description: Usage is less than 90 seconds old. Unknown or stale readings retain reservation-based placement. }
        admission_reason: { type: string, description: Why current host pressure is holding new runner starts. Empty when no pressure hold applies. }
        throttle:
          allOf:
            - $ref: "#/components/schemas/HostThrottle"
          description: The throttle the controller has this host on. Absent when it is on none.
        throttle_reason:
          type: string
          description: >-
            The operator sentence for the throttle: what it took, why, what it is doing to the
            jobs already running, and how it ends. Empty when the host is not throttled.
          examples:
            - "throttled to 2 of 4 slots (step 2 of 3) after sustained pressure: the 1-minute load average is 30.0, at least twice the host's 8 CPUs; running jobs continue, the 1 runner with a CPU limit at 50% of it, and the throttle lifts one step after 5m of calm"
        effective_capacity:
          type: integer
          description: >-
            The slots this host takes right now: capacity stepped down by the throttle, and
            capacity itself when there is none. `free` is measured against it, so a throttled
            host never advertises a slot the next pass would refuse.
        unlimited_runners:
          type: integer
          description: >-
            How many of the live runners here were created with no CPU quota -- a pool with
            none and default limits off, a process pool, a daemon that cannot apply one, or a
            runner from before allocations were recorded. Omitted when zero. They are the
            runners a CPU hold can mean something about, since a throttle cannot slow them.
        id: { type: string }
        name: { type: string }
        address: { type: string }
        connection: { type: string, enum: [direct, tailcat], description: Connection observed by the controller at enrolment or the latest heartbeat. }
        embedded: { type: boolean, description: True for the agent running inside the controller process. }
        capacity: { type: integer }
        active_runners: { type: integer }
        free: { type: integer }
        backends: { type: array, items: { type: string } }
        backend_info: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        labels: { type: object, additionalProperties: { type: string } }
        os: { type: string, description: The kernel, as Go names it - linux, darwin, windows. }
        distro: { type: string, description: The distribution, e.g. ubuntu. Empty when the host has not said. }
        os_version: { type: string, description: The distribution's release, e.g. "24.04". }
        arch: { type: string }
        cpus: { type: integer, description: How much machine this host is. An agent in a container sees its cgroup's share, but a container runner runs beside it rather than inside that cgroup, so the daemon's larger view of the machine is the one reported. }
        memory_mb: { type: integer, format: int64 }
        disk_total_mb: { type: integer, format: int64, description: The filesystem holding the agent's work directory, where a runner's checkout and caches land. Zero means the agent did not measure it, which is not a full disk. }
        disk_free_mb: { type: integer, format: int64, description: What a runner may write to, which is less than what is unused by the reserve the filesystem keeps for root. }
        reserve_cpus: { type: integer, description: What the operator holds back from placement for the machine's own sake. Set through PATCH /hosts; a heartbeat never writes it. }
        reserve_memory_mb: { type: integer, format: int64 }
        reserve_disk_mb: { type: integer, format: int64 }
        allocatable_cpus:
          type: number
          description: >-
            The machine less its reserve: what the scheduler may place onto. The documented
            floors under the reserve -- half a core or a twentieth of the machine, whichever is
            larger, 512 MB of memory and 2 GB of disk -- are applied here, so what is shown is
            what is used. The CPU floor is what keeps the daemon, the agent and the kernel a
            core the runners' quotas can never take.
        allocatable_memory_mb: { type: integer, format: int64 }
        allocatable_disk_mb: { type: integer, format: int64 }
        reserved_cpus:
          type: number
          description: >-
            What the live runners already on this host have promised away, as of the last
            scheduling pass and from the snapshot that pass decided on. Disk is absent on
            purpose: free disk already contains what those runners have written, so charging
            their reservations too would count the same bytes twice.
        reserved_memory_mb: { type: integer, format: int64 }
        reserved_known:
          type: boolean
          description: >-
            False until a pass has run, because zero would read as an idle machine rather
            than as a question nobody has answered yet.
        resources_known:
          type: boolean
          description: >-
            Whether this host has reported what machine it is at all. An agent too old to say
            is placed by slots alone, which is what keeps an upgrade from emptying a fleet.
        platform: { $ref: "#/components/schemas/Platform" }
        platform_label: { type: string, examples: ["Ubuntu 24.04, arm64"] }
        canonical_name:
          type: string
          description: The name this machine would be given today, for a host called something that says nothing.
          examples: [zoomies-16vcpu-32gb-ubuntu-2404-build01]
        version: { type: string }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this agent build. }
        cordoned: { type: boolean }
        protocol_version:
          type: integer
          description: >-
            The agent protocol this host reported speaking. Absent from an agent old enough
            not to send one, which is not the same as incompatible -- it is the one case the
            controller cannot judge.
        incompatible:
          type: boolean
          description: >-
            Whether this host's agent speaks a protocol the controller does not. An
            incompatible host is excluded from placement exactly as a cordoned one is, and
            nothing else: its runners keep working and are drained as normal. Refusing its
            heartbeat instead would restart every agent in the fleet at once.
        incompatible_reason: { type: string, description: What to do about it, naming both protocol versions. }
        version_skew:
          type: string
          enum: [behind, ahead, differs]
          description: >-
            How this host's release stands to the controller's, absent when they match.
            `differs` is the honest answer for a pair the controller cannot order -- a
            development build, a fork's tag -- because a wrong order would send an operator
            to upgrade the wrong side. Two builds of one tag are the same release and are
            not skew.
        upgrade_command:
          type: string
          description: >-
            Copyable install.sh --upgrade command for an older or different remote agent,
            targeting the controller's published release or dev channel. Absent for embedded,
            matching or newer agents, and for unpublished controller builds. Contains no credentials.
        upgrade_version:
          type: string
          description: Controller build the upgrade is intended to match.
        upgrade_note:
          type: string
          description: What the command does, or why no safe published command can be offered.
        healthy: { type: boolean }
        last_heartbeat: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    JoinToken:
      type: object
      properties:
        id: { type: string }
        prefix: { type: string }
        created_by: { type: string }
        capacity: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        used_by_id: { type: string }
        usable: { type: boolean }

    # --- providers and machines -------------------------------------------
    ProviderKindName:
      type: string
      description: Which infrastructure a provider rents from. It is CHECKed in the schema, so a kind this build cannot speak cannot be stored.
      enum: [proxmox, fake]
    MachineState:
      type: string
      description: >-
        A machine's life, from a row that names nothing to a host that runs jobs. Deleted
        is the only terminal one: failed and quarantined still need attention, and a
        failed machine may still have a resource behind it.
      enum: [planned, creating, starting, bootstrapping, enrolling, ready, draining, deleting, deleted, failed, quarantined]

    Provider:
      type: object
      required: [id, kind, name, credentials_configured, enabled, paused, machines, owned]
      properties:
        id: { type: string, examples: [prv_k3f9qz2mx7ab] }
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string, examples: [proxmox-lab] }
        endpoint:
          type: string
          description: Where this controller reaches the provider. Not a secret - it is the address an operator typed - and showing it is how somebody tells two clusters apart on a page listing both.
          examples: ["https://pve.example.com:8006"]
        insecure_skip_verify: { type: boolean, description: Certificate verification is off for this provider, which the validator warns about rather than refusing. }
        connection:
          type: string
          enum: [direct, tailcat]
          description: >-
            How the controller reaches the endpoint: over the network, or through a
            `zoomies gateway` running beside the provider, for a hypervisor on a home
            network with no address the controller can route to. The gateway's address
            is sealed on the row and never returned, for the credential's reason.
        settings:
          type: object
          additionalProperties: { type: string }
          description: The non-secret answers to this driver's own settings, keyed as GET /providers/kinds describes them.
        credentials_configured:
          type: boolean
          description: >-
            Whether a credential is sealed in the row. The value itself never leaves the
            controller and has no field here: an audit row and a screenshot both outlive
            the person who took them.
        machine_labels: { type: object, additionalProperties: { type: string } }
        machine_capacity: { type: integer, description: How many runners one of this provider's machines may run at once. }
        machine_backend: { $ref: "#/components/schemas/BackendKind" }
        machine_platform: { $ref: "#/components/schemas/Platform" }
        machine_cpus: { type: number }
        machine_memory_mb: { type: integer, format: int64 }
        machine_disk_mb: { type: integer, format: int64 }
        pool_selector:
          type: object
          additionalProperties: { type: string }
          description: Which pools this provider may buy for. Empty means every pool.
        max_machines:
          type: integer
          description: >-
            The ceiling on machines this provider may own at once. Zero rents nothing,
            exactly as a pool's max_runners of zero runs nothing.
        max_creates_in_flight: { type: integer, description: How many machines may be being built at once. }
        idle_timeout_ms: { type: integer, format: int64, description: How long a machine may sit with nothing to do before it is drained. }
        cost_per_machine_hour: { type: number }
        enabled: { type: boolean }
        paused: { type: boolean, description: The operator's kill switch. It blocks new machines only. }
        paused_reason: { type: string }
        paused_until: { type: string, format: date-time, description: The breaker's own pause, which never un-presses the operator's. }
        held:
          type: string
          description: >-
            Why no new machine may be bought right now, in one sentence, or absent when one
            may. Computed rather than stored because it answers for the fence, the
            configuration and the row at once.
        consecutive_failures: { type: integer }
        last_check_at: { type: string, format: date-time }
        last_check_error: { type: string, description: The worst thing the last preflight found, in one sentence. }
        last_sweep_at: { type: string, format: date-time, description: When this provider was last asked for everything it believes it is running. }
        machines:
          type: object
          additionalProperties: { type: integer }
          description: How many machines this provider has, by state.
        owned:
          type: integer
          description: How many still believe they hold a resource, which is the number the ceiling and the bill are both counted in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProviderInput:
      type: object
      description: >-
        Creating and editing a provider take the same body. On a PATCH every field is
        optional and independent; what is not named is left alone.
      properties:
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string }
        endpoint: { type: string }
        ca_pem: { type: string, description: The certificate to trust for this endpoint, instead of turning verification off. }
        insecure_skip_verify: { type: boolean }
        connection:
          type: string
          enum: [direct, tailcat]
          description: >-
            Direct, or through a `zoomies gateway` beside the provider. Choosing direct on a
            provider that had a private connection clears its stored address.
        tailcat_address:
          type: string
          description: >-
            The address `zoomies gateway` printed. Sealed with the instance key and never
            returned; an empty string on a PATCH leaves the stored one alone. Giving one
            without naming a connection means tailcat.
        settings: { type: object, additionalProperties: { type: string } }
        credential:
          type: string
          description: >-
            Sealed with the instance key and never returned. An empty string leaves the
            stored credential alone, so a form with a blank password box does not erase it.
        machine_labels: { type: object, additionalProperties: { type: string } }
        machine_capacity: { type: integer, minimum: 1, default: 2 }
        machine_backend: { $ref: "#/components/schemas/BackendKind" }
        machine_platform: { $ref: "#/components/schemas/Platform" }
        machine_cpus: { type: number, minimum: 0 }
        machine_memory_mb: { type: integer, format: int64, minimum: 0 }
        machine_disk_mb: { type: integer, format: int64, minimum: 0 }
        pool_selector: { type: object, additionalProperties: { type: string } }
        max_machines: { type: integer, minimum: 0, default: 0 }
        max_creates_in_flight: { type: integer, minimum: 0, default: 1 }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        cost_per_machine_hour: { type: number, minimum: 0 }
        enabled: { type: boolean, default: true }

    ProviderSetting:
      type: object
      required: [key, label, kind, required, advanced]
      properties:
        key: { type: string, examples: [node] }
        label: { type: string, examples: [Node] }
        kind: { type: string, enum: [text, number, bool, choice, list, secret] }
        required: { type: boolean }
        advanced: { type: boolean, description: Put behind a disclosure, because a form that asks eleven questions to do the common thing gets abandoned. }
        help: { type: string, description: One operator-facing sentence. }
        consequence: { type: string, description: What choosing it means, in the voice the pool form uses for a choice that costs something. }
        discovers:
          type: string
          description: Which discovery list fills the choices, e.g. nodes.
        default: { type: string }
        source:
          type: string
          description: >-
            Where the answer is found when discovery cannot offer it: which page of the
            provider's own console, or which command on one of its machines. `help` says
            what the setting is; this says where to look.

    ProviderGuideStep:
      type: object
      required: [title]
      description: One thing to do before a provider of this kind can rent anything.
      properties:
        title: { type: string, examples: [An API token that can clone, start and delete guests] }
        detail: { type: string, description: What to do and why, shown as written. }
        command: { type: string, description: A shell snippet to copy, when the step is done in a terminal. }

    ProviderKind:
      type: object
      required: [kind, label, bootstrap, guide, settings]
      properties:
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        label: { type: string, examples: [Proxmox VE] }
        endpoint_example:
          type: string
          description: What an address for this kind looks like, scheme and port included, so the form can show one and fill the port in.
          examples: ["https://pve.example.com:8006"]
        endpoint_source: { type: string, description: Where the address is found, in the provider's own console's terms. }
        credential_source: { type: string, description: Where the credential is made, and what shape to paste it in. }
        ca_source: { type: string, description: Where the certificate to trust is found, and when to leave it empty. }
        guide:
          type: array
          description: >-
            What has to exist before this kind can rent a machine, in the order it is done.
            The wizard shows it before its first question, because each step is done
            somewhere other than the form.
          items: { $ref: "#/components/schemas/ProviderGuideStep" }
        bootstrap:
          type: string
          enum: [guest_agent, metadata, none]
          description: >-
            How the enrolment payload reaches a guest. "metadata" means it is readable by
            anyone who can read the machine's metadata, which is worth knowing before
            anything is bought.
        can_start_stop: { type: boolean }
        can_discover: { type: boolean }
        can_mark_ownership: { type: boolean, description: Whether the driver can write this controller's marks onto the resource itself. }
        async_operations: { type: boolean }
        cost_unit: { type: string, examples: [machine-hour] }
        settings:
          type: array
          items: { $ref: "#/components/schemas/ProviderSetting" }

    ProviderValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        warnings:
          type: array
          description: Answers that are legal and still cost something.
          items: { $ref: "#/components/schemas/Problem" }

    ProviderCheck:
      type: object
      required: [provider_id, ok, reachable, findings, checked_at]
      properties:
        provider_id: { type: string }
        ok:
          type: boolean
          description: Nothing found stops this provider being used. Warnings do not - they weaken the posture and say so.
        reachable:
          type: boolean
          description: >-
            Whether an answer came back at all. Separate from the findings because a
            provider that cannot be reached has one problem, not eleven.
        version: { type: string, description: The provider's own version, kept because "it worked" is worth little without "against what". }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        checked_at: { type: string, format: date-time }

    ProviderChoice:
      type: object
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
        consequence: { type: string, description: What picking it means, because a list of identifiers with no consequences is a list somebody guesses at. }

    ProviderDiscovery:
      type: object
      required: [nodes, storages, bridges, templates]
      description: What a credential can actually see. A provider with no such concept leaves a list empty rather than inventing one.
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        storages: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        bridges: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        templates: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        unavailable:
          type: string
          description: >-
            Why the lists are empty, when the provider could not be asked: the address did
            not answer, the credential was refused. Only a draft's discovery sets it; the
            saved provider's route answers with an error instead.

    Orphan:
      type: object
      required: [name, note]
      properties:
        name: { type: string, examples: [zoomies-mach-k3f9q] }
        note: { type: string, description: What to do about it, which for an untracked resource is always to look at it yourself. }

    ProviderOrphans:
      type: object
      required: [provider_id, provider_name, untracked, no_resource, unverified]
      properties:
        provider_id: { type: string }
        provider_name: { type: string }
        last_sweep_at: { type: string, format: date-time, description: When the untracked list was gathered, so a stale answer says so. }
        untracked:
          type: array
          description: Resources wearing this fleet's naming that no row accounts for. Zoomies never deletes one.
          items: { $ref: "#/components/schemas/Orphan" }
        no_resource:
          type: array
          description: Rows that hold nothing, which can be released without anything being lost.
          items: { $ref: "#/components/schemas/Machine" }
        unverified:
          type: array
          description: Machines whose ownership nothing has confirmed, including every quarantined one.
          items: { $ref: "#/components/schemas/Machine" }

    MachineTimelineEntry:
      type: object
      required: [phase, at]
      properties:
        phase: { type: string, examples: [bootstrapped] }
        at: { type: string, format: date-time }

    Machine:
      type: object
      required: [id, provider_id, name, state, labels, safe_to_delete, timeline, created_at, updated_at]
      properties:
        id: { type: string, examples: [mach_k3f9qz2mx7ab] }
        provider_id: { type: string }
        provider_name: { type: string }
        provider_kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string, examples: [zoomies-mach-k3f9q] }
        state: { $ref: "#/components/schemas/MachineState" }
        message: { type: string, description: Why it is where it is, in one sentence. }
        pool_id: { type: string, description: Which pool's unmet demand asked for this machine. Not ownership - a machine serves every pool its labels match. }
        pool_name: { type: string }
        resource_zone: { type: string, examples: [pve-1] }
        resource_id: { type: string, examples: ["143"] }
        address: { type: string }
        ownership_verified_at: { type: string, format: date-time, description: The last time a fresh observation agreed this resource is ours. }
        ownership_error: { type: string, description: What disagreed. A machine with one is never deleted by anything but a person. }
        host_id: { type: string }
        host_name: { type: string }
        capacity: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        operation: { type: string, enum: [create, start, stop, bootstrap, delete], description: The operation in flight, if any. }
        operation_id: { type: string, examples: [mop_k3f9qz2mx7ab] }
        operation_handle: { type: string, description: The provider's own handle for the call, which is what an operator pastes into its task log. }
        operation_holder: { type: string, description: The controller taking the step, so a machine stuck mid-create names the controller to go and look at. }
        operation_since: { type: string, format: date-time }
        outcome_unknown: { type: boolean, description: A call that went out and was never answered, which is the one thing a retry must not treat as a failure. }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        provider_error: { type: string, description: What the hypervisor complained about, in its own words. }
        bootstrap_error: { type: string, description: What went wrong inside the guest, in its own words. }
        safe_to_delete: { type: boolean, description: Whether the row alone says a delete would be safe. The delete itself asks the provider again. }
        safe_to_delete_why: { type: string, description: Why not, when it is not. }
        timeline:
          type: array
          description: The phases this machine actually reached. A phase it skipped is absent rather than zero.
          items: { $ref: "#/components/schemas/MachineTimelineEntry" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        idle_since: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, description: When the provider confirmed the resource was gone, by an inspect that could not find it. }

    # --- audit and administration ----------------------------------------
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        actor_kind: { type: string, enum: [user, token, agent, system, webhook] }
        action: { type: string, examples: ["pool.create", "runner.drain"] }
        target_kind: { type: string }
        target_id: { type: string }
        before: { type: string, description: JSON, with secrets redacted. }
        after: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        oidc_subject: { type: string }
        disabled: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }

    Identity:
      type: object
      properties:
        kind: { type: string, enum: [user, token, agent, system] }
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        must_change_password: { type: boolean }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        prefix: { type: string }
        revoked: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    Setting:
      type: object
      description: >-
        One configuration key: what it is, what this controller is running, where
        that value came from, and whether an administrator may change it here.
      required: [key, label, section, kind, summary, secret, configured, source, env, stored, editable, scope, live, pending]
      properties:
        key: { type: string, description: The dotted key, spelled as it is in zoomies.yaml., examples: ["scheduler.interval"] }
        label: { type: string, description: The setting's name in prose, for a person reading a form., examples: ["Scheduler interval"] }
        section: { type: string, description: The part before the first dot, which the UI groups under., examples: ["scheduler"] }
        kind:
          type: string
          enum: [string, enum, bool, optional_bool, int, duration, strings, labels]
          description: >-
            How to parse and render the value. `duration` is carried as the text an
            operator writes (30s, 5m, 168h) rather than as a number. `optional_bool`
            has three states, because unset means the value is derived from another
            setting.
        choices:
          type: array
          items: { type: string }
          description: The permitted values, when the kind is `enum`.
        summary: { type: string, description: One line saying what the setting does. }
        value:
          nullable: true
          description: What this controller is running. Absent for a secret.
        default:
          nullable: true
          description: What Zoomies uses when nothing says otherwise. Absent for a secret.
        secret: { type: boolean, description: A credential. Its value is never sent; `configured` says whether one is set. }
        configured: { type: boolean, description: Whether the effective value is non-empty. }
        source:
          $ref: "#/components/schemas/SettingSource"
        env: { type: string, description: The ZOOMIES_* variable that overrides this key., examples: ["ZOOMIES_SCHEDULER_INTERVAL"] }
        stored: { type: boolean, description: Whether this fleet's database holds a value for this key. }
        editable: { type: boolean, description: Whether an administrator may change it through this API. }
        scope:
          type: string
          enum: [instance, bootstrap, local]
          description: >-
            `instance` lives in the fleet's database. `bootstrap` is read before that
            database can be opened, so it cannot. `local` belongs to a standalone
            agent's own host.
        reason: { type: string, description: Why it is not editable, written for the person reading it. }
        live: { type: boolean, description: Whether a change is in force by the time the response is written. }
        restart_reason: { type: string, description: Why a change waits for a restart. }
        pending: { type: boolean, description: A stored value is waiting for that restart. }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    Settings:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
          description: >-
            The effective configuration as a nested object, shaped like the file.
            A secret never appears; each one contributes a `<key>_configured`
            boolean instead.
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }
          description: Every configuration key, in the order the documentation lists them.
        findings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        pending_restart:
          type: array
          items: { type: string }
          description: Settings stored since this process started that it cannot apply to itself.
        pinned_by_environment:
          type: array
          items: { type: string }
          description: >-
            Settings an environment variable is holding. A change to one of these
            would be stored and then overridden at the next restart, so it is refused.
        config_path: { type: string }
        restart_required_keys:
          type: array
          items: { type: string }
          description: Every key whose change waits for a restart, whether or not one is waiting now.
        version: { type: string }
        database_path: { type: string }
        event_subscribers: { type: integer }

    SettingsExport:
      type: object
      required: [export_version, exported_at, version, settings, secrets_configured]
      properties:
        export_version: { type: integer }
        exported_at: { type: string, format: date-time }
        exported_from: { type: string, description: The address the source instance answers on. }
        version: { type: string, description: The Zoomies build that wrote it. }
        settings:
          type: object
          additionalProperties: true
          description: The nested tree, shaped like zoomies.yaml.
        secrets_configured:
          type: array
          items: { type: string }
          description: Credentials that were set on the source and are not in this document.

    SettingsImportRequest:
      type: object
      required: [document]
      properties:
        document: { type: string, description: An export, or a zoomies.yaml, as text. YAML or JSON. }
        dry_run: { type: boolean, description: Plan and report; write nothing. }
        skip: { type: array, items: { type: string }, description: Keys in the document to leave out. }

    SettingsImportChange:
      type: object
      required: [key, current, incoming, action, live, secret]
      properties:
        key: { type: string }
        label: { type: string }
        section: { type: string }
        current: { nullable: true, description: The running value, as the settings page renders it. Never a secret's. }
        incoming: { nullable: true, description: The document's value, parsed. Never a secret's. }
        action: { type: string, enum: [change, unchanged, unset, refused] }
        live: { type: boolean, description: A change is in force at once; false waits for a restart. }
        secret: { type: boolean }
        reason: { type: string, description: Why it is refused. }

    SettingsImport:
      type: object
      required: [applied, changes, summary, secrets_configured]
      properties:
        applied: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/SettingsImportChange" } }
        summary:
          type: object
          required: [change, unchanged, unset, refused, skipped]
          properties:
            change: { type: integer }
            unchanged: { type: integer }
            unset: { type: integer }
            refused: { type: integer }
            skipped: { type: integer }
        secrets_configured: { type: array, items: { type: string } }
        settings: { $ref: "#/components/schemas/Settings" }

    # --- agent protocol (internal) ------------------------------------------
    # The wire types of the agent routes. internal/agent/protocol.go owns them;
    # these describe what it sends so the document is whole.
    AgentJoinRequest:
      type: object
      required: [protocol_version, join_token, name, capacity, os, arch, version, backends]
      properties:
        protocol_version: { type: integer }
        join_token: { type: string, format: password }
        name: { type: string }
        address: { type: string, description: How the host reports itself. The controller never dials it. }
        capacity: { type: integer, description: Concurrent runners the host accepts. 0 lets the join token or the CPU count decide. }
        os: { type: string }
        arch: { type: string }
        version: { type: string, description: The agent's build version, for skew warnings. }
        labels: { type: object, additionalProperties: { type: string } }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
    AgentJoinResponse:
      type: object
      properties:
        host_id: { type: string }
        agent_token: { type: string, description: Shown once. The controller keeps only its hash. }
        controller_version: { type: string }
        heartbeat_interval: { $ref: "#/components/schemas/Duration" }
    AgentHeartbeatRequest:
      type: object
      properties:
        usage: { $ref: "#/components/schemas/HostUsage" }
        protocol_version: { type: integer }
        capacity: { type: integer, description: The agent's configured value, sent for the log. The controller does not write it. }
        version: { type: string }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        runners: { type: array, items: { $ref: "#/components/schemas/RunnerReport" } }
    AgentHeartbeatResponse:
      type: object
      properties:
        ok: { type: boolean }
        cordoned: { type: boolean, description: Mirrors the host's cordon flag so the agent stops asking for work at once. }
        controller_version: { type: string }
        resync_requested: { type: boolean, description: Send a full runner report next time. Set after the controller restarts. }
    RunnerReport:
      type: object
      required: [runner_id, observed_at]
      properties:
        host_removed: { type: boolean, description: "Positive confirmation that backend removal completed, including its work directory; process exit alone is insufficient." }
        cleanup_error: { type: string, description: "Failure of autonomous host cleanup; retained until its retry succeeds." }
        runner_id: { type: string }
        state:
          description: >-
            The state the agent asserts, or empty once the workload is up: whether GitHub has
            handed the runner a job is not the agent's call.
          oneOf:
            - $ref: "#/components/schemas/RunnerState"
            - { type: string, const: "" }
        handle: { type: string, description: The backend's own name for the workload, such as a container ID. }
        phase: { type: string, enum: [starting, running, exited, exit_unknown, failed, gone] }
        exit_code: { type: integer }
        message: { type: string }
        stats: { $ref: "#/components/schemas/WorkloadStats" }
        github_runner_id: { type: integer, format: int64, description: Filled in once the runner has registered. }
        observed_at: { type: string, format: date-time }
    WorkloadStats:
      type: object
      properties:
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64 }
    AgentTaskKind:
      type: string
      enum: [create_runner, stop_runner, remove_runner, stream_logs, cancel_logs, prewarm_image]
    AgentTask:
      type: object
      description: One unit of work for an agent. Tasks are idempotent; the controller may redeliver one after a restart.
      required: [id, kind, issued_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        spec: { $ref: "#/components/schemas/RunnerSpec" }
        backend: { $ref: "#/components/schemas/BackendKind" }
        pool_id: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        stop_timeout: { type: integer, format: int64, description: Nanoseconds. Bounds a graceful stop. }
        stream_id: { type: string, description: The log relay a stream_logs or cancel_logs task concerns. }
        log_options: { $ref: "#/components/schemas/LogOptions" }
        issued_at: { type: string, format: date-time }
        attempt: { type: integer, description: "Deliveries of this task so far, from 1. A create that cannot tell whether its runner already exists fails a first delivery promptly and leaves a redelivery for the lease. Absent from older controllers." }
    RunnerSpec:
      type: object
      description: >-
        Everything a backend needs to create one runner. The one place a JIT config crosses
        the wire, which is why the agent transport requires TLS off loopback.
      properties:
        name: { type: string, description: The runner name GitHub will know it by. It doubles as the container name. }
        runner_id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        credentials:
          type: object
          description: The runner's registration credentials. Never logged, never shown.
          properties:
            jit_config: { type: string, format: password }
            registration_token: { type: string, format: password }
            url: { type: string, description: The organisation or repository URL the runner registers against. }
            runner_group: { type: string }
            labels: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        ephemeral: { type: boolean }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        repository: { type: string }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        run_as_root: { type: boolean }
        network: { type: string }
        work_dir: { type: string }
        runner_version: { type: string, description: The actions/runner release the process backend downloads. }
    LogOptions:
      type: object
      description: How a log relay reads the workload's output. The names are capitalised on the wire, as the Go type carries no JSON tags.
      properties:
        Follow: { type: boolean }
        Tail: { type: integer, description: Lines of backlog to send first. 0 means everything. }
        Since: { type: string, format: date-time }
        Timestamps: { type: boolean }
    AgentTaskResult:
      type: object
      required: [task_id, ok, completed_at]
      properties:
        task_id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        ok: { type: boolean }
        error: { type: string }
        handle: { type: string }
        image_pull_duration: { type: integer, format: int64, description: Nanoseconds. Absent when the backend cannot tell pulling from creation. }
        create_duration: { type: integer, format: int64, description: Nanoseconds. }
        container_started_at: { type: string, format: date-time }
        digest: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        completed_at: { type: string, format: date-time }
    AgentTaskBatch:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/AgentTask" } }
        backoff: { type: integer, format: int64, description: Nanoseconds to wait before polling again, when the controller sheds load. }
